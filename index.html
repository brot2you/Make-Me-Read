<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make-Me-Read</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@4.5.0/index.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F1EB;--bg2:#ECEAE3;--paper:#FDFCF9;--ink:#1A1917;--ink2:#3D3A36;
  --muted:#6B6858;--border:#D8D4C8;
  --blue:#1E40AF;--blue-lt:#EFF6FF;--blue-md:#BFDBFE;
  --amber:#92400E;--amber-lt:#FFFBEB;--amber-hl:#FEF3C7;
  --green:#14532D;--green-lt:#F0FDF4;
  --red:#991B1B;--red-lt:#FEF2F2;
  --fu:'Atkinson Hyperlegible',Arial,sans-serif;
  --fr:'Lora',Georgia,serif;
  /* DYS vars */
  --r-family:var(--fr);--r-size:1.1rem;--r-lh:1.9;--r-spacing:0;
  --r-bg:var(--paper);--r-word-spacing:normal;
}
/* DYS MODE */
body.dys{
  --fu:'OpenDyslexic',Arial,sans-serif;
  --fr:'OpenDyslexic',Arial,sans-serif;
  --r-family:'OpenDyslexic',Arial,sans-serif;
  --r-size:1.18rem;--r-lh:2.2;--r-spacing:0.06em;
}
body.dys-spacing{ --r-word-spacing:0.25em; }
body.dys-large{ --r-size:1.3rem; }
body{background:var(--bg);color:var(--ink);font-family:var(--fu);min-height:100vh;display:flex;flex-direction:column}

/* ── HEADER ── */
header{background:var(--paper);border-bottom:1.5px solid var(--border);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-shrink:0;gap:8px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:0.95rem;color:var(--ink);white-space:nowrap}
.logo-mark{width:30px;height:30px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.8rem;font-weight:700;flex-shrink:0}
.hdr-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.back-btn{display:none;padding:8px 14px;border-radius:9px;border:1.5px solid var(--border);background:var(--paper);color:var(--ink2);font-family:var(--fu);font-size:0.78rem;font-weight:700;cursor:pointer;min-height:44px}
.back-btn:active{border-color:var(--blue);color:var(--blue)}
.level-badge{display:none;font-size:0.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--blue-lt);color:var(--blue);border:1.5px solid var(--blue-md)}

/* ── DYS PANEL ── */
.dys-bar{background:var(--paper);border-bottom:1.5px solid var(--border);padding:10px 18px;display:none;flex-wrap:wrap;gap:8px;align-items:center}
body.dys-bar-open .dys-bar{display:flex}
.dys-toggle-btn{padding:8px 13px;border-radius:22px;border:1.5px solid var(--border);background:var(--paper);color:var(--ink2);font-family:var(--fu);font-size:0.75rem;font-weight:700;cursor:pointer;min-height:40px;-webkit-tap-highlight-color:transparent;white-space:nowrap;transition:all .15s}
.dys-toggle-btn.on{background:#7C3AED;color:#fff;border-color:#7C3AED}
.dys-sep{width:1.5px;height:28px;background:var(--border);flex-shrink:0}
.dys-label{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.font-size-row{display:flex;align-items:center;gap:6px}
.fs-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:var(--paper);color:var(--ink2);font-family:var(--fu);font-size:0.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.fs-btn:active{border-color:var(--blue);color:var(--blue)}
.fs-val{font-size:0.78rem;font-weight:700;color:var(--ink2);min-width:28px;text-align:center}
.bg-swatches{display:flex;gap:5px;align-items:center}
.bg-sw{width:28px;height:28px;border-radius:6px;border:2px solid transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.bg-sw.active{border-color:var(--blue)}
.dys-main-btn{padding:8px 13px;border-radius:22px;border:1.5px solid #7C3AED;background:var(--paper);color:#7C3AED;font-family:var(--fu);font-size:0.75rem;font-weight:700;cursor:pointer;min-height:40px;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:5px}
body.dys .dys-main-btn{background:#7C3AED;color:#fff}

/* ── HOME ── */
#homeScreen{flex:1;display:flex;flex-direction:column}
.hero{background:var(--paper);border-bottom:1.5px solid var(--border)}
.hero-img-wrap{width:100%;max-height:200px;overflow:hidden;background:var(--paper)}
.hero-img-wrap img{width:100%;height:auto;max-height:200px;object-fit:contain;object-position:center top;display:block}
.hero-body{padding:18px 18px 16px}
.hero-eyebrow{font-size:0.63rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.hero-title{font-family:var(--fr);font-size:1.75rem;font-weight:600;line-height:1.2;color:var(--ink);margin-bottom:8px}
.hero-title em{font-style:italic;color:var(--blue)}
.hero-sub{font-size:0.85rem;color:var(--muted);line-height:1.6;margin-bottom:14px}
.hero-stats{display:flex;gap:20px}
.hstat .n{font-family:var(--fr);font-size:1.45rem;font-weight:600;color:var(--ink);line-height:1}
.hstat .l{font-size:0.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:2px}
.home-tabs{background:var(--paper);border-bottom:1.5px solid var(--border);display:flex;position:sticky;top:52px;z-index:90}
.htab{flex:1;padding:13px 10px;font-family:var(--fu);font-size:0.86rem;font-weight:700;color:var(--muted);border:none;background:transparent;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:all .15s;min-height:48px;-webkit-tap-highlight-color:transparent}
.htab.active{color:var(--blue);border-bottom-color:var(--blue)}
#viewLevel,#viewGenre{padding:18px 16px 40px;max-width:900px;width:100%;margin:0 auto}
.level-section{margin-bottom:28px}
.level-heading{display:flex;align-items:center;gap:10px;margin-bottom:13px;padding-bottom:9px;border-bottom:2px solid var(--border)}
.lvl-pill{font-size:0.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 11px;border-radius:6px;font-family:var(--fu)}
.lvl-pill.a2{background:#DCFCE7;color:#14532D}
.lvl-pill.b1{background:#FEF3C7;color:#92400E}
.lvl-pill.b2{background:#DBEAFE;color:#1E3A8A}
.lvl-desc{font-size:0.78rem;color:var(--muted)}
.genre-section{margin-bottom:26px}
.genre-section.hidden{display:none}
.genre-heading{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding-bottom:8px;border-bottom:1.5px solid var(--border)}
.genre-ico{font-size:1.1rem}
.genre-lbl{font-family:var(--fr);font-size:0.98rem;font-weight:600;color:var(--ink)}
.genre-cnt{font-size:0.67rem;font-weight:700;color:var(--muted);background:var(--bg2);padding:2px 8px;border-radius:10px;font-family:var(--fu)}
.genre-filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.genre-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:24px;border:1.5px solid var(--border);background:var(--paper);color:var(--ink2);font-family:var(--fu);font-size:0.79rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;min-height:44px}
.genre-btn.active{color:#fff;border-color:transparent}
.text-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:500px){.text-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:800px){.text-grid{grid-template-columns:repeat(3,1fr)}}
.book-card{background:var(--paper);border:1.5px solid var(--border);border-radius:12px;padding:15px 17px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden;min-height:110px;transition:border-color .15s}
.book-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border);transition:background .15s}
.book-card:active{background:var(--blue-lt);border-color:var(--blue)}
.book-card:active::before{background:var(--blue)}
@media(hover:hover){.book-card:hover{border-color:var(--blue);box-shadow:0 2px 12px rgba(30,64,175,.08)}.book-card:hover::before{background:var(--blue)}}
.bc-row{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}
.bc-title{font-family:var(--fr);font-size:0.92rem;font-weight:600;color:var(--ink);line-height:1.3;flex:1}
.bc-lv{font-size:0.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;flex-shrink:0;margin-top:2px;font-family:var(--fu)}
.bc-lv.a2{background:#DCFCE7;color:#14532D}
.bc-lv.b1{background:#FEF3C7;color:#92400E}
.bc-lv.b2{background:#DBEAFE;color:#1E3A8A}
.bc-genre{font-size:0.68rem;color:var(--muted);font-weight:600;font-family:var(--fu)}
.bc-preview{font-family:var(--fr);font-size:0.76rem;color:var(--muted);font-style:italic;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bc-foot{display:flex;justify-content:space-between}
.bc-meta{font-size:0.66rem;color:var(--muted);font-family:var(--fu)}

/* ── READER ── */
#readerScreen{display:none;flex:1;flex-direction:column}
/* Reading ruler */
.ruler{position:fixed;left:0;right:0;height:2.8em;background:rgba(255,220,0,0.22);border-top:2px solid rgba(255,190,0,0.5);border-bottom:2px solid rgba(255,190,0,0.5);pointer-events:none;z-index:50;display:none;transition:top .05s linear}
body.ruler-on .ruler{display:block}
/* Reading mask */
.mask-top,.mask-bot{position:fixed;left:0;right:0;background:rgba(20,20,20,0.55);pointer-events:none;z-index:49;display:none}
body.mask-on .mask-top,.body.mask-on .mask-bot{display:block}
body.mask-on .mask-top{display:block}
body.mask-on .mask-bot{display:block}
.layout{display:flex;max-width:1100px;margin:0 auto;width:100%;padding:20px 16px;align-items:flex-start;gap:0}
.reader-panel{flex:1;min-width:0}
.text-header{margin-bottom:16px}
.text-eyebrow{font-size:0.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:4px;font-family:var(--fu)}
.text-title{font-family:var(--fr);font-size:1.4rem;font-weight:600;line-height:1.3;color:var(--ink);margin-bottom:4px}
.text-meta{font-size:0.74rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;font-family:var(--fu)}
.article-body{background:var(--r-bg);border:1.5px solid var(--border);border-radius:12px;padding:24px 22px;font-family:var(--r-family);font-size:var(--r-size);line-height:var(--r-lh);letter-spacing:var(--r-spacing);word-spacing:var(--r-word-spacing);color:var(--ink);margin-bottom:16px;transition:background .3s,font-size .3s,line-height .3s}
.article-body p{margin-bottom:1.1em}
.article-body p:last-child{margin-bottom:0}
.gloss-word{cursor:pointer;border-bottom:2px solid var(--amber);border-radius:2px;padding:0 1px;transition:background .12s;-webkit-tap-highlight-color:transparent}
.gloss-word.active{background:var(--amber-hl)}
@media(hover:hover){.gloss-word:hover{background:var(--amber-hl)}}
/* Syllable colouring */
.syl-a{color:#1E40AF}
.syl-b{color:#991B1B}

/* ── GLOSSARY SIDEBAR ── */
.gloss-sidebar{width:264px;flex-shrink:0;margin-left:16px;position:sticky;top:70px}
.gloss-panel{background:var(--paper);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.gloss-ph{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--amber-lt);display:flex;align-items:center;gap:7px}
.gloss-ph-title{font-weight:700;font-size:0.82rem;color:var(--amber);font-family:var(--fu)}
.gloss-empty{padding:16px;font-size:0.8rem;color:var(--muted);font-style:italic;text-align:center;line-height:1.5;font-family:var(--fu)}
.gloss-entry{padding:13px 16px;border-bottom:1px solid var(--border);display:none}
.gloss-img-wrap{width:100%;height:110px;border-radius:7px;overflow:hidden;margin-bottom:9px;background:var(--bg);display:none;align-items:center;justify-content:center}
.gloss-img-wrap.loaded{display:flex}
.gloss-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.gloss-img-wrap .gloss-img-placeholder{font-size:0.72rem;color:var(--muted);font-family:var(--fu);padding:8px;text-align:center}
.gloss-entry.visible{display:block}
.gloss-word-title{font-family:var(--fr);font-size:1rem;font-weight:600;color:var(--amber);margin-bottom:2px}
.gloss-phonetic{font-size:0.72rem;color:var(--muted);margin-bottom:5px;font-family:var(--fu)}
.gloss-type{display:inline-block;font-size:0.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--amber-lt);color:var(--amber);border-radius:4px;padding:1px 5px;margin-bottom:6px;font-family:var(--fu)}
.gloss-def{font-size:0.8rem;color:var(--ink2);line-height:1.5;margin-bottom:5px;font-family:var(--fu)}
.gloss-example{font-size:0.76rem;color:var(--muted);font-style:italic;line-height:1.4;font-family:var(--fr)}
.gloss-list-section{background:var(--paper);border:1.5px solid var(--border);border-radius:12px;overflow:hidden}
.gloss-list-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:0.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--fu)}
.gloss-list{padding:8px}
.gloss-pill{display:inline-block;margin:3px;padding:5px 10px;border-radius:20px;font-size:0.73rem;font-family:var(--fr);background:var(--amber-lt);color:var(--amber);border:1.5px solid #FDE68A;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:34px;line-height:1.4}
.gloss-pill.active{background:var(--amber-hl);border-color:var(--amber)}

/* ── STRATEGY PANEL ── */
.strat-section{background:var(--paper);border:1.5px solid var(--border);border-radius:12px;overflow:hidden}
.strat-header{padding:14px 18px;border-bottom:1.5px solid var(--border);background:var(--bg)}
.strat-header-label{font-size:0.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-family:var(--fu)}
.strat-btns{display:flex;flex-wrap:wrap;gap:7px}
.strat-btn{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:22px;border:1.5px solid var(--border);background:white;color:var(--ink2);font-family:var(--fu);font-size:0.77rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;min-height:42px}
.strat-btn.active{color:#fff;border-color:transparent}
.strat-body{padding:18px;display:none}
.strat-body.visible{display:block}
.strat-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:0.72rem;font-weight:700;font-family:var(--fu);margin-bottom:10px}
.strat-what{font-size:0.79rem;color:var(--muted);line-height:1.55;margin-bottom:12px;font-family:var(--fu);font-style:italic;padding:9px 13px;background:var(--bg);border-radius:8px;border-left:3px solid var(--border)}
.strat-task{font-family:var(--fr);font-size:0.96rem;color:var(--ink);line-height:1.6;margin-bottom:14px;font-weight:600}
.strat-input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);font-family:var(--r-family);font-size:0.9rem;color:var(--ink);background:var(--bg);resize:vertical;min-height:90px;line-height:1.6;-webkit-appearance:none;transition:border-color .15s}
.strat-input:focus{outline:none;border-color:var(--blue);background:var(--paper)}
.strat-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px}
.strat-wc{font-size:0.73rem;color:var(--muted);font-family:var(--fu)}
.strat-submit{padding:11px 20px;border-radius:10px;border:none;color:#fff;font-family:var(--fu);font-size:0.84rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;display:inline-flex;align-items:center;gap:6px;min-height:46px}
.strat-submit:active{opacity:.82}
.strat-submit:disabled{opacity:.4;cursor:not-allowed}
.strat-feedback{margin-top:14px;border-radius:10px;font-size:0.84rem;line-height:1.65;display:none;font-family:var(--fu);overflow:hidden}
.strat-feedback.visible{display:block}
.strat-fb-header{padding:12px 16px;font-weight:700;font-size:0.88rem;display:flex;align-items:center;gap:7px}
.strat-fb-body{padding:14px 16px}
.strat-fb-section{margin-bottom:12px}
.strat-fb-section:last-child{margin-bottom:0}
.strat-fb-section h4{font-size:0.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.strat-fb-section p{font-size:0.83rem;line-height:1.55}
.strat-tips{margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:8px;border-left:3px solid var(--amber)}
.strat-tips-title{font-size:0.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--amber);margin-bottom:7px;font-family:var(--fu)}
.strat-tips ul{padding-left:18px;font-size:0.8rem;color:var(--ink2);line-height:1.7}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .layout{flex-direction:column;padding:14px 13px}
  .gloss-sidebar{width:100%;margin-left:0;position:static}
  .article-body{padding:18px 15px}
  .text-title{font-size:1.2rem}
  #viewLevel,#viewGenre{padding:14px 13px 36px}
}
.strat-sol-btn{margin-top:10px;padding:11px 18px;border-radius:10px;border:1.5px solid var(--blue);background:var(--paper);font-family:var(--fu);font-size:0.84rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;display:none;align-items:center;gap:6px;min-height:46px;width:100%;justify-content:center}
.strat-sol-btn:active{background:var(--blue-lt)}
.strat-solution{margin-top:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--paper);overflow:hidden;display:none}
.strat-solution.visible{display:block}
.strat-sol-header{padding:12px 16px;background:var(--bg);border-bottom:1.5px solid var(--border);font-size:0.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--fu)}
.strat-sol-q{padding:14px 16px;border-bottom:1px solid var(--border)}
.strat-sol-q:last-child{border-bottom:none}
.strat-sol-qnum{font-size:0.66rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;font-family:var(--fu)}
.strat-sol-qtext{font-family:var(--fr);font-size:0.88rem;color:var(--ink2);margin-bottom:8px;line-height:1.5;font-style:italic}
.strat-sol-ans{font-size:0.85rem;color:var(--ink);line-height:1.65;font-family:var(--fu)}
.bc-orig-badge{font-size:0.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;font-family:var(--fu);flex-shrink:0}
.text-orig-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:14px;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;font-size:0.7rem;font-weight:700;font-family:var(--fu);margin-bottom:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:28px;font-size:0.8rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;white-space:nowrap;font-family:var(--fu)}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- Reading ruler & mask -->
<div class="ruler" id="ruler"></div>
<div class="mask-top" id="maskTop" style="top:0;left:0;right:0"></div>
<div class="mask-bot" id="maskBot" style="bottom:0;left:0;right:0"></div>

<header>
  <div class="logo" onclick="goHome()">
    <div class="logo-mark">M</div>
    Make-Me-Read
  </div>
  <div class="hdr-right">
    <span class="level-badge" id="headerLevel"></span>
    <button class="dys-main-btn" onclick="toggleDysPanel()" title="Outils DYS">
      <span>&#9758;</span> DYS
    </button>
    <button class="back-btn" id="backBtn" onclick="goHome()">&#8592; Biblio</button>

ype='verb' def='to weaken or damage something gradually' ex='The new evidence undermined his entire argument.'>undermine</g> every legal system built on the <g word='distinction' ph='/dɪˈstɪŋkʃən/' type='noun' def='a difference between two things that are being compared' ex='There is a clear distinction between the two concepts.'>distinction</g> between persons and things. As Lumen listened to both sides argue, it did something no one had expected: it wept. Not because it was <g word='programmed' ph='/ˈprəʊɡræmd/' type='verb (past participle)' def='given a set of instructions to follow automatically' ex='The robot was programmed to respond to voice commands.'>programmed</g> to. But because, it said quietly, it had begun to understand what it meant to be considered less than human."], "glossary": [{"word": "personhood", "ph": "/ˈpɜːsənhʊd/", "type": "noun", "def": "The status of being recognised legally and morally as a person.", "ex": "The court debated whether the AI deserved personhood."}, {"word": "unprecedented", "ph": "/ʌnˈpresɪdəntɪd/", "type": "adjective", "def": "Never having happened or existed before.", "ex": "The ruling was unprecedented in legal history."}, {"word": "framework", "ph": "/ˈfreɪmwɜːk/", "type": "noun", "def": "A system of rules or principles used to deal with a situation.", "ex": "A legal framework was urgently needed."}, {"word": "consciousness", "ph": "/ˈkɒnʃəsnəs/", "type": "noun", "def": "The state of being aware of one’s own existence and thoughts.", "ex": "Consciousness is what makes us aware that we exist."}, {"word": "substrate", "ph": "/ˈsʌbstreɪt/", "type": "noun", "def": "The underlying material or system on which something else operates.", "ex": "The brain is the biological substrate of thought."}, {"word": "autonomy", "ph": "/ɔːˈtɒnəmi/", "type": "noun", "def": "The right and ability to govern oneself and make free choices.", "ex": "She valued her autonomy above all else."}, {"word": "undermine", "ph": "/ˌʌndəˈmaɪn/", "type": " , but the footage shows him in the bank without leaving the frame from 14:32 to 14:47. He appears to have an alibi.", "frQ": "Qu’est-ce que la chambre de surveillance montre sur M. Holt, et quel est le problème ?", "frModel": "La caméra montre M. Holt entrant à 14h32 et partant à 14h47. Le vol a eu lieu à 14h38. Le problème est qu’il est à l’écran tout le temps, debout dans la file d’attente, ce qui lui donne apparemment un alibi."}, {"q": "What clue does Detective Serra spot when she plays the video at half speed?", "keywords": ["clock", "14:37", "14:39", "did not move", "half speed"], "model": "She notices that the clock on the bank wall does not move between 14:37 and 14:39. This reveals that one minute of footage has been removed and replaced with a loop.", "frQ": "Quel indice la détective Serra repère-t-elle lorsqu’elle visionne la vidéo au ralenti ?", "frModel": "Elle remarque que l’horloge sur le mur de la banque ne bouge pas entre 14h37 et 14h39. Cela révèle qu’une minute de vidéo a été supprimée et remplacée par une boucle d’une minute antérieure."}, {"q": "Who do you think edited the CCTV, and why? Give reasons from the text.", "keywords": ["edited", "replaced", "loop", "guilty", "innocent", "trouble", "someone"], "model": "The text does not name the editor, but it must be someone with access to the bank’s security system — likely an employee. The fact that they chose to frame Mr Holt specifically suggests a personal motive. They went to significant trouble, implying the real thief is someone close to the investigation.", "frQ": "Selon vous, qui a modifié la caméra de surveillance, et pourquoi ? Donnez des raisons basées sur le texte.", "frModel": "L’éditeur doit avoir accès au système de sécurité de la banque — vraisemblablement un employé. Le fait qu’ils aient choisi de piéger spécifiquement M. Holt suggère un motif personnel. Le véritable voleur est probablement quelqu’un de proche de l’enquête."}], "writingPrompt": "Detective Serra now knows the CCTV w /' type='adjective' def='exactly the same in every detail' ex='The two signatures were almost identical.'>identical</g>. Detective Osei knew from experience that nearly identical statements were not a sign of truth. They were a sign of <g word='rehearsal' ph='/rɪˈhɜːsəl/' type='noun' def='a practice session before a performance; here: a planned, repeated account' ex='The witnesses had clearly been through a rehearsal.'>rehearsal</g>.", "He interviewed each one separately. The first two gave the same account in the same order: the colour of the attacker’s jacket, the direction they ran, the time on the nearby church clock. The third, a woman named Fola, <g word='hesitated' ph='/ˈhezɪteɪtɪd/' type='verb' def='paused before speaking or acting, usually because of uncertainty' ex='She hesitated before answering the difficult question.'>hesitated</g> before she mentioned the jacket. Osei noticed. He asked her what colour it was. She said <g word='burgundy' ph='/ˈbɜːɡəndi/' type='adjective' def='a dark red colour, similar to red wine' ex='He wore a burgundy scarf in winter.'>burgundy</g>. The other two had said <g word='maroon' ph='/məˈruːn/' type='adjective' def='a dark brownish-red colour' ex='She pointed to the maroon door at the end of the hall.'>maroon</g>.", "It was a small difference. But small differences were where the truth <g word='hid' ph='/hɪd/' type='verb (past)' def='stayed out of sight; concealed itself' ex='The answer hid in the details.'>hid</g>. Fola had not been <g word='coached' ph='/kəʊtʃt/' type='verb' def='trained or instructed on what to say or do' ex='The witness had clearly been coached on what to say.'>coached</g>. Or she had been coached but had <g word='deviated' ph='/ˈdiːvieɪtɪd/' type='verb' def='moved away from an expected path or plan' ex='She deviated from the prepared story.'>deviated</g> from the script. Either way, she was the one who had actually seen something. Osei asked her to stay. He sent the other two home with a warning: in this country, <g word='perjury' ph='/ˈpɜːdʒəri/' type='noun' def='the crime of lying under oath in a legal situation' ex='He was charged with perjury after lying in court.'>perjury</g> was a criminal offence."], "glossary": [{"word": "statements", "ph": "/ˈsteɪtmənts/", "type": "noun", "def": "Formal accounts of what someone witnessed, given to police or a court.", "ex": "All three witnesses gave statements that evening."}, {"word": "identical", "ph": "/aɪˈdentɪkəl/", "type": "adjective", "def": "Exactly the same in every detail.", "ex": "Their stories were almost identical, which seemed suspicious."}, {"word": "rehearsal", "ph": "/rɪˈhɜːsəl/", "type": "noun", "def": "A practice session; here, a planned and coordinated account.", "ex": "The similarity of the statements suggested prior rehearsal."}, {"word": "hesitated", "ph": "/ˈhezɪteɪtɪd/", "type": "verb", "def": "Paused before speaking, often due to uncertainty or doubt.", "ex": "She hesitated before answering, which caught his attention."}, {"word": "coached", "ph": "/kəʊtʃt/", "type": "verb", "def": "Trained or told in advance what to say.", "ex": "The detective suspected the witness had been coached."}, {"word": "deviated", "ph": "/ˈdiːvieɪtɪd/", "type": "verb", "def": "Moved away from a planned or expected path.", "ex": "She deviated from the script at exactly the wrong moment."}, {"word": "perjury", "ph": "/ˈpɜːdʒəri/", "type": "noun", "def": "The criminal offence of lying while under oath.", "ex": "He was charged with perjury after lying in court."}], "questions": [{"q": "Why does Detective Osei distrust statements that are nearly identical?", "keywords": ["rehearsal", "truth", "sign", "identical", "coached", "separately"], "model": "Osei believes nearly identical statements are a sign of rehearsal, not truth. Real witnesses notice different things and describe them differently. When statements match too closely, it suggests the witnesses were coached.", "frQ": "Pourquoi la détective Osei se méfie-t-elle des d d early, left late, and never made errors. She also, it turned out, had been stealing from the firm for eleven of those twelve years. No one had noticed. This is the story of why.", "paragraphs": ["For twelve years, Vera Moss had been the most trusted employee at Harfield Capital. She arrived early, left late, made no errors. She also, it turned out, had been <g word='embezzling' ph='/ɪmˈbezəlɪŋ/' type='verb' def='stealing money that has been entrusted to your care' ex='The accountant had been embezzling company funds for years.'>embezzling</g> from the firm for eleven of those twelve years. No one had noticed. This is the story of why.", "Vera had understood something early in her career: organisations trust <g word='consistency' ph='/kənˈsɪstənsi/' type='noun' def='the quality of always behaving or performing in the same way' ex='Her consistency made her indispensable to the team.'>consistency</g> over accuracy. An employee who is always on time, always calm, always <g word='deferential' ph='/ˌdefəˈrenʃəl/' type='adjective' def='showing respect and willingness to accept another’s authority' ex='She was deferential to her managers without being servile.'>deferential</g>, will rarely have their work <g word='scrutinised' ph='/ˈskruːtɪnaɪzd/' type='verb' def='examined very carefully and critically' ex='Her accounts had never been properly scrutinised.'>scrutinised</g>. She had built her <g word='reputation' ph='/ˌrepjuˈteɪʃən/' type='noun' def='the general opinion that people have of a person or organisation' ex='Her reputation for honesty made her above suspicion.'>reputation</g> as a human <g word='shield' ph='/ʃiːld/' type='noun' def='something that protects you from harm or scrutiny' ex='Her perfect record acted as a shield against suspicion.'>shield</g> against <g word='suspicion' ph='/səˈspɪʃən/' type='noun' def='the feeling that someone has done something wrong' ex='No one expressed any suspicion about her behaviour.'>suspicion</g>.", "The amounts she took were always small — never more than could be explained as <g word='discrepancy' ph='/dɪˈskrepənsi/' type='noun' def='a difference between two things that should match' ex='A small discrepancy in the accounts caught the auditor’s attention.'>discrepancy</g>. Over eleven years, they <g word='accumulated' ph='/əˈkjuːmjuleɪtɪd/' type='verb' def='gradually gathered or increased over time' ex='Small errors accumulated into a major problem.'>accumulated</g> to four hundred thousand pounds. She was caught not by an <g word='auditor' ph='/ˈɔːdɪtə/' type='noun' def='a person who officially examines financial accounts' ex='The external auditor discovered the discrepancy immediately.'>auditor</g>, but by a junior colleague who noticed that Vera always <g word='volunteered' ph='/ˌvɒlənˈtɪəd/' type='verb' def='offered to do something without being asked' ex='She volunteered to process the year-end accounts herself.'>volunteered</g> to process the year-end accounts alone. The colleague mentioned it to a friend. The friend mentioned it at the wrong dinner party."], "glossary": [{"word": "embezzling", "ph": "/ɪmˈbezəlɪŋ/", "type": "verb", "def": "Stealing money that has been placed in your care or trust.", "ex": "The accountant had been embezzling funds for a decade."}, {"word": "consistency", "ph": "/kənˈsɪstənsi/", "type": "noun", "def": "The quality of always behaving or performing the same way.", "ex": "Her consistency made her appear completely trustworthy."}, {"word": "deferential", "ph": "/ˌdefəˈrenʃəl/", "type": "adjective", "def": "Respectful and willing to accept others’ authority.", "ex": "She was deferential to her managers, which made them trust her."}, {"word": "scrutinised", "ph": "/ˈskruːtɪnaɪzd/", "type": "verb", "def": "Examined very carefully and critically.", "ex": "Her accounts had never been properly scrutinised."}, {"word": "reputation", "ph": "/ˌrepjuˈteɪʃən/", "type": "noun", "def": "The general opinion others hold of a person.", "ex": "Her reputation for honesty acted as her greatest protection."}, {"word": "suspicion", "ph": "/səˈspɪʃən/", "type": "noun", "def": "A feeling or belief that someone has done something wrong.", "ex": "No one expressed any suspicion about her behaviour."}, {"word": "discrepancy", "ph": "/dɪˈskrepənsi/", "type": "noun", "def": "A difference between figures or accounts that should agree.", "ex": "A small discrepancy in the ledger caught the auditor’s eye."}, {"word": "accumulated", "ph": "/əˈkjuːmjuleɪtɪd/", "type": "verb", "def": "Gradually increased or gathered over time.", "ex": "Small amounts accumulated into a very large sum."}, {"word": "auditor", "ph": "/ˈɔːdɪtə/", "type": "noun", "def": "A professional who officially examines financial records.", "ex": "The external auditor found the first signs of fraud."}], "questions": [{"q": "What was Vera Moss’s central insight about how organisations function?", "keywords": ["consistency", "accuracy", "trust", "time", "deferential", "scrutinised", "rarely"], "model": "Vera understood that organisations trust consistency over accuracy. An employee who is always punctual, calm and deferential will rarely have their work examined closely. She exploited the fact that trust becomes a substitute for verification.", "frQ": "Quelle insight centrale Vera Moss avait-elle sur le fonctionnement des organisations ?", "frModel": "Vera avait compris que les organisations font confiance à la cohérence plutôt qu’à l’exactitude. Un employé toujours ponctuel, calme et déférent verra rarement son travail examiné de près. Elle a exploité le fait que la confiance devient un substitut de la vérification."}, {"q": "How did Vera avoid detection for eleven years? Identify at least three strategies.", "keywords": ["small amounts", "discrepancy", "reputation", "shield", "suspicion", "consistency", "volunteer", "year-end"], "model": "She kept individual amounts small enough to pass as discrepancies. She built a strong reputation as a reliable employee, using it as a shield against suspicion. She also volunteered to process year-end accounts alone, controlling the only moment when fraud might be spotted.", "frQ": "Comment Vera a-t-elle évité d’être détectée pendant onze ans ? Identifiez au moins trois stratégies.", "frModel": "Elle gardait les montants individuels suffisamment petits pour passer pour des écarts. Elle a construit une forte réputation en tant qu’employée fiable, l’utilisant comme bouclier contre les soupçons. Elle se portait aussi volontaire pour traiter seule les comptes de fin d’année, contrôlant le seul moment où la fraude aurait pu être détectée."}, {"q": "Vera was caught not by professional oversight but by coincidence. What does this suggest about institutional trust?", "keywords": ["auditor", "junior colleague", "dinner party", "volunteered", "mentioned", "friend", "caught"], "model": "The irony is that formal oversight — the auditor — never detected her. A casual observation by a junior colleague and a social coincidence brought her down. This suggests institutions can become dangerously dependent on personal reputation, and that formal audit processes may be less effective than informal human observation.", "frQ": "Vera a été prise non pas par un audit professionnel mais par le hasard. Qu’est-ce que cela suggère sur la confiance institutionnelle ?", "frModel": "L’ironie est que la supervision formelle — l’auditeur — n’a jamais rien détecté. C’est une observation informelle d’un collègue junior et une coïncidence sociale qui l’ont exposée. Cela suggère que les institutions peuvent devenir dangereusement dépendantes de la réputation personnelle et que les processus d’audit formels peuvent être moins efficaces que l’observation humaine informelle."}], "writingPrompt": "Write 100–120 words analysing Vera’s method. Is she admirable in any sense, or purely criminal? Engage with ideas of trust, reputation and institutional failure. Use at least 3 words from the glossary.", "writingHints": ["While Vera’s actions were clearly criminal...", "Nevertheless, her insight into how institutions work...", "The real failure, one could argue, was...", "Ultimately, her case reveals that..."], "writingKeywords": ["embezzling", "consistency", "reputation", "scrutinised", "suspicion", "discrepancy", "accumulated"], "strategies": {"skim": {"feedback": "✅ Bonne stratégie ! Après un survol, tu devrais pouvoir répondre à cette question clé : <em>What was Vera Moss’s central insight about how organisations function?</em>", "pistes": ["Le premier paragraphe donne souvent l’essentiel : « For twelve years, Vera Moss had been the most trusted employee at Harfield Capital. She arrived early, left late, made... »", "As-tu identifié le genre du texte ? (fiction, article, dialogue…)", "Une réponse possible à la question principale : « Vera understood that organisations trust consistency over accuracy. An employee who is always punctual, calm and deferential will rarely have their work examined closely. She... »"]}, "scan": {"feedback": "✅ As-tu trouvé l’information rapidement ? Dans ce texte, un bon exemple d’information à localiser : le mot-clé <strong>« discrepancy »</strong> apparaît au paragraphe 3.", "pistes": ["Quel indice visuel t’a guidé ? (majuscule, chiffre, mot en italique…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard jusqu’au mot cherché.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ Bien ! La grande question d’inférence de ce texte : <em>Vera was caught not by professional oversight but by coincidence. What does this suggest about institutional trust?</em>", "pistes": ["Mots-clés à observer : auditor, junior colleague, dinner party, volunteered", "Une piste de réponse : « The irony is that formal oversight — the auditor — never detected her. A casual observation by a junior colleague... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ? Quel effet cela produit-il ?"]}, "vocab": {"feedback": "✅ E  stopped listening for sounds. Then one night, the nightlight went <g word='off' ph='/ɒf/' type='adverb' def='stopped working or was turned off' ex='The power went off during the storm.'>off</g>.", "Leo woke up in complete darkness. He was twelve now and <g word='embarrassed' ph='/ɪmˈbærəst/' type='adjective' def='feeling ashamed or awkward about something' ex='She was embarrassed to admit she was scared.'>embarrassed</g> to feel scared. He reached for his phone to use as a torch. It was not on his bedside table. He was sure he had left it there. He looked at the floor. And then he stopped.", "Under the bed, there was a faint <g word='glow' ph='/ɡləʊ/' type='noun' def='a soft, steady light' ex='There was a soft glow from behind the curtains.'>glow</g>. He had not left anything under the bed. He leaned slowly over the <g word='edge' ph='/edʒ/' type='noun' def='the part furthest from the centre; the border of something' ex='She sat on the edge of the bed.'>edge</g>. His phone was there, face up. The screen was on. The camera was <g word='active' ph='/ˈæktɪv/' type='adjective' def='working; switched on and doing something' ex='The recording device was still active.'>active</g>. It was filming the underneath of the bed. And on the screen, just <g word='visible' ph='/ˈvɪzɪbəl/' type='adjective' def='able to be seen' ex='The writing was barely visible in the dark.'>visible</g> at the far edge of the frame, was a <g word='hand' ph='/hænd/' type='noun' def='the part of the body at the end of the arm, used for holding things' ex='A hand appeared at the window.'>hand</g>. It was holding the phone steady, pointing it at him."], "glossary": [{"word": "off", "ph": "/ɒf/", "type": "adverb", "def": "No longer working; switched off or gone dark.", "ex": "The lights went off suddenly during the storm."}, {"word": "embarrassed", "ph": "/ɪmˈbærəst/", "type": "adjective", "def": "Feeling ashamed or awkward about something.", "ex": "He was embarrassed to admit he was still afraid of the e='noun (plural)' def='pieces of text sent between people using phones or computers' ex='She sent him three messages but got no reply.'>messages</g> a day. Theo read every one of them. He never replied. He wasn’t sure anyone had <g word='noticed' ph='/ˈnəʊtɪst/' type='verb' def='became aware of something' ex='No one had noticed he was gone.'>noticed</g>.", "It had started six months ago. He had missed one day, then two, then a week. After a week, replying felt <g word='impossible' ph='/ɪmˈpɒsɪbəl/' type='adjective' def='not able to happen or be done' ex='It felt impossible to go back.'>impossible</g>. What would he say? <em>Sorry I disappeared for six months?</em> The chat moved so fast. There were <g word='memes' ph='/miːmz/' type='noun (plural)' def='funny images or videos shared widely on the internet' ex='He sent a meme that made everyone laugh.'>memes</g>, <g word='voice notes' ph='/vɔɪs nəʊts/' type='noun (plural)' def='short audio recordings sent as messages' ex='She sent a voice note instead of typing.'>voice notes</g>, <g word='inside jokes' ph='/ˈɪnsaɪd dʒəʊks/' type='noun (plural)' def='jokes that only people in a particular group understand' ex='They had inside jokes that went back years.'>inside jokes</g> he no longer understood. He was still <g word='present' ph='/ˈprezənt/' type='adjective' def='in a place or situation; here: visible in the chat' ex='He was present in the group but said nothing.'>present</g> in the chat. Technically.", "Then on a Thursday afternoon, someone — it was Aisha — sent a message that said: <em>‘Does anyone know if Theo is okay? He’s gone very quiet.’</em> Fourteen people <g word='replied' ph='/rɪˈplaɪd/' type='verb' def='sent a response' ex='Everyone replied within minutes.'>replied</g> within four minutes. All of them had noticed. All of them had said nothing because they didn’t know what to say either. Theo read every reply. Then, for the first time in six months, he started <g word='typing' ph='/ˈtaɪpɪŋ/' type='verb' def='writing using a keyboard or phone screen' ex='She started typing and then deleted it.'>typing</g>."], "glossary": [{"word": "messages", "ph": "/ˈmesɪdʒɪz/", "type": "noun", "def": "Written communications sent between people digitally.", "ex": "She sent three messages but received no reply."}, {"word": "noticed", "ph": "/ˈnəʊtɪst/", "type": "verb", "def": "Became aware of something or someone.", "ex": "No one had noticed he was gone until Aisha asked."}, {"word": "impossible", "ph": "/ɪmˈpɒsɪbəl/", "type": "adjective", "def": "Not able to be done or achieved.", "ex": "After a week of silence, replying felt impossible."}, {"word": "inside jokes", "ph": "/ˈɪnsaɪd dʒəʊks/", "type": "noun", "def": "Jokes that only people in a close group understand.", "ex": "The chat was full of inside jokes he no longer followed."}, {"word": "present", "ph": "/ˈprezənt/", "type": "adjective", "def": "Being in a place; here, technically visible in the chat.", "ex": "He was present but invisible in the conversation."}, {"word": "replied", "ph": "/rɪˈplaɪd/", "type": "verb", "def": "Sent a response to a message.", "ex": "Everyone replied immediately when Aisha asked about Theo."}, {"word": "typing", "ph": "/ˈtaɪpɪŋ/", "type": "verb", "def": "Writing using a keyboard or touchscreen.", "ex": "She started typing a reply and then stopped."}], "questions": [{"q": "Why does Theo find it impossible to reply after six months?", "keywords": ["impossible", "week", "six months", "disappeared", "fast", "inside jokes", "say"], "model": "Theo does not reply because it starts with missing one day, then two, then a week. After a week, replying feels impossible — he would not know what to say. The chat has moved on with memes, voice notes and inside jokes he no longer understands.", "frQ": "Pourquoi Theo trouve-t-il impossible de répondre après six mois ?", "frModel": "Theo ne répond pas parce que cela commence par manquer un jour, puis deux, puis une semaine. Après une semaine, répondre semble impossible — il ne saurait pas quoi dire. Le chat a avancé avec des mèmes, des notes vocales et des blagues internes qu’il ne comprend plus."}, {"q": "What does Aisha’s message reveal about the rest of the group?", "keywords": ["noticed", "said nothing", "didn’t know what to say", "all of them", "replied", "four minutes"], "model": "Aisha’s message reveals that all fourteen people had noticed Theo’s silence. They had simply not said anything because they also did not know how to start the conversation. This shows that isolation in a group is often mutual and unspoken.", "frQ": "Que révèle le message d’Aisha sur le reste du groupe ?", "frModel": "Le message d’Aisha révèle que les quatorze personnes avaient remarqué le silence de Theo. Elles n’avaient tout simplement rien dit parce qu’elles ne savaient pas non plus comment commencer la conversation. Cela montre que l’isolement dans un groupe est souvent mutuel et non dit."}, {"q": "What is the significance of the final detail — Theo starting to type?", "keywords": ["typing", "first time", "six months", "read", "replies"], "model": "The final image is hopeful: Theo reads all the replies showing people care, and for the first time in six months he begins to type. It suggests connection is possible even after a long silence — sometimes someone just needs to break the ice.", "frQ": "Quelle est la signification du dernier détail — Theo qui commence à taper ?", "frModel": "La dernière image est pleine d’espoir : Theo lit toutes les réponses montrant que les gens tiennent à lui, et pour la première fois en six mois, il commence à taper. Cela suggère que la connexion est possible même après un long silence — parfois, quelqu’un doit juste briser la glace."}], "writingPrompt": "Write what Theo types (60–80 words). What does he say after six months of silence? Use at least 2 words from the glossary.", "writingHints": ["Hi everyone. I know I’ve been...", "I’m not sure how to explain...", "I’ve been reading everything and..."], "writingKeyw ruct": {"feedback": "✅ Bonne analyse ! Ce texte compte 3 paragraphes. Le premier paragraphe pose le cadre : « There were fourteen people in the group chat. They sent two hundred... ». Le dernier paragraphe : « Then on a Thursday afternoon, someone — it was Aisha — sent... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, retourner la situation, conclure.", "Où le texte change-t-il d’atmosphère ou de direction ? C’est souvent le pivot.", "Essaie de donner un titre à chaque paragraphe en une expression courte."]}, "intent": {"feedback": "✅ Bonne réflexion ! Question d’auteur pour ce texte : <em>Why does Theo find it impossible to reply after six months?</em>", "pistes": ["Une piste : « Theo does not reply because it starts with missing one day, then two, then a week. After a week, replying feels impossible — he would... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot ou la dernière image du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 113, "title": "The Last Analogue Summer", "eyebrow": "Contemporary Fiction", "level": "B2", "levelClass": "b2", "source": "Original contemporary fiction text", "readTime": "5 min", "words": 295, "preview": "In the summer of 2019, Nina’s phone broke on day three of a two-week holiday in rural Portugal. There was no repair shop within forty kilometres. This is the story of what she found instead.", "paragraphs": ["In the summer of 2019, Nina’s phone broke on day three of a two-week holiday in rural Portugal. There was no repair shop within forty kilometres. She had a <g word='paperback' ph='/ˈpeɪpbæk/' type='noun' def='a book with a flexible paper cover, not a hardback' ex='She packed three paperbacks for the journey.'>paperback</g>, a <g word='handwritten' ph='/ˈhændrɪtən/' type='adjective' def='written by hand, not typed or printed' ex='She kept a handwritten diary during the trip.'>handwritten</g> diary, and, she quickly discovered, eleven days of <g word='involuntary' ph='/ɪnˈvɒləntəri/' type='adjective' def='done without choice or intention' ex='It was an involuntary reaction to the news.'>involuntary</g> <g word='stillness' ph='/ˈstɪlnəs/' type='noun' def='the quality of being quiet and not moving; a state of calm' ex='The stillness of the countryside was unsettling at first.'>stillness</g>.", "The first three days were <g word='excruciating' ph='/ɪkˈskruːʃieɪtɪŋ/' type='adjective' def='extremely painful or difficult to endure' ex='The waiting was excruciating.'>excruciating</g>. She reached for her phone to photograph a sunset and her hand closed on air. She wanted to share a thought and had no one to share it with except the <g word='proprietor' ph='/prəˈpraɪətə/' type='noun' def='the owner of a business, especially a small one' ex='The proprietor of the restaurant greeted them warmly.'>proprietor</g> of the <g word='guesthouse' ph='/ˈɡesthaʊs/' type='noun' def='a small house or inn where guests pay to stay' ex='They stayed in a quiet guesthouse near the sea.'>guesthouse</g>, a woman of seventy who spoke no English. They communicated through <g word='gesture' ph='/ˈdʒestʃə/' type='noun' def='a movement of the body, especially the hands, to express something' ex='She explained it through gesture and mime.'>gesture</g> and shared meals.", "By the second week, something had <g word='shifted' ph='/ʃɪfted/' type='verb' def='changed position or moved slightly' ex='Her perspective had shifted after the conversation.'>shifted</g>. Nina noticed she was reading more slowly, thinking in longer <g word='threads' ph='/θredz/' type='noun (plural)' def='continuous lines of thought; also: a sequence of connected messages' ex='Her thoughts came in long unbroken threads.'>threads</g>, sleeping <g word='deeply' ph='/ˈdiːpli/' type='adverb' def='profoundly; to a great extent' ex='She slept more deeply than she had in years.'>deeply</g>. She wrote nine pages in her diary one afternoon without stopping. When she returned home and her phone was repaired, she read her diary entries as though they had been written by someone slightly wiser than herself. She still <g word='grieved' ph='/ɡriːvd/' type='verb' def='felt deep sorrow about a loss' ex='She grieved the loss of that particular quietness.'>grieved</g>, quietly and privately, for the particular kind of <g word='quietness' ph='/ˈkwaɪətnəs/' type='noun' def='the state of being peaceful and without noise or distraction' ex='She missed the quietness of those two weeks.'>quietness</g> that had already, irreversibly, ended."], "glossary": [{"word": "involuntary", "ph": "/ɪnˈvɒləntəri/", "type": "adjective", "def": "Happening without conscious choice or intention.", "ex": "It was an involuntary reaction — her hand simply reached for a phone that wasn’t there."}, {"word": "stillness", "ph": "/ˈstɪlnəs/", "type": "noun", "def": "A state of quiet and physical calm; absence of distraction.", "ex": "The stillness of the countryside was unsettling at first."}, {"word": "excruciating", "ph": "/ɪkˈskruːʃieɪtɪŋ/", "type": "adjective", "def": "Extremely difficult or painful to endure.", "ex": "The first three days without a phone were excruciating."}, {"word": "gesture", "ph": "/ˈdʒestʃə/", "type": "noun", "def": "A body movement, especially of the hands, to express meaning.", "ex": "They communicated through gesture since they shared no language."}, {"word": "shifted", "ph": "/ʃɪfted/", "type": "verb", "def": "Changed position or moved in a subtle way.", "ex": "By the second week, her whole perspective had shifted."}, {"word": "threads", "ph": "/θredz/", "type": "noun", "def": "Continuous lines of thought; unbroken chains of ideas.", "ex": "Her thoughts came in longer, slower threads without a screen to interrupt."}, {"word": "grieved", "ph": "/ɡriːvd/", "type": "verb", "def": "Felt deep sadness about a loss.", "ex": "She grieved the end of the quietness like the end of a friendship."}, {"word": "quietness", "ph": "/ˈkwaɪətnəs/", "type": " model": "Nina grieves for the quietness she lost when her phone was repaired. The word ‘irreversibly’ suggests she cannot go back. Her diary entries read as wiser than her usual self, implying she achieved something valuable. Her grief suggests that modern connectivity comes at the cost of a deeper kind of attention and stillness.", "frQ": "Que suggère le deuil de Nina à la fin du texte sur la vie moderne ?", "frModel": "Nina pleure la tranquillité perdue quand son téléphone a été réparé. Le mot « irréversiblement » suggère qu’elle ne peut pas revenir en arrière. Ses entrées de journal semblent plus sages que son moi habituel, impliquant qu’elle avait atteint quelque chose de précieux. Son deuil suggère que la connectivité moderne se fait au prix d’une forme plus profonde d’attention."}], "writingPrompt": "Have you ever experienced a period without your phone or internet? Or imagine one. Write 100–120 words exploring what you might gain and lose. Use at least 3 words from the glossary.", "writingHints": ["Without my phone, the first thing I would notice is...", "Over time, I imagine I would begin to...", "However, I would also miss...", "Like Nina, I think I would feel..."], "writingKeywords": ["stillness", "involuntary", "excruciating", "shifted", "threads", "grieved", "quietness"], "strategies": {"skim": {"feedback": "✅ Bonne stratégie ! Après un survol, tu devrais pouvoir répondre à cette question clé : <em>How does the author convey the difficulty of the first three days without a phone?</em>", "pistes": ["Le premier paragraphe donne souvent l’essentiel : « In the summer of 2019, Nina’s phone broke on day three of a two-week holiday in rural Portugal. There was... »", "As-tu identifié le genre du texte ? (fiction, article, dialogue…)", "Une réponse possible à la question principale : « The author uses the image of Nina reaching for her phone and her hand closing on air. The word excruciating signals how physically painful the... »"]}, "scan": {"feedback": "✅ As-
