<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Make-Me-Read</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&amp;family=Bree+Serif&family=Fredoka:wght@400;500;600;700&amp;family=Literata:opsz,wght@7..72,400;7..72,600&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@4.5.0/index.min.css" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F1EB;--bg2:#ECEAE3;--paper:#FDFCF9;--ink:#1A1917;--ink2:#3D3A36;
  --muted:#6B6858;--border:#D8D4C8;
  --blue:#1E40AF;--blue-lt:#EFF6FF;--blue-md:#BFDBFE;
  --amber:#92400E;--amber-lt:#FFFBEB;--amber-hl:#FEF3C7;
  --green:#14532D;--green-lt:#F0FDF4;
  --red:#991B1B;--red-lt:#FEF2F2;
  --fu:'Atkinson Hyperlegible',Arial,sans-serif;
  --fr:'Lora',Georgia,serif;
  /* DYS vars */
  --r-family:var(--fr);--r-size:1.1rem;--r-lh:1.9;--r-spacing:0;
  --r-bg:var(--paper);--r-word-spacing:normal;
}
/* DYS MODE */
body.dys{
  --fu:'OpenDyslexic',Arial,sans-serif;
  --fr:'OpenDyslexic',Arial,sans-serif;
  --r-family:'OpenDyslexic',Arial,sans-serif;
  --r-size:1.18rem;--r-lh:2.2;--r-spacing:0.06em;
}
body.dys-spacing{ --r-word-spacing:0.25em; }
body.dys-large{ --r-size:1.3rem; }
body{background:var(--bg);color:var(--ink);font-family:var(--fu);min-height:100vh;display:flex;flex-direction:column}

/* ── HEADER ── */
header{background:var(--paper);border-bottom:1.5px solid var(--border);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-shrink:0;gap:8px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:0.95rem;color:var(--ink);white-space:nowrap}
.logo-mark{width:30px;height:30px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.8rem;font-weight:700;flex-shrink:0}
.hdr-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.back-btn{display:none;padding:8px 14px;border-radius:9px;border:1.5px solid var(--border);background:var(--paper);color:var(--ink2);font-family:var(--fu);font-size:0.78rem;font-weight:700;cursor:pointer;min-height:44px}
.back-btn:active{border-color:var(--blue);color:var(--blue)}
.level-badge{display:none;font-size:0.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--blue-lt);color:var(--blue);border:1.5px solid var(--blue-md)}

/* ── DYS PANEL ── */
.dys-bar{background:var(--paper);border-bottom:1.5px solid var(--border);padding:10px 18px;display:none;flex-wrap:wrap;gap:8px;align-items:center}
body.dys-bar-open .dys-bar{display:flex}
.dys-toggle-btn{padding:8px 13px;border-radius:22px;border:1.5px solid var(--border);background:var(--paper);color:var(--ink2);font-family:var(--fu);font-size:0.75rem;font-weight:700;cursor:pointer;min-height:40px;-webkit-tap-highlight-color:transparent;white-space:nowrap;transition:all .15s}
.dys-toggle-btn.on{background:#7C3AED;color:#fff;border-color:#7C3AED}
.dys-sep{width:1.5px;height:28px;background:var(--border);flex-shrink:0}
.dys-label{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.font-size-row{display:flex;align-items:center;gap:6px}
.fs-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:var(--paper);color:var(--ink2);font-family:var(--fu);font-size:0.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.fs-btn:active{border-color:var(--blue);color:var(--blue)}
.fs-val{font-size:0.78rem;font-weight:700;color:var(--ink2);min-width:28px;text-align:center}
.bg-swatches{display:flex;gap:5px;align-items:center}
.bg-sw{width:28px;height:28px;border-radius:6px;border:2px solid transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.bg-sw.active{border-color:var(--blue)}
.dys-main-btn{padding:8px 13px;border-radius:22px;border:1.5px solid #7C3AED;background:var(--paper);color:#7C3AED;font-family:var(--fu);font-size:0.75rem;font-weight:700;cursor:pointer;min-height:40px;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:5px}
body.dys .dys-main-btn{background:#7C3AED;color:#fff}

/* ── HOME ── */
#homeScreen{flex:1;display:flex;flex-direction:column}
.hero{background:var(--paper);border-bottom:1.5px solid var(--border)}
.hero-img-wrap{width:100%;max-height:200px;overflow:hidden;background:var(--paper)}
.hero-img-wrap img{width:100%;height:auto;max-height:200px;object-fit:contain;object-position:center top;display:block}
.hero-body{padding:18px 18px 16px}
.hero-eyebrow{font-size:0.63rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.hero-title{font-family:var(--fr);font-size:1.75rem;font-weight:600;line-height:1.2;color:var(--ink);margin-bottom:8px}
.hero-title em{font-style:italic;color:var(--blue)}
.hero-sub{font-size:0.85rem;color:var(--muted);line-height:1.6;margin-bottom:14px}
.hero-stats{display:flex;gap:20px}
.hstat .n{font-family:var(--fr);font-size:1.45rem;font-weight:600;color:var(--ink);line-height:1}
.hstat .l{font-size:0.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:2px}
.home-tabs{background:var(--paper);border-bottom:1.5px solid var(--border);display:flex;position:sticky;top:52px;z-index:90}
.htab{flex:1;padding:13px 10px;font-family:var(--fu);font-size:0.86rem;font-weight:700;color:var(--muted);border:none;background:transparent;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:all .15s;min-height:48px;-webkit-tap-highlight-color:transparent}
.htab.active{color:var(--blue);border-bottom-color:var(--blue)}
#viewLevel,#viewGenre{padding:18px 16px 40px;max-width:900px;width:100%;margin:0 auto}
.level-section{margin-bottom:28px}
.level-heading{display:flex;align-items:center;gap:10px;margin-bottom:13px;padding-bottom:9px;border-bottom:2px solid var(--border)}
.lvl-pill{font-size:0.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 11px;border-radius:6px;font-family:var(--fu)}
.lvl-pill.a2{background:#DCFCE7;color:#14532D}
.lvl-pill.b1{background:#FEF3C7;color:#92400E}
.lvl-pill.b2{background:#DBEAFE;color:#1E3A8A}
.lvl-desc{font-size:0.78rem;color:var(--muted)}
.genre-section{margin-bottom:26px}
.genre-section.hidden{display:none}
.genre-heading{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding-bottom:8px;border-bottom:1.5px solid var(--border)}
.genre-ico{font-size:1.1rem}
.genre-lbl{font-family:var(--fr);font-size:0.98rem;font-weight:600;color:var(--ink)}
.genre-cnt{font-size:0.67rem;font-weight:700;color:var(--muted);background:var(--bg2);padding:2px 8px;border-radius:10px;font-family:var(--fu)}
.genre-filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.genre-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:24px;border:1.5px solid var(--border);background:var(--paper);color:var(--ink2);font-family:var(--fu);font-size:0.79rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;min-height:44px}
.genre-btn.active{color:#fff;border-color:transparent}
.text-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:500px){.text-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:800px){.text-grid{grid-template-columns:repeat(3,1fr)}}
.book-card{background:var(--paper);border:1.5px solid var(--border);border-radius:12px;padding:15px 17px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden;min-height:110px;transition:border-color .15s}
.book-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border);transition:background .15s}
.book-card:active{background:var(--blue-lt);border-color:var(--blue)}
.book-card:active::before{background:var(--blue)}
@media(hover:hover){.book-card:hover{border-color:var(--blue);box-shadow:0 2px 12px rgba(30,64,175,.08)}.book-card:hover::before{background:var(--blue)}}
.bc-row{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}
.bc-title{font-family:var(--fr);font-size:0.92rem;font-weight:600;color:var(--ink);line-height:1.3;flex:1}
.bc-lv{font-size:0.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;flex-shrink:0;margin-top:2px;font-family:var(--fu)}
.bc-lv.a2{background:#DCFCE7;color:#14532D}
.bc-lv.b1{background:#FEF3C7;color:#92400E}
.bc-lv.b2{background:#DBEAFE;color:#1E3A8A}
.bc-genre{font-size:0.68rem;color:var(--muted);font-weight:600;font-family:var(--fu)}
.bc-preview{font-family:var(--fr);font-size:0.76rem;color:var(--muted);font-style:italic;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bc-foot{display:flex;justify-content:space-between}
.bc-meta{font-size:0.66rem;color:var(--muted);font-family:var(--fu)}

/* ── READER ── */
#readerScreen{display:none;flex:1;flex-direction:column}
/* Reading ruler */
.ruler{position:fixed;left:0;right:0;height:2.8em;background:rgba(255,220,0,0.22);border-top:2px solid rgba(255,190,0,0.5);border-bottom:2px solid rgba(255,190,0,0.5);pointer-events:none;z-index:50;display:none;transition:top .05s linear}
body.ruler-on .ruler{display:block}
/* Reading mask */
.mask-top,.mask-bot{position:fixed;left:0;right:0;background:rgba(20,20,20,0.55);pointer-events:none;z-index:49;display:none}
body.mask-on .mask-top,.body.mask-on .mask-bot{display:block}
body.mask-on .mask-top{display:block}
body.mask-on .mask-bot{display:block}
.layout{display:flex;max-width:1100px;margin:0 auto;width:100%;padding:20px 16px;align-items:flex-start;gap:0}
.reader-panel{flex:1;min-width:0}
.text-header{margin-bottom:16px}
.text-eyebrow{font-size:0.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:4px;font-family:var(--fu)}
.text-title{font-family:var(--fr);font-size:1.4rem;font-weight:600;line-height:1.3;color:var(--ink);margin-bottom:4px}
.text-meta{font-size:0.74rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;font-family:var(--fu)}
.article-body{background:var(--r-bg);border:1.5px solid var(--border);border-radius:12px;padding:24px 22px;font-family:var(--r-family);font-size:var(--r-size);line-height:var(--r-lh);letter-spacing:var(--r-spacing);word-spacing:var(--r-word-spacing);color:var(--ink);margin-bottom:16px;transition:background .3s,font-size .3s,line-height .3s}
.article-body p{margin-bottom:1.1em}
.article-body p:last-child{margin-bottom:0}
.gloss-word{cursor:pointer;border-bottom:2px solid var(--amber);border-radius:2px;padding:0 1px;transition:background .12s;-webkit-tap-highlight-color:transparent}
.gloss-word.active{background:var(--amber-hl)}
@media(hover:hover){.gloss-word:hover{background:var(--amber-hl)}}
/* Syllable colouring */
.syl-a{color:#1E40AF}
.syl-b{color:#991B1B}

/* ── GLOSSARY SIDEBAR ── */
.gloss-sidebar{width:264px;flex-shrink:0;margin-left:16px;position:sticky;top:70px}
.gloss-panel{background:var(--paper);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.gloss-ph{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--amber-lt);display:flex;align-items:center;gap:7px}
.gloss-ph-title{font-weight:700;font-size:0.82rem;color:var(--amber);font-family:var(--fu)}
.gloss-empty{padding:16px;font-size:0.8rem;color:var(--muted);font-style:italic;text-align:center;line-height:1.5;font-family:var(--fu)}
.gloss-entry{padding:13px 16px;border-bottom:1px solid var(--border);display:none}
.gloss-img-wrap{width:100%;height:110px;border-radius:7px;overflow:hidden;margin-bottom:9px;background:var(--bg);display:none;align-items:center;justify-content:center}
.gloss-img-wrap.loaded{display:flex}
.gloss-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.gloss-img-wrap .gloss-img-placeholder{font-size:0.72rem;color:var(--muted);font-family:var(--fu);padding:8px;text-align:center}
.gloss-entry.visible{display:block}
.gloss-word-title{font-family:var(--fr);font-size:1rem;font-weight:600;color:var(--amber);margin-bottom:2px}
.gloss-phonetic{font-size:0.72rem;color:var(--muted);margin-bottom:5px;font-family:var(--fu)}
.gloss-type{display:inline-block;font-size:0.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--amber-lt);color:var(--amber);border-radius:4px;padding:1px 5px;margin-bottom:6px;font-family:var(--fu)}
.gloss-def{font-size:0.8rem;color:var(--ink2);line-height:1.5;margin-bottom:5px;font-family:var(--fu)}
.gloss-example{font-size:0.76rem;color:var(--muted);font-style:italic;line-height:1.4;font-family:var(--fr)}
.gloss-list-section{background:var(--paper);border:1.5px solid var(--border);border-radius:12px;overflow:hidden}
.gloss-list-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:0.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--fu)}
.gloss-list{padding:8px}
.gloss-pill{display:inline-block;margin:3px;padding:5px 10px;border-radius:20px;font-size:0.73rem;font-family:var(--fr);background:var(--amber-lt);color:var(--amber);border:1.5px solid #FDE68A;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:34px;line-height:1.4}
.gloss-pill.active{background:var(--amber-hl);border-color:var(--amber)}

/* ── STRATEGY PANEL ── */
.strat-section{background:var(--paper);border:1.5px solid var(--border);border-radius:12px;overflow:hidden}
.strat-header{padding:14px 18px;border-bottom:1.5px solid var(--border);background:var(--bg)}
.strat-header-label{font-size:0.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-family:var(--fu)}
.strat-btns{display:flex;flex-wrap:wrap;gap:7px}
.strat-btn{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:22px;border:1.5px solid var(--border);background:white;color:var(--ink2);font-family:var(--fu);font-size:0.77rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;min-height:42px}
.strat-btn.active{color:#fff;border-color:transparent}
.strat-body{padding:18px;display:none}
.strat-body.visible{display:block}
.strat-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:0.72rem;font-weight:700;font-family:var(--fu);margin-bottom:10px}
.strat-what{font-size:0.79rem;color:var(--muted);line-height:1.55;margin-bottom:12px;font-family:var(--fu);font-style:italic;padding:9px 13px;background:var(--bg);border-radius:8px;border-left:3px solid var(--border)}
.strat-task{font-family:var(--fr);font-size:0.96rem;color:var(--ink);line-height:1.6;margin-bottom:14px;font-weight:600}
.strat-input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);font-family:var(--r-family);font-size:0.9rem;color:var(--ink);background:var(--bg);resize:vertical;min-height:90px;line-height:1.6;-webkit-appearance:none;transition:border-color .15s}
.strat-input:focus{outline:none;border-color:var(--blue);background:var(--paper)}
.strat-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px}
.strat-wc{font-size:0.73rem;color:var(--muted);font-family:var(--fu)}
.strat-submit{padding:11px 20px;border-radius:10px;border:none;color:#fff;font-family:var(--fu);font-size:0.84rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;display:inline-flex;align-items:center;gap:6px;min-height:46px}
.strat-submit:active{opacity:.82}
.strat-submit:disabled{opacity:.4;cursor:not-allowed}
.strat-feedback{margin-top:14px;border-radius:10px;font-size:0.84rem;line-height:1.65;display:none;font-family:var(--fu);overflow:hidden}
.strat-feedback.visible{display:block}
.strat-fb-header{padding:12px 16px;font-weight:700;font-size:0.88rem;display:flex;align-items:center;gap:7px}
.strat-fb-body{padding:14px 16px}
.strat-fb-section{margin-bottom:12px}
.strat-fb-section:last-child{margin-bottom:0}
.strat-fb-section h4{font-size:0.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.strat-fb-section p{font-size:0.83rem;line-height:1.55}
.strat-tips{margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:8px;border-left:3px solid var(--amber)}
.strat-tips-title{font-size:0.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--amber);margin-bottom:7px;font-family:var(--fu)}
.strat-tips ul{padding-left:18px;font-size:0.8rem;color:var(--ink2);line-height:1.7}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .layout{flex-direction:column;padding:14px 13px}
  .gloss-sidebar{width:100%;margin-left:0;position:static}
  .article-body{padding:18px 15px}
  .text-title{font-size:1.2rem}
  #viewLevel,#viewGenre{padding:14px 13px 36px}
}
.strat-sol-btn{margin-top:10px;padding:11px 18px;border-radius:10px;border:1.5px solid var(--blue);background:var(--paper);font-family:var(--fu);font-size:0.84rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;display:none;align-items:center;gap:6px;min-height:46px;width:100%;justify-content:center}
.strat-sol-btn:active{background:var(--blue-lt)}
.strat-solution{margin-top:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--paper);overflow:hidden;display:none}
.strat-solution.visible{display:block}
.strat-sol-header{padding:12px 16px;background:var(--bg);border-bottom:1.5px solid var(--border);font-size:0.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--fu)}
.strat-sol-q{padding:14px 16px;border-bottom:1px solid var(--border)}
.strat-sol-q:last-child{border-bottom:none}
.strat-sol-qnum{font-size:0.66rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;font-family:var(--fu)}
.strat-sol-qtext{font-family:var(--fr);font-size:0.88rem;color:var(--ink2);margin-bottom:8px;line-height:1.5;font-style:italic}
.strat-sol-ans{font-size:0.85rem;color:var(--ink);line-height:1.65;font-family:var(--fu)}
.bc-orig-badge{font-size:0.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;font-family:var(--fu);flex-shrink:0}
.text-orig-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:14px;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;font-size:0.7rem;font-weight:700;font-family:var(--fu);margin-bottom:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:28px;font-size:0.8rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;white-space:nowrap;font-family:var(--fu)}
.toast.show{opacity:1}
</style>
<link rel="stylesheet" href="storybook.css?v=9"/>
</head>
<body>
<!-- Reading ruler & mask -->
<div class="ruler" id="ruler"></div>
<div class="mask-top" id="maskTop" style="top:0;left:0;right:0"></div>
<div class="mask-bot" id="maskBot" style="bottom:0;left:0;right:0"></div>
<header class="story-header" id="storyHeader">
  <button class="story-brand" onclick="showLanding()" aria-label="Make Me Read — accueil"><img src="assets/brand-ornate.png" alt="MAKE ME READ"></button>
  <nav class="story-navigation" aria-label="Navigation principale">
    <img class="nav-art" src="assets/navigation-strip-clean.webp" alt="" aria-hidden="true">
