haque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>How does Stevenson describe Utterson's character in the opening paragraph? What is the effect of this characterisation?</em>", "pistes": ["Piste : « Utterson is described as rugged, cold and embarrassed in conversation, yet somehow deeply lovable beneath his austere exterior. This characterisation establishes him... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 409, "title": "The Red-Headed League", "eyebrow": "Crime & Detective", "level": "A2", "levelClass": "a2", "source": "Original extract (adapted) — Arthur Conan Doyle, The Red-Headed League (1891). Public domain.", "readTime": "4 min", "words": 250, "preview": "Mr Wilson had answered a strange newspaper advertisement asking for men with red hair. He was paid a good salary to copy the encyclopedia for two hours each day. Then one morning, the office was suddenly closed — and a small paper sign said simply: THE RED-HEADED LEAGUE IS DISSOLVED.", "paragraphs": ["Mr Jabez Wilson came to see Sherlock Holmes with a very strange story. He had answered a newspaper <g word='advertisement' ph='/ədˈvɜːtɪsmənt/' type='noun' def='a public notice promoting a product, job or event' ex='The advertisement asked specifically for men with red hair.'>advertisement</g> that asked for men with red hair to <g word='apply' ph='/əˈplaɪ/' type='verb' def='to make a formal request, especially for a job' ex='Hundreds of men had applied for the unusual position.'>apply</g> for a strange position with the Red-Headed League.", "Mr Wilson, having very bright red hair, decided to apply, and to his great surprise, he was chosen for the job. His task was simple: he had to sit in an office for two hours every morning and copy pages from an <g word='encyclopedia' ph='/ɪnˈsaɪkləˈpiːdiə/' type='noun' def='a book or set of books containing information on many subjects' ex='He spent his mornings copying pages from the encyclopedia.'>encyclopedia</g>. For this easy work, he was paid a very generous <g word='salary' ph='/ˈsæləri/' type='noun' def='a fixed regular payment made for work, usually monthly' ex='The salary seemed too generous for such simple work.'>salary</g> every week.", "For eight weeks, Mr Wilson did this strange work without question, happy with his easy money. But then, one Saturday morning, he arrived at the office to find the door <g word='locked' ph='/lɒkt/' type='adjective' def='fastened shut so that it cannot be opened without a key' ex='The office door was locked, with nobody answering his knock.'>locked</g>, with a small paper sign attached. The sign read: 'THE RED-HEADED LEAGUE IS DISSOLVED.'", "Mr Wilson was <g word='confused' ph='/kənˈfjuːzd/' type='adjective' def='unable to think clearly or understand something' ex='He felt confused and worried about losing his strange income.'>confused</g> and worried. He went to ask his landlord about the company, but no one seemed to know anything about a 'Red-Headed League' at all. It was as if the whole organisation had never existed. Sherlock Holmes listened carefully to this strange tale, and immediately understood that something far more <g word='sinister' ph='/ˈsɪnɪstə/' type='adjective' def='giving the impression that something harmful or evil is happening or planned' ex='Holmes suspected something far more sinister than a simple business closure.'>sinister</g> than a simple job advertisement was happening."], "glossary": [{"word": "advertisement", "ph": "/ədˈvɜːtɪsmənt/", "type": "noun", "def": "A public notice that promotes a product, job or event.", "ex": "The advertisement specifically asked for men with red hair."}, {"word": "apply", "ph": "/əˈplaɪ/", "type": "verb", "def": "To make a formal request, especially for a job.", "ex": "Hundreds of men had applied for the unusual position."}, {"word": "encyclopedia", "ph": "/ɪnˈsaɪkləˈpiːdiə/", "type": "noun", "def": "A book or set of books containing information on many subjects.", "ex": "He spent his mornings copying pages from the encyclopedia."}, {"word": "salary", "ph": "/ˈsæləri/", "type": "noun", "def": "A fixed regular payment made for work, usually paid monthly or weekly.", "ex": "The salary seemed surprisingly generous for such simple work."}, {"word": "locked", "ph": "/lɒkt/", "type": "adjective", "def": "Fastened shut so it cannot be opened without a key.", "ex": "The office door was locked, with no one answering his knock."}, {"word": "confused", "ph": "/kənˈfjuːzd/", "type": "adjective", "def": "Unable to think clearly or understand something.", "ex": "He felt confused and worried about losing his unusual income."}, {"word": "sinister", "ph": "/ˈsɪnɪstə/", "type": "adjective", "def": "Giving the impression that something harmful is happening or planned.", "ex": "Holmes suspected something far more sinister was occurring."}], "questions": [{"q": "What strange job did Mr Wilson apply for, and what was his daily task?", "keywords": ["advertisement", "red hair", "apply", "encyclopedia", "copy", "two hours"], "model": "Mr Wilson applied for a strange job advertised for men with red hair. His daily task was simply to sit in an office for two hours each morning and copy pages from an encyclopedia.", "frQ": "Quel emploi étrange M. Wilson a-t-il accepté, et quelle était sa tâche quotidienne ?", "frModel": "M. Wilson a postulé pour un emploi étrange annoncé pour des hommes aux cheveux roux. Sa tâche quotidienne consistait simplement à s'asseoir dans un bureau pendant deux heures chaque matin et à copier des pages d'une encyclopédie."}, {"q": "What happened on the Saturday morning that ended Mr Wilson's job?", "keywords": ["locked", "sign", "dissolved", "arrived", "door"], "model": "Mr Wilson arrived to find the office door locked, with a sign saying 'THE RED-HEADED LEAGUE IS DISSOLVED' attached to it.", "frQ": "Que s'est-il passé le samedi matin qui a mis fin à l'emploi de M. Wilson ?", "frModel": "M. Wilson est arrivé pour trouver la porte du bureau verrouillée, avec un panneau attaché disant : « LA LIGUE DES ROUX EST DISSOUTE »."}, {"q": "How does Holmes react differently to this story compared to how an ordinary person might react?", "keywords": ["confused", "sinister", "far more", "simple job", "immediately understood"], "model": "While Mr Wilson is simply confused and worried about losing his income, Holmes immediately suspects something far more sinister is happening — he sees the strange job as a clue to a hidden crime, not just a confusing inconvenience.", "frQ": "Comment Holmes réagit-il différemment à cette histoire par rapport à la réaction d'une personne ordinaire ?", "frModel": "Alors que M. Wilson est simplement confus et inquiet de perdre son revenu, Holmes soupçonne immédiatement que quelque chose de bien plus sinistre se passe — il voit l'emploi étrange comme un indice d'un crime caché, pas juste un inconvénient déroutant."}], "writingPrompt": "Write 60–80 words guessing why someone would pay a man to copy an encyclopedia for two hours every day. What could the real reason be? Use at least 2 words from the glossary.", "writingHints": ["I think the real reason might be to keep Mr Wilson away from...", "Perhaps the job was simply a way to...", "The advertisement could have been designed to..."], "writingKeywords": ["sinister", "confused", "locked", "salary", "apply"], "isOriginal": true, "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>What strange job did Mr Wilson apply for, and what was his daily task?</em>", "pistes": ["Indice du premier paragraphe : « Mr Jabez Wilson came to see Sherlock Holmes with a very strange story. He had answered a newspaper... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « Mr Wilson applied for a strange job advertised for men with red hair. His daily task was simply to sit in an... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« advertisement »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>How does Holmes react differently to this story compared to how an ordinary person might react?</em>", "pistes": ["Mots-clés à observer : confused, sinister, far more, simple job", "Piste : « While Mr Wilson is simply confused and worried about losing his income, Holmes immediately suspects something far more sinister is... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« advertisement »</strong>.", "pistes": ["Dans le texte : « ...had answered a newspaper advertisement that asked for men with ... »", "Définition réelle : A public notice that promotes a product, job or event.", "Exemple : « The advertisement specifically asked for men with red hair. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « Mr Jabez Wilson came to see Sherlock Holmes with a... ». Dernier paragraphe : « Mr Wilson was confused and worried. He went to ask... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>How does Holmes react differently to this story compared to how an ordinary person might react?</em>", "pistes": ["Piste : « While Mr Wilson is simply confused and worried about losing his income, Holmes immediately suspects something far more sinister is happening —... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 410, "title": "The Murders in the Rue Morgue", "eyebrow": "Crime & Detective", "level": "B1", "levelClass": "b1", "source": "Original extract (adapted) — Edgar Allan Poe, The Murders in the Rue Morgue (1841). Public domain.", "readTime": "6 min", "words": 400, "preview": "Two women were found dead in a locked room on the fourth floor, with no apparent way for the killer to have entered or escaped. The Paris police were baffled. Dupin, an eccentric amateur investigator, examined the scene — and noticed details that everyone else had missed.", "paragraphs": ["The <g word='atrocity' ph='/əˈtrɒsɪti/' type='noun' def='an extremely cruel or violent act' ex='The whole of Paris was horrified by the atrocity.'>atrocity</g> had occurred on the fourth floor of a house in the Rue Morgue. Two women, a mother and her daughter, had been found brutally killed, and the manner of their deaths was so <g word='savage' ph='/ˈsævɪdʒ/' type='adjective' def='extremely violent and uncontrolled' ex='The wounds suggested a savage and almost inhuman strength.'>savage</g> that the police could not imagine an ordinary human being responsible.", "What <g word='baffled' ph='/ˈbæfəld/' type='verb (past)' def='completely confused; impossible to understand or solve' ex='The locked door baffled every detective who examined it.'>baffled</g> investigators most was the sealed nature of the room. The door had been locked from the inside. The single window was found to be securely fastened, with no apparent way for any person to climb in or out. Several <g word='witnesses' ph='/ˈwɪtnəsɪz/' type='noun' def='people who saw an event happen' ex='Several witnesses reported hearing two distinct voices.'>witnesses</g> on the street below had heard voices arguing — one deep and rough, another shrill and strange — but no one could agree on what language the second voice had spoken.", "Dupin, a brilliant but unconventional thinker who preferred the company of books to people, was asked to examine the case after the police had completely failed to find any <g word='plausible' ph='/ˈplɔːzɪbəl/' type='adjective' def='seeming reasonable or probable' ex='No plausible explanation for the locked room presented itself.'>plausible</g> explanation. While the official investigators focused on the locked door, Dupin walked directly to the window and examined it with extraordinary care.", "He discovered something everyone else had <g word='overlooked' ph='/ˈəʊvəˈlʌkt/' type='verb (past)' def='failed to notice or consider' ex='A single broken nail had been completely overlooked by every officer.'>overlooked</g>: a small, broken spring inside the window frame, hidden where casual examination would never find it. The window had appeared securely locked, but in fact, it could be pushed open from outside with very little effort, and would <g word='automatically' ph='/ˈɔːtəˈmætɪkli/' type='adverb' def='by itself, without direct human control' ex='The spring would automatically push the window shut again.'>automatically</g> snap shut and appear locked again afterwards. The mystery of the sealed room was not <g word='supernatural' ph='/ˈsuːpəˈnætʃərəl/' type='adjective' def='relating to forces beyond the laws of nature' ex='There was nothing supernatural about the crime — only clever mechanics.'>supernatural</g> at all. It was simply a detail no one had thought to look for."], "glossary": [{"word": "atrocity", "ph": "/əˈtrɒsɪti/", "type": "noun", "def": "An extremely cruel or violent act.", "ex": "The whole of Paris was horrified by the atrocity."}, {"word": "savage", "ph": "/ˈsævɪdʒ/", "type": "adjective", "def": "Extremely violent and uncontrolled.", "ex": "The wounds suggested a savage and almost inhuman strength."}, {"word": "baffled", "ph": "/ˈbæfəld/", "type": "verb", "def": "Completely confused; left unable to understand or solve something.", "ex": "The locked door baffled every detective who examined it."}, {"word": "witnesses", "ph": "/ˈwɪtnəsɪz/", "type": "noun", "def": "People who personally see an event take place.", "ex": "Several witnesses reported hearing two distinct voices."}, {"word": "plausible", "ph": "/ˈplɔːzɪbəl/", "type": "adjective", "def": "Seeming reasonable or probable; believable.", "ex": "No plausible explanation for the locked room presented itself."}, {"word": "overlooked", "ph": "/ˈəʊvəˈlʌkt/", "type": "verb", "def": "Failed to notice or consider something.", "ex": "A single broken nail had been completely overlooked."}, {"word": "automatically", "ph": "/ˈɔːtəˈmætɪkli/", "type": "adverb", "def": "By itself, without direct human control or action.", "ex": "The spring would automatically push the window shut again."}, {"word": "supernatural", "ph": "/ˈsuːpəˈnætʃərəl/", "type": "adjective", "def": "Relating to forces or events beyond the laws of nature.", "ex": "There was nothing supernatural about the crime — only clever mechanics."}], "questions": [{"q": "What makes this crime so puzzling to the Paris police?", "keywords": ["locked from inside", "window securely fastened", "no apparent way", "baffled", "sealed"], "model": "The crime is puzzling because the room was sealed: the door was locked from the inside and the window appeared securely fastened, with no apparent way for anyone to enter or escape. This baffled the police completely.", "frQ": "Qu'est-ce qui rend ce crime si troublant pour la police parisienne ?", "frModel": "Le crime est troublant car la pièce était scellée : la porte était verrouillée de l'intérieur et la fenêtre semblait solidement fermée, sans aucun moyen apparent pour quiconque d'entrer ou de s'échapper. Cela a complètement dérouté la police."}, {"q": "What conflicting evidence did witnesses on the street provide about the voices they heard?", "keywords": ["two distinct voices", "deep rough", "shrill strange", "no one could agree", "language"], "model": "Witnesses heard two distinct voices arguing — one deep and rough, the other shrill and strange. No one could agree on what language the second voice had been speaking, adding to the mystery.", "frQ": "Quelle preuve contradictoire les témoins dans la rue ont-ils fournie sur les voix qu'ils ont entendues ?", "frModel": "Les témoins ont entendu deux voix distinctes se disputer — l'une grave et rude, l'autre stridente et étrange. Personne ne pouvait s'accorder sur la langue parlée par la seconde voix, ajoutant au mystère."}, {"q": "How does Dupin's method differ from the official investigators, and what does he discover?", "keywords": ["window", "focused", "locked door", "overlooked", "broken spring", "automatically", "appear locked"], "model": "While police focused on the locked door, Dupin examined the window with extraordinary care and discovered a small, overlooked broken spring inside the frame. This meant the window could be pushed open from outside and would automatically snap shut afterwards, appearing locked even though it was not — solving the 'impossible' mystery through careful observation rather than assuming anything supernatural.", "frQ": "Comment la méthode de Dupin diffère-t-elle des enquêteurs officiels, et que découvre-t-il ?", "frModel": "Alors que la police se concentrait sur la porte verrouillée, Dupin a examiné la fenêtre avec un soin extraordinaire et a découvert un petit ressort cassé négligé dans le cadre. Cela signifiait que la fenêtre pouvait être ouverte de l'extérieur et se refermerait automatiquement, semblant verrouillée même si elle ne l'était pas — résolvant le mystère « impossible » par l'observation minutieuse plutôt qu'en supposant quelque chose de surnaturel."}], "writingPrompt": "Write 100–120 words explaining what you think really happened in the room, using Dupin's discovery about the window as your starting point. Use at least 3 words from the glossary.", "writingHints": ["Given that the window could be opened from outside, I believe...", "The killer must have entered through...", "This would explain why witnesses heard..."], "writingKeywords": ["plausible", "overlooked", "automatically", "baffled", "supernatural", "savage"], "isOriginal": true, "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>What makes this crime so puzzling to the Paris police?</em>", "pistes": ["Indice du premier paragraphe : « The atrocity had occurred on the fourth floor of a house in the Rue Morgue. Two women, a... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « The crime is puzzling because the room was sealed: the door was locked from the inside and the window appeared securely fastened,... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« atrocity »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>How does Dupin's method differ from the official investigators, and what does he discover?</em>", "pistes": ["Mots-clés à observer : window, focused, locked door, overlooked", "Piste : « While police focused on the locked door, Dupin examined the window with extraordinary care and discovered a small, overlooked broken... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« atrocity »</strong>.", "pistes": ["Dans le texte : « ...The atrocity had occurred on the four... »", "Définition réelle : An extremely cruel or violent act.", "Exemple : « The whole of Paris was horrified by the atrocity. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « The atrocity had occurred on the fourth floor of a... ». Dernier paragraphe : « He discovered something everyone else had overlooked: a small, broken... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>How does Dupin's method differ from the official investigators, and what does he discover?</em>", "pistes": ["Piste : « While police focused on the locked door, Dupin examined the window with extraordinary care and discovered a small, overlooked broken spring inside... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 411, "title": "The Moonstone", "eyebrow": "Crime & Detective", "level": "B2", "levelClass": "b2", "source": "Original extract (adapted) — Wilkie Collins, The Moonstone (1868), widely considered the first detective novel in English. Public domain.", "readTime": "8 min", "words": 470, "preview": "The Moonstone, a priceless yellow diamond with a violent and cursed history, vanished from a locked room on the night of Rachel Verinder's birthday. Sergeant Cuff, summoned from London, found himself confronting not merely a theft, but a household full of secrets that everyone seemed determined to protect.", "paragraphs": ["Sergeant Cuff was a grizzled, <g word='gaunt' ph='/ɡɔːnt/' type='adjective' def='thin and bony, especially because of suffering or hardship' ex='His gaunt features suggested years of dedicated, exhausting work.'>gaunt</g> man, advancing in years, whose appearance gave no hint whatsoever of the extraordinary <g word='perspicacity' ph='/ˈpɜːspɪˈkæsɪti/' type='noun' def='the quality of having keen insight and good judgement' ex='His perspicacity in matters of theft was renowned throughout London.'>perspicacity</g> that had made him the most celebrated detective in London. He arrived at the country house with no fanfare, asked no dramatic questions, and spent his first afternoon doing nothing more <g word='conspicuous' ph='/kənˈspɪkjuəs/' type='adjective' def='attracting notice or attention; standing out' ex='His conspicuous lack of urgency frustrated the impatient family.'>conspicuous</g> than walking quietly about the rose garden.", "This calm exterior, I would soon learn, <g word='concealed' ph='/kənˈsiːld/' type='verb (past)' def='kept hidden from view or knowledge' ex='A mind of extraordinary sharpness concealed itself behind his calm manner.'>concealed</g> a mind already working through every possibility with relentless precision. When he finally addressed the family that evening, his first question caught everyone by surprise: not who might have wanted the diamond, but who, on the night in question, had reason to walk past Rachel's door without being noticed.", "The household, predictably, closed ranks with the particular <g word='solidarity' ph='/ˈsɒlɪˈdærɪti/' type='noun' def='unity and mutual support among a group of people' ex='A strange solidarity emerged among servants who had little reason to protect one another.'>solidarity</g> that families display when an outsider threatens to expose their private affairs. Lady Verinder, ordinarily a woman of considerable candour, became evasive when asked about her daughter's recent behaviour. The servants, too, seemed <g word='reticent' ph='/ˈretɪsənt/' type='adjective' def='not revealing one's thoughts or feelings readily; reluctant to speak' ex='Even the most talkative servants grew strangely reticent under questioning.'>reticent</g> in a manner that struck Cuff as both unusual and <g word='revealing' ph='/rɪˈviːlɪŋ/' type='adjective' def='showing or making known something previously hidden' ex='Their reticence was, in its own way, deeply revealing.'>revealing</g> in itself.", "'You will forgive me,' Cuff said to the assembled household, with the mild, almost <g word='apologetic' ph='/əˈpɒləˈdʒetɪk/' type='adjective' def='expressing regret for having caused inconvenience or offence' ex='His apologetic manner disguised an investigator who missed nothing.'>apologetic</g> manner that I would come to understand <g word='masked' ph='/mɑːskt/' type='verb (past)' def='hidden or disguised the true nature of something' ex='His gentle manner masked one of the sharpest minds in England.'>masked</g> one of the sharpest minds in England, 'if I observe that a house in which everyone is being so very careful not to mention certain things is, in my experience, a house with rather a great deal to hide.'"], "glossary": [{"word": "gaunt", "ph": "/ɡɔːnt/", "type": "adjective", "def": "Thin and bony in appearance, often due to suffering or hardship.", "ex": "His gaunt features suggested years of dedicated, exhausting work."}, {"word": "perspicacity", "ph": "/ˈpɜːspɪˈkæsɪti/", "type": "noun", "def": "The quality of having keen insight and good judgement.", "ex": "His perspicacity in matters of theft was renowned throughout London."}, {"word": "conspicuous", "ph": "/kənˈspɪkjuəs/", "type": "adjective", "def": "Attracting attention; standing out clearly.", "ex": "His conspicuous lack of urgency frustrated the impatient family."}, {"word": "concealed", "ph": "/kənˈsiːld/", "type": "verb", "def": "Kept hidden from view or knowledge.", "ex": "A mind of extraordinary sharpness concealed itself behind his calm manner."}, {"word": "solidarity", "ph": "/ˈsɒlɪˈdærɪti/", "type": "noun", "def": "Unity and mutual support among members of a group.", "ex": "A strange solidarity emerged among servants who barely knew each other."}, {"word": "reticent", "ph": "/ˈretɪsənt/", "type": "adjective", "def": "Not revealing one's thoughts or feelings readily; reluctant to speak.", "ex": "Even the most talkative servants grew strangely reticent under questioning."}, {"word": "apologetic", "ph": "/əˈpɒləˈdʒetɪk/", "type": "adjective", "def": "Expressing regret for having caused inconvenience or offence.", "ex": "His apologetic manner disguised an investigator who missed nothing."}, {"word": "masked", "ph": "/mɑːskt/", "type": "verb", "def": "Hid or disguised the true nature of something.", "ex": "His gentle manner masked one of the sharpest minds in England."}], "questions": [{"q": "How does Sergeant Cuff's outward appearance contrast with his actual abilities? What is the effect of this contrast?", "keywords": ["gaunt", "perspicacity", "calm exterior", "concealed", "conspicuous", "celebrated detective"], "model": "Cuff appears as an unremarkable, gaunt older man with no outward sign of his extraordinary perspicacity. His calm, unremarkable exterior conceals a sharp, relentless mind. This contrast makes him a more effective investigator — people underestimate him — and creates dramatic irony for the reader, who knows his quiet observations are far more significant than they appear.", "frQ": "Comment l'apparence extérieure du Sergent Cuff contraste-t-elle avec ses véritables capacités ? Quel est l'effet de ce contraste ?", "frModel": "Cuff apparaît comme un vieil homme maigre et banal, sans signe extérieur de sa perspicacité extraordinaire. Son extérieur calme et banal dissimule un esprit aigu et impitoyable. Ce contraste le rend plus efficace comme enquêteur — les gens le sous-estiment — et crée une ironie dramatique pour le lecteur."}, {"q": "What is unusual about Cuff's first question to the family, and what does it reveal about his investigative approach?", "keywords": ["not who wanted", "reason to walk past", "door", "without being noticed", "surprise"], "model": "Rather than asking who might have wanted the diamond (the obvious question), Cuff asks who had reason to walk past Rachel's door unnoticed. This reveals his approach focuses on opportunity and circumstance rather than motive — he investigates the physical possibility of the crime before considering who might want to commit it.", "frQ": "Qu'est-ce qui est inhabituel dans la première question de Cuff à la famille, et que révèle-t-elle sur son approche d'enquête ?", "frModel": "Plutôt que de demander qui aurait pu vouloir le diamant (la question évidente), Cuff demande qui avait une raison de passer devant la porte de Rachel sans être remarqué. Cela révèle que son approche se concentre sur l'opportunité et les circonstances plutôt que sur le motif."}, {"q": "Analyse the household's reaction to Cuff's investigation. What does their collective behaviour suggest, according to Cuff's own observation?", "keywords": ["solidarity", "closed ranks", "evasive", "reticent", "revealing", "careful not to mention"], "model": "The household displays unusual solidarity, becoming evasive and reticent when questioned — even normally candid Lady Verinder and talkative servants change their behaviour. Cuff's own observation, delivered in his characteristically apologetic but devastating manner, suggests that a house where everyone is careful not to mention certain things is, by definition, a house with a great deal to hide. The collective reticence becomes evidence in itself.", "frQ": "Analysez la réaction de la maisonnée à l'enquête de Cuff. Que suggère leur comportement collectif, selon la propre observation de Cuff ?", "frModel": "La maisonnée fait preuve d'une solidarité inhabituelle, devenant évasive et réticente lorsqu'on l'interroge. L'observation de Cuff lui-même suggère qu'une maison où tout le monde fait attention à ne pas mentionner certaines choses est, par définition, une maison qui a beaucoup à cacher. La réticence collective devient une preuve en elle-même."}], "writingPrompt": "Write 100–120 words as Sergeant Cuff's private notes after his first evening at the house, listing his initial observations and suspicions about the household. Use at least 3 words from the glossary and try to capture his understated, precise tone.", "writingHints": ["Private notes, evening one: The household's collective reticence is, in itself, instructive...", "Lady Verinder's evasiveness when discussing her daughter suggests...", "I shall begin tomorrow by examining..."], "writingKeywords": ["reticent", "solidarity", "concealed", "apologetic", "perspicacity", "conspicuous"], "isOriginal": true, "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>How does Sergeant Cuff's outward appearance contrast with his actual abilities? What is the effect of this contrast?</em>", "pistes": ["Indice du premier paragraphe : « Sergeant Cuff was a grizzled, gaunt man, advancing in years, whose appearance gave no hint whatsoever of the... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « Cuff appears as an unremarkable, gaunt older man with no outward sign of his extraordinary perspicacity. His calm, unremarkable exterior conceals a... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« gaunt »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>Analyse the household's reaction to Cuff's investigation. What does their collective behaviour suggest, according to Cuff's own observation?</em>", "pistes": ["Mots-clés à observer : solidarity, closed ranks, evasive, reticent", "Piste : « The household displays unusual solidarity, becoming evasive and reticent when questioned — even normally candid Lady Verinder and talkative servants... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« gaunt »</strong>.", "pistes": ["Dans le texte : « ...ant Cuff was a grizzled, gaunt man, advancing in years,... »", "Définition réelle : Thin and bony in appearance, often due to suffering or hardship.", "Exemple : « His gaunt features suggested years of dedicated, exhausting work. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « Sergeant Cuff was a grizzled, gaunt man, advancing in years,... ». Dernier paragraphe : « 'You will forgive me,' Cuff said to the assembled household,... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>How does Sergeant Cuff's outward appearance contrast with his actual abilities? What is the effect of this contrast?</em>", "pistes": ["Piste : « Cuff appears as an unremarkable, gaunt older man with no outward sign of his extraordinary perspicacity. His calm, unremarkable exterior conceals a... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 412, "title": "Oh Whistle, And I'll Come To You", "eyebrow": "Horror & Suspense", "level": "A2", "levelClass": "a2", "source": "Original extract (adapted) — M.R. James, Oh Whistle, And I'll Come To You, My Lad (1904). Public domain.", "readTime": "4 min", "words": 230, "preview": "Professor Parkins found an old whistle buried in the sand on a quiet beach. There were strange words carved into the metal, in a language he could not read. Without thinking much about it, he cleaned the whistle and blew into it that very night — a decision he would soon regret deeply.", "paragraphs": ["Professor Parkins was walking along a quiet beach, enjoying the cold sea air, when his foot struck something hidden in the sand. He bent down and <g word='dug' ph='/dʌɡ/' type='verb (past)' def='made a hole in the ground using one's hands or a tool' ex='He dug carefully until the small object was finally free.'>dug</g> carefully until he had freed a small, <g word='ancient' ph='/ˈeɪnʃənt/' type='adjective' def='very old; belonging to a time long past' ex='The whistle looked extremely ancient, perhaps centuries old.'>ancient</g>-looking metal whistle.", "There were strange marks carved into its surface — words, perhaps, but in no language Parkins could <g word='recognise' ph='/ˈrekəɡnaɪz/' type='verb' def='to identify something one has seen or known before' ex='He could not recognise the strange language at all.'>recognise</g>. He turned the small object over in his hands, <g word='curious' ph='/ˈkjʊəriəs/' type='adjective' def='eager to know or learn something' ex='He was curious about the strange object's history.'>curious</g> about its origin, then put it in his pocket and continued his walk.", "That night, back in his hotel room, Parkins cleaned the sand and dirt from the whistle. Without thinking much about what he was doing, he raised it to his lips and blew gently. A strange, <g word='hollow' ph='/ˈhɒləʊ/' type='adjective' def='having an empty space inside; producing a deep, empty sound' ex='A hollow, eerie sound echoed strangely through the quiet room.'>hollow</g> sound echoed through the room — not loud, but somehow deeply unsettling, as if the sound carried much further than the small whistle should allow.", "Parkins told himself he was being <g word='foolish' ph='/ˈfuːlɪʃ/' type='adjective' def='lacking good sense or judgement; silly' ex='He told himself he was being foolish to feel afraid.'>foolish</g>, and went to bed without further thought. But later that night, he woke suddenly, certain that something in the room had changed. The second bed in his room, which had been <g word='empty' ph='/ˈempti/' type='adjective' def='containing nothing or no one' ex='The second bed, completely empty when he fell asleep, now seemed different somehow.'>empty</g> when he fell asleep, now seemed to hold a shape beneath its white sheets that had not been there before."], "glossary": [{"word": "dug", "ph": "/dʌɡ/", "type": "verb", "def": "Made a hole in the ground using hands or a tool.", "ex": "He dug carefully until the small object was finally free."}, {"word": "ancient", "ph": "/ˈeɪnʃənt/", "type": "adjective", "def": "Very old; belonging to a time long in the past.", "ex": "The whistle looked extremely ancient, perhaps centuries old."}, {"word": "recognise", "ph": "/ˈrekəɡnaɪz/", "type": "verb", "def": "To identify something seen or known before.", "ex": "He could not recognise the strange language carved into it."}, {"word": "curious", "ph": "/ˈkjʊəriəs/", "type": "adjective", "def": "Eager to know or learn something.", "ex": "He was deeply curious about the strange object's origin."}, {"word": "hollow", "ph": "/ˈhɒləʊ/", "type": "adjective", "def": "Having an empty space inside; producing a deep, empty sound.", "ex": "A hollow, eerie sound echoed strangely through the quiet room."}, {"word": "foolish", "ph": "/ˈfuːlɪʃ/", "type": "adjective", "def": "Lacking good sense or judgement; silly.", "ex": "He told himself he was being foolish to feel afraid."}, {"word": "empty", "ph": "/ˈempti/", "type": "adjective", "def": "Containing nothing or no one.", "ex": "The second bed, completely empty when he fell asleep, now seemed different."}], "questions": [{"q": "What does Parkins find on the beach, and what is strange about it?", "keywords": ["whistle", "sand", "ancient", "marks", "language", "could not recognise"], "model": "Parkins finds an ancient-looking metal whistle buried in the sand. It has strange marks carved into it, possibly words, but in a language he cannot recognise.", "frQ": "Que trouve Parkins sur la plage, et qu'est-ce qui est étrange à ce sujet ?", "frModel": "Parkins trouve un ancien sifflet en métal enterré dans le sable. Il a des marques étranges gravées dessus, peut-être des mots, mais dans une langue qu'il ne peut pas reconnaître."}, {"q": "What happens when Parkins blows the whistle that night?", "keywords": ["cleaned", "blew", "hollow", "sound", "echoed", "unsettling", "further"], "model": "Parkins cleans the whistle and blows it without much thought. A strange, hollow sound echoes through the room — it is not loud, but feels deeply unsettling, as if it carries much further than such a small object should allow.", "frQ": "Que se passe-t-il quand Parkins souffle dans le sifflet cette nuit-là ?", "frModel": "Parkins nettoie le sifflet et souffle dedans sans trop réfléchir. Un son creux et étrange résonne dans la pièce — il n'est pas fort, mais semble profondément troublant, comme s'il portait bien plus loin qu'un si petit objet ne le devrait."}, {"q": "What does Parkins discover when he wakes up later that night? Why is this frightening?", "keywords": ["woke", "something changed", "second bed", "empty", "shape", "sheets", "not been there before"], "model": "He wakes certain something has changed, and discovers the second bed in his room — empty when he fell asleep — now appears to hold a shape beneath its white sheets. This is frightening because it suggests something has entered the room in response to the whistle, with no clear explanation for how or what it might be.", "frQ": "Que découvre Parkins quand il se réveille plus tard cette nuit-là ? Pourquoi est-ce effrayant ?", "frModel": "Il se réveille certain que quelque chose a changé, et découvre que le deuxième lit dans sa chambre — vide quand il s'est endormi — semble maintenant contenir une forme sous ses draps blancs. C'est effrayant car cela suggère que quelque chose est entré dans la pièce en réponse au sifflet."}], "writingPrompt": "Write 60–80 words describing what Parkins does next. Does he investigate the shape in the bed, or try to ignore it? Use at least 2 words from the glossary.", "writingHints": ["Parkins stared at the shape, too frightened to move...", "He told himself it was foolish to be afraid, but...", "Slowly, he reached out his hand to..."], "writingKeywords": ["hollow", "foolish", "empty", "curious", "ancient"], "isOriginal": true, "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>What does Parkins find on the beach, and what is strange about it?</em>", "pistes": ["Indice du premier paragraphe : « Professor Parkins was walking along a quiet beach, enjoying the cold sea air, when his foot struck something... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « Parkins finds an ancient-looking metal whistle buried in the sand. It has strange marks carved into it, possibly words, but in a... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« dug »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>What does Parkins discover when he wakes up later that night? Why is this frightening?</em>", "pistes": ["Mots-clés à observer : woke, something changed, second bed, empty", "Piste : « He wakes certain something has changed, and discovers the second bed in his room — empty when he fell asleep... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« dug »</strong>.", "pistes": ["Dans le texte : « ...e sand. He bent down and dug carefully until he had f... »", "Définition réelle : Made a hole in the ground using hands or a tool.", "Exemple : « He dug carefully until the small object was finally free. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « Professor Parkins was walking along a quiet beach, enjoying the... ». Dernier paragraphe : « Parkins told himself he was being foolish, and went to... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>What does Parkins discover when he wakes up later that night? Why is this frightening?</em>", "pistes": ["Piste : « He wakes certain something has changed, and discovers the second bed in his room — empty when he fell asleep — now... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 413, "title": "The Yellow Wallpaper", "eyebrow": "Horror & Suspense", "level": "B1", "levelClass": "b1", "source": "Original extract (adapted) — Charlotte Perkins Gilman, The Yellow Wallpaper (1892). Public domain.", "readTime": "6 min", "words": 370, "preview": "Confined to her room by a husband who insisted that rest was the only cure for her nervous condition, the narrator found herself with nothing to occupy her mind but the strange, ugly wallpaper that covered the walls. Day after day, she stared at its tangled pattern — and slowly began to see something moving within it.", "paragraphs": ["I never saw a worse paper in my life. One of those <g word='sprawling' ph='/ˈsprɔːlɪŋ/' type='adjective' def='spreading out in an irregular or untidy way' ex='The sprawling pattern seemed to twist endlessly across the wall.'>sprawling</g> patterns committing every <g word='artistic' ph='/ɑːˈtɪstɪk/' type='adjective' def='relating to art or artistic taste and creativity' ex='No artistic sense could explain why anyone chose this design.'>artistic</g> sin. It is dull enough to confuse the eye in following, <g word='pronounced' ph='/prəˈnaʊnst/' type='adjective' def='very noticeable or marked; strongly expressed' ex='The colour was a pronounced, sickly yellow.'>pronounced</g> enough to <g word='constantly' ph='/ˈkɒnstəntli/' type='adverb' def='happening all the time; without stopping' ex='It constantly irritated her, demanding attention she did not wish to give.'>constantly</g> irritate and provoke study, and when you follow the lame, <g word='uncertain' ph='/ʌnˈsɜːtən/' type='adjective' def='not known, definite or fixed; lacking confidence' ex='The uncertain curves seemed to lead nowhere and everywhere at once.'>uncertain</g> curves for a little distance, they suddenly commit <g word='suicide' ph='/ˈsuːɪsɑɪd/' type='noun' def='the act of ending one's own life; here used figuratively' ex='The lines seemed to commit suicide, plunging off at impossible angles.'>suicide</g> — plunge off at outrageous angles, destroy themselves in unheard-of <g word='contradictions' ph='/ˈkɒntrəˈdɪkʃənz/' type='noun' def='statements or ideas that are opposed to or inconsistent with each other' ex='The whole design was full of strange contradictions, never quite making sense.'>contradictions</g>.", "The colour is <g word='repellent' ph='/rɪˈpelənt/' type='adjective' def='causing strong dislike or disgust; repulsive' ex='The colour was almost repellent, a sickly, unclean yellow.'>repellent</g>, almost <g word='revolting' ph='/rɪˈvəʊltɪŋ/' type='adjective' def='extremely unpleasant; disgusting' ex='It was a revolting shade, neither orange nor yellow, but something unhealthy between.'>revolting</g>; a smouldering, unclean yellow, strangely faded by the slow-turning sunlight. It is a dull yet <g word='lurid' ph='/ˈljʊərɪd/' type='adjective' def='vivid in a harsh or shocking way, especially involving violence or horror' ex='The lurid colour seemed almost to glow in certain lights.'>lurid</g> orange in some places, a sickly sulphur tint in others.", "No wonder the children hated it! I should hate it myself if I had to live in this room long. There comes my husband, and I must put this away — he hates to have me write a word. We have been here two weeks, and I have not felt like writing before, since that first day. I am sitting by the window now, in this <g word='atrocious' ph='/əˈtrəʊʃəs/' type='adjective' def='extremely unpleasant or bad in a shocking way' ex='This atrocious nursery, with its barred windows, was hardly restful at all.'>atrocious</g> nursery, and there is nothing to hinder my writing as much as I please, save lack of strength.", "I have a <g word='schedule' ph='/ˈʃedːjuːl/' type='noun' def='a plan of activities or events with the times when they are intended to happen' ex='John has prescribed a strict schedule of phosphates and rest.'>schedule</g> prescription for each hour in the day; he takes all care from me, and so I feel basely <g word='ungrateful' ph='/ʌnˈɡreɪtfəl/' type='adjective' def='not feeling or showing thanks for something received' ex='I feel ungrateful that I do not value it more.'>ungrateful</g> not to value it more. He said we came here solely on my account, that I was to have perfect rest and all the air I could get. 'Your exercise depends on your strength, my dear,' said he, 'and your food somewhat on your appetite; but air you can absorb all the time.' So we took the nursery, at the top of the house. It was nursery first, and then play-room and gymnasium, I should judge; for the windows are barred for little children, and there are rings and things in the walls."], "glossary": [{"word": "sprawling", "ph": "/ˈsprɔːlɪŋ/", "type": "adjective", "def": "Spreading out in an irregular or untidy way.", "ex": "The sprawling pattern seemed to twist endlessly across the wall."}, {"word": "pronounced", "ph": "/prəˈnaʊnst/", "type": "adjective", "def": "Very noticeable or marked; strongly expressed.", "ex": "The colour was a pronounced, sickly yellow."}, {"word": "uncertain", "ph": "/ʌnˈsɜːtən/", "type": "adjective", "def": "Not known, definite or fixed in nature.", "ex": "The uncertain curves seemed to lead nowhere and everywhere at once."}, {"word": "contradictions", "ph": "/ˈkɒntrəˈdɪkʃənz/", "type": "noun", "def": "Statements or ideas that conflict or are inconsistent with each other.", "ex": "The whole design was full of strange contradictions, never quite making sense."}, {"word": "repellent", "ph": "/rɪˈpelənt/", "type": "adjective", "def": "Causing strong dislike or disgust; repulsive.", "ex": "The colour was almost repellent, a sickly, unclean yellow."}, {"word": "lurid", "ph": "/ˈljʊərɪd/", "type": "adjective", "def": "Vivid in a harsh or shocking way, often suggesting violence or horror.", "ex": "The lurid colour seemed almost to glow in certain lights."}, {"word": "atrocious", "ph": "/əˈtrəʊʃəs/", "type": "adjective", "def": "Extremely unpleasant or bad, in a shocking way.", "ex": "This atrocious nursery, with its barred windows, was hardly restful."}, {"word": "ungrateful", "ph": "/ʌnˈɡreɪtfəl/", "type": "adjective", "def": "Not feeling or showing thanks for something received.", "ex": "She felt ungrateful that she did not value his care more."}], "questions": [{"q": "How does the narrator describe the wallpaper's pattern? What words does she use to express her dislike?", "keywords": ["sprawling", "artistic sin", "contradictions", "uncertain curves", "irritate", "provoke"], "model": "She describes the pattern as sprawling, committing every artistic sin, dull enough to confuse the eye yet pronounced enough to constantly irritate. The curves are uncertain and seem to commit suicide, plunging into outrageous angles and unheard-of contradictions — strong, almost violent language for describing wallpaper.", "frQ": "Comment la narratrice décrit-elle le motif du papier peint ? Quels mots utilise-t-elle pour exprimer son dégoût ?", "frModel": "Elle décrit le motif comme étalé, commettant tous les péchés artistiques, assez terne pour confondre l'œil mais assez prononcé pour irriter constamment. Les courbes sont incertaines et semblent se suicider, plongeant dans des angles outranciers et des contradictions inouïes — un langage fort, presque violent pour décrire du papier peint."}, {"q": "What does the narrator's description of her room and her husband's care suggest about her actual situation?", "keywords": ["nursery", "barred windows", "rings", "schedule", "prescription", "ungrateful", "take all care from me"], "model": "The room is revealed to be a former nursery with barred windows and rings in the walls — details that suggest confinement rather than comfortable rest. Her husband controls a strict schedule of her rest, food and exercise, and she feels she must call herself ungrateful even as the details suggest something closer to imprisonment than care.", "frQ": "Que suggère la description de la chambre et des soins de son mari sur sa situation réelle ?", "frModel": "La chambre s'avère être une ancienne nurserie avec des fenêtres barrées et des anneaux dans les murs — des détails qui suggèrent l'enfermement plutôt qu'un repos confortable. Son mari contrôle un horaire strict de repos, et elle se sent obligée de se qualifier d'ingrate même si les détails suggèrent quelque chose de plus proche de l'emprisonnement que des soins."}, {"q": "Analyse the narrator's tone in this extract. What contradiction exists between what she says and what she seems to feel?", "keywords": ["hate", "basely ungrateful", "perfect rest", "said we came here solely", "barred for little children"], "model": "There is a clear tension between her stated gratitude (calling herself ungrateful for not valuing her husband's care more) and her intense, almost obsessive hatred of the wallpaper and her confined situation. The detail that the windows are 'barred for little children' but she is the one confined there is deeply unsettling, suggesting she is being treated as a child or prisoner under the guise of medical care.", "frQ": "Analysez le ton de la narratrice dans cet extrait. Quelle contradiction existe entre ce qu'elle dit et ce qu'elle semble ressentir ?", "frModel": "Il y a une tension claire entre sa gratitude affirmée (se qualifiant d'ingrate de ne pas apprécier davantage les soins de son mari) et sa haine intense, presque obsessionnelle du papier peint et de sa situation confinée. Le détail que les fenêtres sont « barrées pour les petits enfants » mais que c'est elle qui y est confinée est profondément troublant."}], "writingPrompt": "Write 100–120 words continuing the narrator's diary entry. What does she begin to notice in the wallpaper's pattern over the following days? Use at least 3 words from the glossary.", "writingHints": ["Today I noticed something I had not seen before in the pattern...", "At first I thought it was simply my imagination, but...", "John would say I am seeing things, but I am certain that..."], "writingKeywords": ["sprawling", "contradictions", "repellent", "lurid", "ungrateful", "uncertain"], "isOriginal": true, "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>How does the narrator describe the wallpaper's pattern? What words does she use to express her dislike?</em>", "pistes": ["Indice du premier paragraphe : « I never saw a worse paper in my life. One of those sprawling patterns committing every artistic sin.... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « She describes the pattern as sprawling, committing every artistic sin, dull enough to confuse the eye yet pronounced enough to constantly irritate.... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« sprawling »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>Analyse the narrator's tone in this extract. What contradiction exists between what she says and what she seems to feel?</em>", "pistes": ["Mots-clés à observer : hate, basely ungrateful, perfect rest, said we came here solely", "Piste : « There is a clear tension between her stated gratitude (calling herself ungrateful for not valuing her husband's care more) and... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« sprawling »</strong>.", "pistes": ["Dans le texte : « ...in my life. One of those sprawling patterns committing ever... »", "Définition réelle : Spreading out in an irregular or untidy way.", "Exemple : « The sprawling pattern seemed to twist endlessly across the wall. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « I never saw a worse paper in my life. One... ». Dernier paragraphe : « I have a schedule prescription for each hour in the... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>What does the narrator's description of her room and her husband's care suggest about her actual situation?</em>", "pistes": ["Piste : « The room is revealed to be a former nursery with barred windows and rings in the walls — details that suggest confinement... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 414, "title": "The Turn of the Screw", "eyebrow": "Horror & Suspense", "level": "B2", "levelClass": "b2", "source": "Original extract (adapted) — Henry James, The Turn of the Screw (1898). Public domain.", "readTime": "8 min", "words": 450, "preview": "The young governess had been hired to care for two charming orphaned children at a remote country house, with one strict condition: she must never trouble her employer with any difficulties. All seemed well, until she began to see a figure standing at a distance — a figure none of the household staff would acknowledge or explain.", "paragraphs": ["It was not until the second of these <g word='apparitions' ph='/ˈæpəˈrɪʃənz/' type='noun' def='ghostly or strange figures that suddenly appear' ex='Two apparitions had now presented themselves with equal, dreadful clarity.'>apparitions</g> that <g word='vertigo' ph='/ˈvɜːtɪɡəʊ/' type='noun' def='a sensation of dizziness, as if the surroundings are spinning' ex='A kind of vertigo overtook me as I recognised what I was seeing.'>vertigo</g> overtook me, and a sense, <g word='indescribable' ph='/ˈindɪˈskraɪbəbəl/' type='adjective' def='too unusual or extreme to be described in words' ex='An indescribable horror gripped me, beyond anything I could put into words.'>indescribable</g>, that, in spite of my <g word='dismay' ph='/dɪsˈmeɪ/' type='noun' def='a feeling of concern, disappointment or distress' ex='Dismay flooded through me, yet I forced myself to remain composed.'>dismay</g>, I must, in fairness to all my scruples, see the strange figure on the spot.", "I did this, but it was already gone. It had <g word='withdrawn' ph='/wɪðˈdrɔːn/' type='verb (past participle)' def='removed or taken away, especially silently or suddenly' ex='The figure had withdrawn as silently as it had first appeared.'>withdrawn</g> in the very interval of my <g word='transit' ph='/ˈtrænzɪt/' type='noun' def='the act of passing through or across a place' ex='I had lost it during the brief transit from window to garden.'>transit</g> from the inside to the front; and I, my visitation over, was, for the moment, secure. But I had seen what I had seen, what I knew.", "The shock had not stunned, for once, my faculty of comparing notes; nor did it for an instant occur to me, in this <g word='retrospect' ph='/ˈretrəˈspekt/' type='noun' def='a survey or review of past events or situations' ex='In retrospect, I should have noted every detail of his appearance.'>retrospect</g>, that I had been guilty, by my dim <g word='apprehension' ph='/ˈæprɪˈhenʃən/' type='noun' def='anxiety or fear about something that may happen' ex='A creeping apprehension settled over me as the days passed.'>apprehension</g>, of an <g word='inconsistency' ph='/ˈinkənˈsɪstənsi/' type='noun' def='the state of not being compatible or in agreement' ex='There was a deep inconsistency between what I saw and what reason allowed.'>inconsistency</g>. I only asked myself, sharply, how I could comport myself at all, on the morrow, in the presence of the two children, without <g word='betraying' ph='/bɪˈtreɪɪŋ/' type='verb' def='revealing something that one wishes to keep hidden' ex='I had to face them without betraying any of the dread I felt.'>betraying</g> the dreadful weight I now carried.", "For if Miss Jessel was the figure my eyes had encountered, and I had no rational explanation for who else it might possibly have been, then either I was losing the ordinary <g word='composure' ph='/kəmˈpəʊʒə/' type='noun' def='calmness and self-control, especially under pressure' ex='Her composure, once unshakeable, had begun visibly to fracture.'>composure</g> of my own mind, or the small, beautiful children in my care had, in some manner too horrible to consider directly, already been touched by the very evil I had been brought to this house to protect them from."], "glossary": [{"word": "apparitions", "ph": "/ˈæpəˈrɪʃənz/", "type": "noun", "def": "Ghostly or strange figures that suddenly appear.", "ex": "Two apparitions had now presented themselves with equal, dreadful clarity."}, {"word": "indescribable", "ph": "/ˈindɪˈskraɪbəbəl/", "type": "adjective", "def": "Too unusual or extreme to be described in words.", "ex": "An indescribable horror gripped me, beyond anything I could put into words."}, {"word": "dismay", "ph": "/dɪsˈmeɪ/", "type": "noun", "def": "A feeling of concern, disappointment or distress.", "ex": "Dismay flooded through her, yet she forced herself to remain composed."}, {"word": "withdrawn", "ph": "/wɪðˈdrɔːn/", "type": "verb", "def": "Removed or taken away, especially silently or suddenly.", "ex": "The figure had withdrawn as silently as it had first appeared."}, {"word": "apprehension", "ph": "/ˈæprɪˈhenʃən/", "type": "noun", "def": "Anxiety or fear about something that may happen.", "ex": "A creeping apprehension settled over her as the days passed."}, {"word": "inconsistency", "ph": "/ˈinkənˈsɪstənsi/", "type": "noun", "def": "The state of not being compatible, logical, or in agreement.", "ex": "There was a deep inconsistency between what she saw and what reason allowed."}, {"word": "betraying", "ph": "/bɪˈtreɪɪŋ/", "type": "verb", "def": "Revealing something one wishes to keep hidden.", "ex": "She had to face the children without betraying any of the dread she felt."}, {"word": "composure", "ph": "/kəmˈpəʊʒə/", "type": "noun", "def": "Calmness and self-control, especially under pressure or difficulty.", "ex": "Her composure, once unshakeable, had begun visibly to fracture."}], "questions": [{"q": "How does the governess react physically and emotionally to her second sighting of the apparition?", "keywords": ["vertigo", "indescribable", "dismay", "sense", "overtook", "scruples", "see the figure"], "model": "She experiences vertigo, an indescribable sense of horror, and dismay. Despite this distress, she feels compelled by her own sense of fairness and scruples to go and confirm what she has seen, rather than simply fleeing or denying it.", "frQ": "Comment la gouvernante réagit-elle physiquement et émotionnellement à sa deuxième vision de l'apparition ?", "frModel": "Elle ressent des vertiges, un sentiment d'horreur indéscriptible, et de la consternation. Malgré cette détresse, elle se sent obligée par son propre sens de l'équité et ses scrupules d'aller confirmer ce qu'elle a vu."}, {"q": "What dilemma does the governess face regarding how to behave around the children after this sighting?", "keywords": ["comport", "morrow", "presence", "without betraying", "dreadful weight", "carried"], "model": "She must find a way to behave normally in front of the children the next day without betraying the dreadful weight of what she now knows or believes she has seen — she must maintain composure while privately convinced something terrible is happening.", "frQ": "Quel dilemme la gouvernante affronte-t-elle concernant son comportement envers les enfants après cette vision ?", "frModel": "Elle doit trouver un moyen de se comporter normalement devant les enfants le lendemain sans trahir le poids terrible de ce qu'elle sait ou croit avoir vu — elle doit maintenir son sang-froid tout en étant en privé convaincue que quelque chose de terrible se passe."}, {"q": "Analyse the final paragraph. What two terrifying possibilities does the governess consider, and why is the ambiguity between them so unsettling for the reader?", "keywords": ["losing composure", "mind", "children", "touched", "evil", "protect them from", "rational explanation"], "model": "She considers two equally horrifying possibilities: either she is losing her own sanity and composure, or the children she is meant to protect have already been corrupted by the same evil presence. James deliberately leaves this ambiguous — the reader, like the governess, cannot be certain whether the horror is supernatural or psychological, which is precisely what makes the novella so unsettling and has fuelled critical debate for over a century.", "frQ": "Analysez le dernier paragraphe. Quelles deux possibilités terrifiantes la gouvernante envisage-t-elle, et pourquoi l'ambiguïté entre elles est-elle si troublante pour le lecteur ?", "frModel": "Elle envisage deux possibilités également horrifiantes : soit elle perd sa propre raison et son sang-froid, soit les enfants qu'elle est censée protéger ont déjà été corrompus par la même présence maligne. James laisse cela délibérément ambigu — le lecteur, comme la gouvernante, ne peut pas être certain si l'horreur est surnaturelle ou psychologique."}], "writingPrompt": "Write 100–120 words from the governess's perspective the following morning, describing her attempt to behave normally with the children while concealing her inner turmoil. Use at least 3 words from the glossary and try to match the introspective, formal tone of the original.", "writingHints": ["I descended to breakfast resolved that nothing in my manner should betray...", "The children greeted me with their usual sweetness, and I wondered, with rising apprehension, whether...", "I forced upon myself a composure I did not, in truth, possess..."], "writingKeywords": ["composure", "betraying", "apprehension", "dismay", "inconsistency", "indescribable"], "isOriginal": true, "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>How does the governess react physically and emotionally to her second sighting of the apparition?</em>", "pistes": ["Indice du premier paragraphe : « It was not until the second of these apparitions that vertigo overtook me, and a sense, indescribable, that,... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « She experiences vertigo, an indescribable sense of horror, and dismay. Despite this distress, she feels compelled by her own sense of fairness... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« apparitions »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>Analyse the final paragraph. What two terrifying possibilities does the governess consider, and why is the ambiguity between them so unsettling for the reader?</em>", "pistes": ["Mots-clés à observer : losing composure, mind, children, touched", "Piste : « She considers two equally horrifying possibilities: either she is losing her own sanity and composure, or the children she is... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« apparitions »</strong>.", "pistes": ["Dans le texte : « ...ntil the second of these apparitions that vertigo overtook me... »", "Définition réelle : Ghostly or strange figures that suddenly appear.", "Exemple : « Two apparitions had now presented themselves with equal, dreadful clarity. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « It was not until the second of these apparitions that... ». Dernier paragraphe : « For if Miss Jessel was the figure my eyes had... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>Analyse the final paragraph. What two terrifying possibilities does the governess consider, and why is the ambiguity between them so unsettling for the reader?</em>", "pistes": ["Piste : « She considers two equally horrifying possibilities: either she is losing her own sanity and composure, or the children she is meant to... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 415, "title": "The Garden Party", "eyebrow": "Contemporary Fiction", "level": "A2", "levelClass": "a2", "source": "Original extract (adapted) — Katherine Mansfield, The Garden Party (1922). Public domain.", "readTime": "4 min", "words": 250, "preview": "It was a perfect day for a garden party. The Sheridan family had spent the whole morning preparing — putting up tents, arranging flowers, baking cakes. But then a servant brought terrible news: a poor man who lived nearby had died suddenly that very morning. Laura felt the party should be cancelled. Her family disagreed completely.", "paragraphs": ["And after all the weather was <g word='ideal' ph='/aɪˈdiːəl/' type='adjective' def='perfect; exactly as one would wish' ex='It was an ideal day for a garden party, without a cloud in sight.'>ideal</g>. They could not have had a more <g word='perfect' ph='/ˈpɜːfəkt/' type='adjective' def='having all the required or desired elements; complete and excellent' ex='The roses had bloomed in perfect timing for the party.'>perfect</g> day for a garden party if they had ordered it. Windless, warm, the sky without a cloud. Only the blue was <g word='veiled' ph='/veɪld/' type='verb (past)' def='covered or partly hidden, as if by a thin layer of material' ex='A light gold sun veiled the morning haze ever so slightly.'>veiled</g> with a haze of light gold, as it is sometimes in early summer.", "The <g word='gardener' ph='/ˈɡɑːdənə/' type='noun' def='a person who works in or looks after a garden' ex='The gardener had been mowing the lawns since dawn.'>gardener</g> had been up since dawn, mowing the lawns and <g word='sweeping' ph='/ˈswiːpɪŋ/' type='verb' def='cleaning a surface by brushing away dirt or unwanted objects' ex='Workers were sweeping the paths until they shone.'>sweeping</g> them, until the grass and the dark <g word='flat' ph='/flæt/' type='adjective' def='having a level, even surface; without bumps or curves' ex='The grass looked perfectly flat and smooth from a distance.'>flat</g> rosettes where the <g word='daisy' ph='/ˈdeɪzi/' type='noun' def='a small flower with white petals and a yellow centre' ex='Not a single daisy plant remained visible after the careful mowing.'>daisy</g> plants had been seemed to shine.", "Just before lunch, a young man delivered a message to the family. He explained, quite <g word='calmly' ph='/ˈkɑːmli/' type='adverb' def='in a way showing no agitation or distress' ex='He told them calmly about the accident, as if it were ordinary news.'>calmly</g>, that a workman who lived in a small cottage near the family's house had been killed that very morning in an accident. Laura was deeply shocked. 'We can't possibly have a garden party with a man dead just outside our front gate!' she said.", "But her mother and sister did not agree at all. 'People like that don't expect <g word='sacrifices' ph='/ˈsækrɪfaɪsɪz/' type='noun' def='things given up for the sake of something else considered more important' ex='Cancelling the party seemed like an unnecessary sacrifice to them.'>sacrifices</g> from us,' her sister said. 'And it's not very <g word='sympathetic' ph='/ˈsɪmpəˈθetɪk/' type='adjective' def='showing understanding and care for someone's feelings or suffering' ex='It was hardly sympathetic, in Laura's view, to continue celebrating.'>sympathetic</g> to spoil everyone's enjoyment as you're suggesting, Laura.' Laura felt confused and upset. She knew something felt deeply wrong about continuing with the party, but she could not quite find the words to explain why."], "glossary": [{"word": "ideal", "ph": "/aɪˈdiːəl/", "type": "adjective", "def": "Perfect; exactly as one would wish something to be.", "ex": "It was an ideal day for a garden party, without a cloud in sight."}, {"word": "perfect", "ph": "/ˈpɜːfəkt/", "type": "adjective", "def": "Having all the required elements; complete and excellent.", "ex": "The roses had bloomed in perfect timing for the party."}, {"word": "gardener", "ph": "/ˈɡɑːdənə/", "type": "noun", "def": "A person who works in or looks after a garden.", "ex": "The gardener had been mowing the lawns since dawn."}, {"word": "flat", "ph": "/flæt/", "type": "adjective", "def": "Having a level, even surface; without bumps or curves.", "ex": "The grass looked perfectly flat and smooth from a distance."}, {"word": "calmly", "ph": "/ˈkɑːmli/", "type": "adverb", "def": "In a peaceful way, showing no agitation or distress.", "ex": "He told them calmly about the accident, as if it were ordinary news."}, {"word": "sacrifices", "ph": "/ˈsækrɪfaɪsɪz/", "type": "noun", "def": "Things given up for the sake of something considered more important.", "ex": "Cancelling the party seemed like an unnecessary sacrifice to them."}, {"word": "sympathetic", "ph": "/ˈsɪmpəˈθetɪk/", "type": "adjective", "def": "Showing understanding and care for someone's feelings or suffering.", "ex": "It was hardly sympathetic, in Laura's view, to continue celebrating."}], "questions": [{"q": "How does the author describe the weather and garden at the start of the text? What feeling does this create?", "keywords": ["ideal", "perfect", "windless", "cloud", "gardener", "mowing", "shine"], "model": "The weather is described as ideal and perfect, windless and warm with a sky without a cloud. The carefully mowed garden creates a feeling of happiness and order — everything seems just right, which contrasts strongly with the sad news that follows.", "frQ": "Comment l'auteure décrit-elle le temps et le jardin au début du texte ? Quel sentiment cela crée-t-il ?", "frModel": "Le temps est décrit comme idéal et parfait, sans vent et chaud avec un ciel sans nuage. Le jardin soigneusement tondu crée un sentiment de bonheur et d'ordre — tout semble parfait, ce qui contraste fortement avec la triste nouvelle qui suit."}, {"q": "What news does the young man bring, and how does Laura react?", "keywords": ["workman", "cottage", "killed", "accident", "morning", "shocked", "can't possibly"], "model": "He brings news that a workman who lived nearby was killed in an accident that very morning. Laura is deeply shocked and feels they cannot possibly continue with the garden party with a man dead so close to their gate.", "frQ": "Quelle nouvelle le jeune homme apporte-t-il, et comment Laura réagit-elle ?", "frModel": "Il apporte la nouvelle qu'un ouvrier qui vivait à proximité a été tué dans un accident ce matin même. Laura est profondément choquée et estime qu'ils ne peuvent absolument pas continuer la fête dans le jardin avec un homme mort si près de leur portail."}, {"q": "How do Laura's mother and sister respond to her concerns? What does this reveal about the difference between the families?", "keywords": ["don't expect sacrifices", "sympathetic", "spoil", "confused", "upset", "could not find words"], "model": "Her mother and sister disagree completely, saying that 'people like that' — referring to the working-class family — don't expect sacrifices from them, and that cancelling would just spoil everyone's enjoyment. This reveals a deep social and class divide between the wealthy Sheridan family and their poorer neighbours, which Laura finds troubling but struggles to articulate.", "frQ": "Comment la mère et la sœur de Laura répondent-elles à ses inquiétudes ? Que révèle cela sur la différence entre les familles ?", "frModel": "Sa mère et sa sœur ne sont pas du tout d'accord, disant que « les gens comme ça » — faisant référence à la famille de la classe ouvrière — n'attendent pas de sacrifices de leur part. Cela révèle un fossé social et de classe profond entre la riche famille Sheridan et leurs voisins plus pauvres."}], "writingPrompt": "Write 60–80 words giving your own opinion: should the Sheridan family cancel the garden party? Why or why not? Use at least 2 words from the glossary.", "writingHints": ["I think the family should / should not cancel the party because...", "It would be more sympathetic to...", "Even though it seems unfair, perhaps..."], "writingKeywords": ["sympathetic", "sacrifices", "calmly", "perfect", "ideal"], "isOriginal": true, "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>How does the author describe the weather and garden at the start of the text? What feeling does this create?</em>", "pistes": ["Indice du premier paragraphe : « And after all the weather was ideal. They could not have had a more perfect day for a... »", "As-tu identifié le genre du texte ? (roman, article, dialogue,
