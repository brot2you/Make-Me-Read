.", "paragraphs": ["The world is on the edge of crossing the most <g word='critical' ph='/ˈkrɪtɪkəl/' type='adjective' def='extremely important; at a decisive moment' ex='The next decade is critical for climate action.'>critical</g> climate <g word='threshold' ph='/ˈθreʃəʊld/' type='noun' def='the point at which something begins to change' ex='We are approaching the threshold beyond which warming cannot be reversed.'>threshold</g>. Scientists say we have used up almost all of our ‘carbon budget’ — the amount of CO₂ we can still emit and stay below 1.5 degrees of <g word='warming' ph='/ˈwɔːmɪŋ/' type='noun' def='the process of becoming warmer' ex='Global warming is caused primarily by greenhouse gas emissions.'>warming</g>. At the current rate of <g word='emissions' ph='/ˈIˈmɪʃənz/' type='noun (plural)' def='gases released into the atmosphere, especially by burning fossil fuels' ex='Reducing emissions is the central challenge of our time.'>emissions</g>, we will <g word='exhaust' ph='/ˈIɡˈzɔːst/' type='verb' def='use up completely' ex='We will exhaust the remaining carbon budget within six years.'>exhaust</g> that budget in approximately six years.", "The 1.5°C target was agreed at the Paris Agreement in 2015. It was chosen because scientists warned that going beyond it would trigger more extreme weather events, faster sea-level rise, and the <g word='collapse' ph='/ˈkəlæps/' type='noun' def='a sudden and complete failure or breakdown' ex='The collapse of coral reef ecosystems would be catastrophic.'>collapse</g> of coral reef <g word='ecosystems' ph='/ˈiːkəʊsɪstəmz/' type='noun (plural)' def='communities of living things interacting with their environment' ex='Rainforest ecosystems contain half of all known species.'>ecosystems</g>. Even a <g word='fraction' ph='/ˈfrækʃən/' type='noun' def='a small part of something' ex='Even a fraction of a degree makes a significant difference to ecosystems.'>fraction</g> of a degree beyond 1.5°C, scientists say, significantly increases risks to humans and <g word='biodiversity' ph='/ˈbaɪəʊdɪˈvɜːsɪti/' type='noun' def='the variety of plant and animal life in a habitat' ex='Tropical forests contain extraordinary biodiversity.'>biodiversity</g>.", "Some scientists now believe 1.5°C is effectively <g word='unattainable' ph='/ˈUnəˈteɪnəbəl/' type='adjective' def='impossible to achieve' ex='The original target now seems unattainable without radical action.'>unattainable</g> without immediate and radical cuts in all sectors of the global <g word='economy' ph='/ˈIˈkɒnəmi/' type='noun' def='the system of production, distribution and consumption of goods and services' ex='The green economy is growing faster than expected.'>economy</g>. Others argue that the target still has value as a <g word='benchmark' ph='/ˈbenʃmɑːk/' type='noun' def='a standard point against which progress is measured' ex='The 1.5°C target serves as a crucial benchmark for policy.'>benchmark</g> for policy, even if it is <g word='exceeded' ph='/ˈIkˈsiːdɪd/' type='verb' def='gone beyond a set limit' ex='If the target is exceeded, action must not stop.'>exceeded</g>. ‘Every fraction of a degree matters,’ said one researcher. ‘We should not treat this as a binary pass or fail.’"], "glossary": [{"word": "critical", "ph": "/ˈkrɪtɪkəl/", "type": "adjective", "def": "Extremely important; at a decisive turning point.", "ex": "The next decade is critical for global climate action."}, {"word": "threshold", "ph": "/ˈθreʃəʊld/", "type": "noun", "def": "The point at which something begins to change or take effect.", "ex": "We are approaching the threshold beyond which warming cannot be reversed."}, {"word": "emissions", "ph": "/ˈIˈmɪʃənz/", "type": "noun", "def": "Gases released into the atmosphere, especially from burning fossil fuels.", "ex": "Reducing emissions is the central challenge of climate policy."}, {"word": "exhaust", "ph": "/ˈIɡˈzɔːst/", "type": "verb", "def": "To use up completely; to consume entirely.", "ex": "We will exhaust the carbon budget within six years at current rates."}, {"word": "ecosystems", "ph": "/ˈiːkəʊsɪstəmz/", "type": "noun", "def": "Communities of living organisms interacting with their environment.", "ex": "Rainforest ecosystems contain half of all known species."}, {"word": "biodiversity", "ph": "/ˈbaɪəʊdɪˈvɜːsɪti/", "type": "noun", "def": "The variety of plant and animal life in a particular area.", "ex": "Tropical forests contain extraordinary biodiversity."}, {"word": "unattainable", "ph": "/ˈUnəˈteɪnəbəl/", "type": "adjective", "def": "Impossible to achieve or reach.", "ex": "Without radical action, the target is now effectively unattainable."}, {"word": "benchmark", "ph": "/ˈbenʃmɑːk/", "type": "noun", "def": "A standard point of reference against which progress is measured.", "ex": "The 1.5°C target serves as a crucial benchmark for climate policy."}], "questions": [{"q": "What is the ‘carbon budget’ and why is it almost gone?", "keywords": ["carbon budget", "CO2", "emit", "exhaust", "six years", "emissions", "1.5 degrees"], "model": "The carbon budget is the total amount of CO₂ we can still release into the atmosphere and stay below 1.5°C of warming. It is almost gone because current emissions rates are so high that we will exhaust it within approximately six years if nothing changes.", "frQ": "Qu’est-ce que le « budget carbone » et pourquoi est-il presque épuisé ?", "frModel": "Le budget carbone est la quantité totale de CO₂ que nous pouvons encore rejeter dans l’atmosphère tout en restant sous 1,5°C de réchauffement. Il est presque épuisé car les taux d’émissions actuels sont si élevés que nous l’utiliserons en environ six ans sans changement."}, {"q": "Why was 1.5°C chosen as a target at the Paris Agreement?", "keywords": ["extreme weather", "sea-level rise", "collapse", "coral", "ecosystems", "biodiversity", "fraction", "risks"], "model": "Scientists chose 1.5°C because going beyond it would trigger more extreme weather events, faster sea-level rise and the collapse of coral reef ecosystems. Even a fraction of a degree beyond this significantly increases risks to humans and biodiversity.", "frQ": "Pourquoi 1,5°C a-t-il été choisi comme objectif lors de l’Accord de Paris ?", "frModel": "Les scientifiques ont choisi 1,5°C car le dépasser déclencherait davantage d’événements météorologiques extrêmes, une montée plus rapide du niveau des mers et l’effondrement des écosystèmes de récifs coralliens. Même une fraction de degré au-delà augmente significativement les risques pour les humains et la biodiversité."}, {"q": "The article presents two different views on the 1.5°C target. What are they?", "keywords": ["unattainable", "benchmark", "exceeded", "radical", "fraction", "binary", "pass or fail", "value"], "model": "One view is that 1.5°C is now effectively unattainable without immediate radical cuts and should be acknowledged as such. The other view is that it still has value as a benchmark even if exceeded — since every fraction of a degree still matters, it should not be treated as a binary pass or fail.", "frQ": "L’article présente deux points de vue différents sur l’objectif de 1,5°C. Quels sont-ils ?", "frModel": "Un point de vue est que 1,5°C est maintenant effectivement inatteignable sans des réductions radicales immédiates. L’autre est qu’il garde encore sa valeur comme point de référence même s’il est dépassé — puisque chaque fraction de degré compte, il ne devrait pas être traité comme un simple succès ou échec binaire."}], "writingPrompt": "Write a 80–100 word response to the article: Do you think governments are doing enough? What should young people do? Use at least 3 words from the glossary.", "writingHints": ["I think governments are not doing enough because...", "Young people can make a difference by...", "The most urgent priority is to reduce..."], "writingKeywords": ["emissions", "threshold", "biodiversity", "exhaust", "benchmark", "unattainable"], "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>What is the ‘carbon budget’ and why is it almost gone?</em>", "pistes": ["Indice du premier paragraphe : « The world is on the edge of crossing the most critical climate threshold. Scientists say we have used... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « The carbon budget is the total amount of CO₂ we can still release into the atmosphere and stay below 1.5°C of warming.... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« critical »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>The article presents two different views on the 1.5°C target. What are they?</em>", "pistes": ["Mots-clés à observer : unattainable, benchmark, exceeded, radical", "Piste : « One view is that 1.5°C is now effectively unattainable without immediate radical cuts and should be acknowledged as such. The... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« critical »</strong>.", "pistes": ["Dans le texte : « ...dge of crossing the most critical climate threshold. Scien... »", "Définition réelle : Extremely important; at a decisive turning point.", "Exemple : « The next decade is critical for global climate action. »"]}, "struct": {"feedback": "✅ Ce texte compte 3 paragraphes. Premier paragraphe : « The world is on the edge of crossing the most... ». Dernier paragraphe : « Some scientists now believe 1.5°C is effectively unattainable without immediate... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>What is the ‘carbon budget’ and why is it almost gone?</em>", "pistes": ["Piste : « The carbon budget is the total amount of CO₂ we can still release into the atmosphere and stay below 1.5°C of warming.... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}, "isOriginal": true}, {"id": 306, "title": "Can AI Be Truly Creative?", "eyebrow": "Contemporary Fiction", "level": "B2", "levelClass": "b2", "source": "Adapted from The Guardian, 2023.", "readTime": "7 min", "words": 400, "preview": "Last year, an AI system generated a painting that won first prize at an American art competition. The artist who submitted it was disqualified when judges discovered the work was made by a machine. The story raised a question that philosophers, artists and computer scientists are still debating: what exactly is creativity?", "paragraphs": ["Last year, an AI system generated a painting that won first prize at an American art competition. The artist who submitted it was <g word='disqualified' ph='/ˈdɪsˈkwɒlɪfaɪd/' type='verb' def='excluded from a competition for breaking the rules' ex='She was disqualified when the judges discovered the truth.'>disqualified</g> when judges discovered the work was made by a machine. The story raised a question that philosophers, artists and computer scientists are still <g word='debating' ph='/ˈdɪˈbeɪtɪŋ/' type='verb' def='discussing a question from opposing points of view' ex='Academics have been debating this question for centuries.'>debating</g>: what exactly is <g word='creativity' ph='/ˈkriːəˈtɪvɪti/' type='noun' def='the ability to produce original and imaginative ideas or things' ex='Creativity has traditionally been considered uniquely human.'>creativity</g>?", "The <g word='conventional' ph='/ˈkənˈvenʃənəl/' type='adjective' def='based on widely accepted standards; traditional' ex='The conventional view is that creativity requires consciousness.'>conventional</g> answer is that creativity requires <g word='consciousness' ph='/ˈkɒnʃəsnəs/' type='noun' def='awareness of one’s own existence and thoughts' ex='Without consciousness, can there be genuine creative intention?'>consciousness</g>, experience, and intention — qualities that machines, however sophisticated, cannot possess. When a human artist makes a choice, that choice is <g word='informed' ph='/ˈInˈfɔːmd/' type='adjective' def='shaped by knowledge, experience and deliberate thought' ex='Every artistic choice is informed by a lifetime of experience.'>informed</g> by a lifetime of experience, emotion and <g word='cultural' ph='/ˈkʌltʃərəl/' type='adjective' def='relating to the ideas, customs and arts of a society' ex='Cultural references give human art its depth and meaning.'>cultural</g> reference. An AI generates outputs by finding <g word='patterns' ph='/ˈpætənz/' type='noun (plural)' def='repeated regularities or structures in data' ex='AI learns by identifying patterns in enormous datasets.'>patterns</g> in data. It does not feel. It does not intend. It does not know what it is making.", "But others argue that this view is <g word='outdated' ph='/ˈaʊtˈdeɪtɪd/' type='adjective' def='no longer relevant or accurate; belonging to the past' ex='The idea that creativity requires suffering is outdated.'>outdated</g>. If an AI-generated image moves you, challenges you, or changes how you see the world, does it matter how it was made? Art has always used tools — cameras were once seen as the end of painting. What matters, this view argues, is the <g word='effect' ph='/ˈIˈfekt/' type='noun' def='the result or impact that something has on something else' ex='The effect of the image on the viewer is what counts.'>effect</g> on the <g word='viewer' ph='/ˈvjuːə/' type='noun' def='a person who looks at or watches something' ex='The viewer’s emotional response defines the artwork’s success.'>viewer</g>, not the <g word='mechanism' ph='/ˈmekənɪzəm/' type='noun' def='the process or system by which something is produced' ex='The mechanism of production is less important than its impact.'>mechanism</g> of production.", "A third position argues that the question itself is <g word='misleading' ph='/ˈmɪsˈliːdɪŋ/' type='adjective' def='giving a wrong impression; leading to false conclusions' ex='The framing of the debate may itself be misleading.'>misleading</g>. AI creativity, if it exists, is not the same as human creativity — it is something new. Instead of asking whether AI can be ‘truly’ creative (using human creativity as the <g word='benchmark' ph='/ˈbenʃmɑːk/' type='noun' def='a reference point used as a standard for comparison' ex='Using human art as the benchmark may be the wrong approach.'>benchmark</g>), we might ask what AI creativity is, on its own terms, and what it can offer that human creativity cannot."], "glossary": [{"word": "disqualified", "ph": "/ˈdɪsˈkwɒlɪfaɪd/", "type": "verb", "def": "Excluded from a competition or activity for breaking the rules.", "ex": "She was disqualified when judges discovered the truth."}, {"word": "debating", "ph": "/ˈdɪˈbeɪtɪŋ/", "type": "verb", "def": "Discussing a question from opposing points of view.", "ex": "Philosophers have been debating this for centuries."}, {"word": "creativity", "ph": "/ˈkriːəˈtɪvɪti/", "type": "noun", "def": "The ability to produce original and imaginative work.", "ex": "Creativity has traditionally been considered uniquely human."}, {"word": "consciousness", "ph": "/ˈkɒnʃəsnəs/", "type": "noun", "def": "Awareness of one’s own existence, thoughts and feelings.", "ex": "Without consciousness, can there be genuine creative intention?"}, {"word": "outdated", "ph": "/ˈaʊtˈdeɪtɪd/", "type": "adjective", "def": "No longer current or relevant; belonging to the past.", "ex": "The idea that only humans can be creative may be outdated."}, {"word": "mechanism", "ph": "/ˈmekənɪzəm/", "type": "noun", "def": "The process or system by which something is produced or works.", "ex": "The mechanism of production is less important than the final impact."}, {"word": "misleading", "ph": "/ˈmɪsˈliːdɪŋ/", "type": "adjective", "def": "Giving a false impression; leading to incorrect conclusions.", "ex": "The question itself may be misleading."}, {"word": "benchmark", "ph": "/ˈbenʃmɑːk/", "type": "noun", "def": "A standard or reference point used for comparison.", "ex": "Using human art as the benchmark may be the wrong approach."}], "questions": [{"q": "What is the ‘conventional’ argument against AI creativity?", "keywords": ["conventional", "consciousness", "informed", "cultural", "experience", "emotion", "intention", "patterns", "feel"], "model": "The conventional argument is that creativity requires consciousness, experience and intention — things machines cannot possess. Human artistic choices are informed by a lifetime of emotion and cultural reference. AI merely finds patterns in data without feeling, intending, or knowing what it produces.", "frQ": "Quel est l’argument « conventionnel » contre la créativité de l’IA ?", "frModel": "L’argument conventionnel est que la créativité exige la conscience, l’expérience et l’intention — des choses que les machines ne peuvent pas posséder. Les choix artistiques humains sont éclairés par toute une vie d’émotion et de référence culturelle. L’IA ne fait que trouver des schémas dans les données sans ressentir, avoir l’intention ou savoir ce qu’elle produit."}, {"q": "How does the second argument challenge the conventional view? What historical parallel does it use?", "keywords": ["outdated", "moves", "challenges", "camera", "painting", "effect", "viewer", "mechanism", "tools"], "model": "The second argument says the viewer’s response is what matters, not how something was made. It draws a parallel with photography: cameras were once seen as ending painting, but became an art form in their own right. The mechanism of production, this view argues, is less important than the effect on the viewer.", "frQ": "Comment le deuxième argument remet-il en question la vision conventionnelle ? Quelle parallèle historique utilise-t-il ?", "frModel": "Le deuxième argument dit que la réponse du spectateur est ce qui compte, pas la méthode de création. Il établit un parallèle avec la photographie : les caméras étaient autrefois vues comme la fin de la peinture, mais sont devenues une forme d’art à part entière. Le mécanisme de production importe moins que l’effet sur le spectateur."}, {"q": "What is the ‘third position’ in the debate, and why might it be the most useful?", "keywords": ["misleading", "new", "benchmark", "on its own terms", "human creativity", "different", "offer"], "model": "The third position argues that comparing AI creativity to human creativity is misleading, because it assumes human creativity is the benchmark. Instead, AI creativity might be something genuinely new that should be understood on its own terms — asking what it can offer that human creativity cannot, rather than whether it matches it.", "frQ": "Quelle est la « troisième position » dans le débat, et pourquoi pourrait-elle être la plus utile ?", "frModel": "La troisième position soutient que comparer la créativité de l’IA à la créativité humaine est trompeur, car cela suppose que la créativité humaine est le point de référence. La créativité de l’IA pourrait être quelque chose de genuinement nouveau qui devrait être compris selon ses propres termes — en demandant ce qu’elle peut offrir que la créativité humaine ne peut pas, plutôt que si elle lui correspond."}], "writingPrompt": "Do you think AI can be truly creative? Write 100–120 words presenting your position. Engage with at least two of the three arguments in the article. Use at least 3 words from the glossary.", "writingHints": ["I believe / do not believe AI can be truly creative because...", "The conventional view suggests that...", "However, one could argue that...", "The most convincing position, in my view, is..."], "writingKeywords": ["creativity", "consciousness", "mechanism", "outdated", "benchmark", "misleading", "debating"], "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>What is the ‘conventional’ argument against AI creativity?</em>", "pistes": ["Indice du premier paragraphe : « Last year, an AI system generated a painting that won first prize at an American art competition. The... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « The conventional argument is that creativity requires consciousness, experience and intention — things machines cannot possess. Human artistic choices are informed by... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« disqualified »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>What is the ‘third position’ in the debate, and why might it be the most useful?</em>", "pistes": ["Mots-clés à observer : misleading, new, benchmark, on its own terms", "Piste : « The third position argues that comparing AI creativity to human creativity is misleading, because it assumes human creativity is the... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« disqualified »</strong>.", "pistes": ["Dans le texte : « ...ist who submitted it was disqualified when judges discovered t... »", "Définition réelle : Excluded from a competition or activity for breaking the rules.", "Exemple : « She was disqualified when judges discovered the truth. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « Last year, an AI system generated a painting that won... ». Dernier paragraphe : « A third position argues that the question itself is misleading.... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>What is the ‘third position’ in the debate, and why might it be the most useful?</em>", "pistes": ["Piste : « The third position argues that comparing AI creativity to human creativity is misleading, because it assumes human creativity is the benchmark. Instead,... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}, "isOriginal": true}, {"id": 400, "title": "The Frog Prince", "eyebrow": "Fantasy", "level": "A2", "levelClass": "a2", "source": "Original extract (adapted) — The Brothers Grimm, The Frog Prince (1812). Public domain.", "readTime": "4 min", "words": 260, "preview": "A princess lost her golden ball in a deep well. A frog offered to fetch it back — but only if she promised him something in return. She agreed, never thinking she would have to keep her promise...", "paragraphs": ["In old times, when wishing still helped one, there lived a king whose daughters were all beautiful. The youngest was so beautiful that the sun itself was <g word='astonished' ph='/əˈstɒnɪʃt/' type='adjective' def='very surprised' ex='She was astonished by the news.'>astonished</g> whenever it shone on her face. Close by the king's <g word='castle' ph='/ˈkɑːsəl/' type='noun' def='a large building with strong walls, built to protect against attack' ex='The castle stood on a hill above the village.'>castle</g> lay a great dark forest, and in the forest, under an old tree, was a well.", "When the day was very warm, the king's daughter went out into the forest and sat down by the cool well. She had a golden ball, which was her favourite <g word='toy' ph='/tɔɪ/' type='noun' def='an object for a child to play with' ex='She threw the toy into the air and caught it again.'>toy</g>. She would throw it up high and catch it again, and this was her favourite game.", "But one day, the ball did not fall back into her hand. It fell into the well, and <g word='vanished' ph='/ˈvænɪʃt/' type='verb (past)' def='disappeared suddenly and completely' ex='The coin vanished into the deep water.'>vanished</g> beneath the water. The princess began to <g word='weep' ph='/wiːp/' type='verb' def='to cry, usually because of sadness' ex='She began to weep when she saw her toy was lost.'>weep</g>. She wept louder and louder. As she sat there, a voice called to her: 'What ails you, princess? You weep so that even a stone would have <g word='pity' ph='/ˈpɪti/' type='noun' def='a feeling of sadness for someone's suffering' ex='He felt pity for the poor animal.'>pity</g> on you.'", "She looked around for the speaker, and saw a frog sitting in the water. 'My golden ball has fallen into the well,' she said. 'I will fetch your ball,' said the frog, 'but what will you give me if I do?' 'Whatever you like,' said the princess, 'my dresses, my pearls and jewels.' The frog answered: 'I do not care for your dresses or jewels. But if you will love me, and let me sit beside you at your table, and eat from your golden plate, and sleep in your bed — if you <g word='promise' ph='/ˈprɒmɪs/' type='verb' def='to give your word that you will do something' ex='She promised to return the book.'>promise</g> me this, I will bring you your ball again.'", "'Oh yes,' she said, 'I promise you anything you want, if only you bring me back my ball.' But she thought to herself: 'How that silly frog does talk! He sits in the water and can only croak with the other frogs. He could never be the companion of a human being.'"], "glossary": [{"word": "astonished", "ph": "/əˈstɒnɪʃt/", "type": "adjective", "def": "Very surprised; filled with sudden wonder.", "ex": "She was astonished by how quickly the news spread."}, {"word": "castle", "ph": "/ˈkɑːsəl/", "type": "noun", "def": "A large fortified building, built to protect against attack.", "ex": "The castle stood proudly on the hill above the village."}, {"word": "toy", "ph": "/tɔɪ/", "type": "noun", "def": "An object made for a child to play with.", "ex": "She threw the toy into the air and caught it again."}, {"word": "vanished", "ph": "/ˈvænɪʃt/", "type": "verb", "def": "Disappeared suddenly and completely.", "ex": "The coin vanished into the deep water without a trace."}, {"word": "weep", "ph": "/wiːp/", "type": "verb", "def": "To cry, usually because of sadness or grief.", "ex": "She began to weep when she realised her toy was lost."}, {"word": "pity", "ph": "/ˈpɪti/", "type": "noun", "def": "A feeling of sorrow caused by someone else's suffering.", "ex": "He felt pity for the poor, shivering animal."}, {"word": "promise", "ph": "/ˈprɒmɪs/", "type": "verb", "def": "To give your word that you will definitely do something.", "ex": "She promised to return the book by Friday."}], "questions": [{"q": "Why does the princess go to the forest, and what happens to her favourite toy?", "keywords": ["golden ball", "well", "vanished", "throw", "catch", "favourite game"], "model": "The princess goes to the cool forest well on a hot day to play her favourite game of throwing and catching a golden ball. One day the ball falls into the well and vanishes beneath the water.", "frQ": "Pourquoi la princesse va-t-elle dans la forêt, et qu'arrive-t-il à son jouet préféré ?", "frModel": "La princesse va dans la forêt fraîche près du puits pour jouer à son jeu préféré, lancer et rattraper une balle en or. Un jour, la balle tombe dans le puits et disparaît sous l'eau."}, {"q": "What does the frog ask for in exchange for retrieving the ball?", "keywords": ["love me", "table", "golden plate", "sleep", "bed", "promise", "companion"], "model": "The frog asks to be loved, to sit beside the princess at her table, eat from her golden plate, and sleep in her bed — in exchange for fetching the ball.", "frQ": "Que demande la grenouille en échange de récupérer la balle ?", "frModel": "La grenouille demande à être aimée, à s'asseoir à côté de la princesse à table, manger dans son assiette d'or, et dormir dans son lit — en échange de récupérer la balle."}, {"q": "What does the princess really think about her promise? What does this reveal about her character?", "keywords": ["thought to herself", "silly frog", "croak", "never be", "companion", "human being", "said yes anyway"], "model": "She agrees out loud but privately thinks the frog is silly and could never truly be her companion. This reveals she does not intend to keep her promise — she is being dishonest to get what she wants, which sets up the moral lesson of the story.", "frQ": "Que pense vraiment la princesse de sa promesse ? Qu'est-ce que cela révèle sur son caractère ?", "frModel": "Elle accepte à voix haute mais pense en privé que la grenouille est ridicule et ne pourrait jamais être une vraie compagne. Cela révèle qu'elle n'a pas l'intention de tenir sa promesse — elle est malhonnête pour obtenir ce qu'elle veut, ce qui prépare la leçon morale de l'histoire."}], "writingPrompt": "Write 60–80 words predicting what happens next in the story. Does the princess keep her promise? What does the frog do? Use at least 2 words from the glossary.", "writingHints": ["The next morning, the frog appeared at the castle door...", "The princess tried to ignore her promise, but...", "To her surprise, the frog..."], "writingKeywords": ["promise", "vanished", "weep", "pity", "astonished"], "isOriginal": true, "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>Why does the princess go to the forest, and what happens to her favourite toy?</em>", "pistes": ["Indice du premier paragraphe : « In old times, when wishing still helped one, there lived a king whose daughters were all beautiful. The... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « The princess goes to the cool forest well on a hot day to play her favourite game of throwing and catching a... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« astonished »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>What does the princess really think about her promise? What does this reveal about her character?</em>", "pistes": ["Mots-clés à observer : thought to herself, silly frog, croak, never be", "Piste : « She agrees out loud but privately thinks the frog is silly and could never truly be her companion. This reveals... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« astonished »</strong>.", "pistes": ["Dans le texte : « ... that the sun itself was astonished whenever it shone on her... »", "Définition réelle : Very surprised; filled with sudden wonder.", "Exemple : « She was astonished by how quickly the news spread. »"]}, "struct": {"feedback": "✅ Ce texte compte 5 paragraphes. Premier paragraphe : « In old times, when wishing still helped one, there lived... ». Dernier paragraphe : « 'Oh yes,' she said, 'I promise you anything you want,... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>Why does the princess go to the forest, and what happens to her favourite toy?</em>", "pistes": ["Piste : « The princess goes to the cool forest well on a hot day to play her favourite game of throwing and catching a... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 401, "title": "The Master Thief", "eyebrow": "Fantasy", "level": "B1", "levelClass": "b1", "source": "Original extract (adapted) — from Andrew Lang's The Blue Fairy Book (1889), a translation of a traditional folk tale. Public domain.", "readTime": "6 min", "words": 420, "preview": "There once lived a man who had three sons, and the youngest was always called Simple. The other two sons mocked him constantly. One day, Simple left home to seek his fortune — and discovered a talent for theft that would astonish kings...", "paragraphs": ["There once lived a man who had three sons, and the youngest was always called Simple, because his brothers thought him a fool, <g word='incapable' ph='/ɪnˈkeɪpəbəl/' type='adjective' def='not able to do something; lacking ability' ex='He seemed incapable of finishing the simplest task.'>incapable</g> of doing anything clever. The eldest brother became a <g word='mason' ph='/ˈmeɪsən/' type='noun' def='a person who builds with stone or brick' ex='The mason spent years building the cathedral wall.'>mason</g>, the second a smith, but Simple was driven from his home with nothing but mockery to keep him warm.", "He wandered until he came to a great forest, where he saw a small light shining through the trees. Following it, he found a band of robbers sitting around a fire. They were <g word='startled' ph='/ˈstɑːtəld/' type='adjective' def='suddenly surprised or alarmed' ex='The robbers were startled by the unexpected stranger.'>startled</g> to see a stranger appear, but their captain, seeing that the young man was clever despite his <g word='ragged' ph='/ˈræɡɪd/' type='adjective' def='torn and worn; in poor condition' ex='His ragged clothes told the story of his hard journey.'>ragged</g> clothes, offered him a place in the band — if he could prove his skill.", "'Steal the roast ox from that farmer's spit without him noticing,' the captain said, 'and you shall be one of us.' Simple, who was cleverer than anyone had given him credit for, walked to the farmer's yard and threw three pairs of fine leather boots, one after another, into the path where the farmer would see them. The farmer, <g word='greedy' ph='/ˈɡriːdi/' type='adjective' def='wanting to have more than you need, especially of money or food' ex='The greedy merchant always wanted more profit.'>greedy</g> for free boots, ran back and forth collecting all three, leaving his roast ox <g word='unguarded' ph='/ʌnˈɡɑːdɪd/' type='adjective' def='not protected or watched over' ex='The treasure lay unguarded for only a moment.'>unguarded</g> just long enough for Simple to carry it away into the forest.", "The robber captain was so impressed that he made Simple their leader within the year. But Simple grew <g word='weary' ph='/ˈwɪəri/' type='adjective' def='very tired, especially from a long or difficult experience' ex='She grew weary of a life spent stealing and hiding.'>weary</g> of a life spent always running, always hiding. He longed for an honest name, even if it meant facing the brothers who had once mocked him. So Simple devised one final, <g word='audacious' ph='/ɔːˈdeɪʃəs/' type='adjective' def='extremely bold; showing a willingness to take risks' ex='His audacious plan involved fooling the king himself.'>audacious</g> plan: he would steal something so impressive that even a king would have to pardon him — the very horse from the king's own stable, with the king's groom still sitting upon it."], "glossary": [{"word": "incapable", "ph": "/ɪnˈkeɪpəbəl/", "type": "adjective", "def": "Not able to do something; lacking the necessary skill.", "ex": "His brothers thought him incapable of any clever plan."}, {"word": "mason", "ph": "/ˈmeɪsən/", "type": "noun", "def": "A person whose job is building with stone or brick.", "ex": "The mason worked for years on the cathedral wall."}, {"word": "startled", "ph": "/ˈstɑːtəld/", "type": "adjective", "def": "Suddenly surprised or slightly alarmed.", "ex": "The robbers were startled by the sudden noise."}, {"word": "ragged", "ph": "/ˈræɡɪd/", "type": "adjective", "def": "Torn and worn out; in poor physical condition.", "ex": "His ragged clothes showed the hardship of his journey."}, {"word": "greedy", "ph": "/ˈɡriːdi/", "type": "adjective", "def": "Wanting more than one needs, especially of money or food.", "ex": "The greedy merchant was never satisfied with his profits."}, {"word": "unguarded", "ph": "/ʌnˈɡɑːdɪd/", "type": "adjective", "def": "Not protected or watched over.", "ex": "The gate was left unguarded for only a few minutes."}, {"word": "weary", "ph": "/ˈwɪəri/", "type": "adjective", "def": "Very tired, especially after a long or difficult experience.", "ex": "She grew weary of a life spent always running."}, {"word": "audacious", "ph": "/ɔːˈdeɪʃəs/", "type": "adjective", "def": "Extremely bold and willing to take great risks.", "ex": "His audacious plan would fool even the king."}], "questions": [{"q": "Why does Simple leave home, and how is he treated by his brothers?", "keywords": ["fool", "incapable", "mason", "smith", "mockery", "driven from", "ragged"], "model": "Simple leaves home because his brothers think him a fool, incapable of anything clever — unlike them, who became a mason and a smith. He is driven from home with nothing but mockery.", "frQ": "Pourquoi Simple quitte-t-il la maison, et comment est-il traité par ses frères ?", "frModel": "Simple quitte la maison car ses frères le pensent incapable de quoi que ce soit d'intelligent, contrairement à eux qui sont devenus maçon et forgeron. Il est chassé de chez lui avec seulement de ='noun' def='the soft, dim light just before sunrise or after sunset' ex='They crossed the boundary into eternal twilight.'>twilight</g> into the very borders of Elfland, and win, by whatever means love and <g word='cunning' ph='/ˈkʌnɪŋ/' type='noun' def='skill in achieving one's aims by indirect or deceitful methods' ex='His cunning had helped him outwit every enemy.'>cunning</g> might provide, the hand of the King of Elfland's daughter.", "Many had attempted this <g word='quest' ph='/kwest/' type='noun' def='a long search for something difficult to find or achieve' ex='His quest for the impossible flower lasted seven years.'>quest</g> before, the old men of the village said, shaking their heads with the particular gravity that men <g word='reserve' ph='/rɪˈzɜːv/' type='verb' def='keep something especially for a particular use or person' ex='They reserved their gravest warnings for the bravest fools.'>reserve</g> for warnings they expect to be ignored. None who went into those fields beyond the frontier of twilight had returned the same as when they left, if indeed they returned at all. Time moves differently there, they said, and a man might walk for an afternoon in Elfland and discover, upon his return, that decades had <g word='elapsed' ph='/ɪˈlæpst/' type='verb' def='passed by, especially of time' ex='Three years had elapsed since he last saw his homeland.'>elapsed</g> in the world he knew.", "Alveric, who was young enough to find such warnings more <g word='alluring' ph='/əˈljʊərɪŋ/' type='adjective' def='very attractive or tempting; having a powerful charm' ex='The alluring danger of the quest drew him onward.'>alluring</g> than discouraging, set off at dawn with a sword forged from a fallen thunderbolt — the only weapon known to have any power in the lands beyond twilight. He carried also a rune given to him by a witch of the hills, who had warned him that the rune would only <g word='avail' ph='/əˈveɪl/' type='verb' def='help or be of use to someone, often used in negative or conditional contexts' ex='His sword would avail him nothing against Elfland's enchantments.'>avail</g> him once, and he must choose with great care the moment of its use.", "He walked through fields that grew steadily stranger, where the flowers did not wilt and the light never fully became day nor night, until at last he came to a wall of grey stone older than any <g word='chronicle' ph='/ˈkrɒnɪkəl/' type='noun' def='a written record of historical events in order of time' ex='No chronicle recorded when the wall was first built.'>chronicle</g> could record, beyond which lay the fields we know not, and the gardens that no man has ever properly described."], "glossary": [{"word": "petition", "ph": "/pəˈtiʃən/", "type": "noun", "def": "A formal written request, often signed by many people.", "ex": "The villagers presented a petition for a new road."}, {"word": "enhanced", "ph": "/ɪnˈhɑːnst/", "type": "verb", "def": "Increased in value, quality or attractiveness.", "ex": "The kingdom's reputation was enhanced by tales of wonder."}, {"word": "twilight", "ph": "/ˈtwaɪlɪt/", "type": "noun", "def": "The soft, dim light just before sunrise or after sunset.", "ex": "They crossed the boundary at twilight, between day and night."}, {"word": "cunning", "ph": "/ˈkʌnɪŋ/", "type": "noun", "def": "Skill in achieving goals through clever or indirect methods.", "ex": "His cunning helped him outwit even his cleverest rivals."}, {"word": "quest", "ph": "/kwest/", "type": "noun", "def": "A long, difficult search or journey to achieve something.", "ex": "His quest for the legendary sword lasted seven years."}, {"word": "elapsed", "ph": "/ɪˈlæpst/", "type": "verb", "def": "Passed by, especially used of time.", "ex": "Three full years had elapsed since he last saw home."}, {"word": "alluring", "ph": "/əˈljʊərɪŋ/", "type": "adjective", "def": "Very attractive or tempting; having powerful charm.", "ex": "The alluring danger of the unknown drew him onward."}, {"word": "avai y does the Parliament of Erl want to be ruled by a magic lord? What does this reveal about their values?</em>", "pistes": ["Piste : « The Parliament is weary of the dull, ordinary governance of their lords and presents a petition wishing for their small country's renown... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 403, "title": "From the Earth to the Moon", "eyebrow": "Science Fiction", "level": "A2", "levelClass": "a2", "source": "Original extract (adapted) — Jules Verne, From the Earth to the Moon (1865). Public domain.", "readTime": "4 min", "words": 250, "preview": "After the great American war, a club of weapons experts found themselves with nothing to do. Bored and restless, their president proposed something no one had ever attempted: building a giant cannon to fire a vehicle all the way to the Moon...", "paragraphs": ["After the great war in America had ended, the members of a famous club found themselves with nothing to do. They had spent years designing powerful weapons, but now there was peace, and a <g word='weapon' ph='/ˈwepən/' type='noun' def='an object used for fighting, such as a gun or sword' ex='The factory stopped building weapons after the war ended.'>weapon</g> expert with no war is a sad and <g word='restless' ph='/ˈrestləs/' type='adjective' def='unable to relax or be still, because of boredom or anxiety' ex='The bored, restless men needed a new project.'>restless</g> person indeed.", "One evening, the club's president, a man named Barbicane, stood up and made an <g word='announcement' ph='/əˈnaʊntsmənt/' type='noun' def='a public or formal statement about an event or plan' ex='His announcement shocked everyone in the room.'>announcement</g> that left every member of the club speechless. 'Gentlemen,' he said, 'I propose that we build a giant cannon and use it to send a <g word='projectile' ph='/prəˈdʒektaɪl/' type='noun' def='an object thrown or fired through the air, especially from a weapon' ex='The cannon could fire a projectile for many miles.'>projectile</g> all the way to the Moon.'", "There was a moment of total silence. Then the room <g word='erupted' ph='/ɪˈrʌptɪd/' type='verb' def='burst out suddenly and noisily' ex='The crowd erupted into loud applause.'>erupted</g> into noise — some men cheered, some laughed, and some simply could not believe what they had heard. Barbicane calmly explained his <g word='calculation' ph='/ˈkælkjuˈleɪʃən/' type='noun' def='a mathematical process of working something out' ex='His calculation showed exactly how much power was needed.'>calculation</g>: a cannon of enormous size, filled with a huge amount of explosive powder, could give a metal capsule enough speed to escape the Earth's pull and reach the Moon.", "Most scientists at the time said this was completely <g word='impossible' ph='/ɪmˈpɒsəbəl/' type='adjective' def='not able to happen or be done' ex='Many people thought space travel was impossible.'>impossible</g>. But Barbicane had already done the mathematics, and he was certain his plan would work. All he needed now was money, materials, and three brave men willing to climb inside the capsule and travel where no human being had ever gone before."], "glossary": [{"word": "weapon", "ph": "/ˈwepən/", "type": "noun", "def": "An object used for fighting or attacking, such as a gun or sword.", "ex": "The factory stopped building weapons once the war ended."}, {"word": "restless", "ph": "/ˈrestləs/", "type": "adjective", "def": "Unable to relax or stay still, often from boredom or anxiety.", "ex": "The bored, restless men needed a new project to occupy them."}, {"word": "announcement", "ph": "/əˈnaʊntsmənt/", "type": "noun", "def": "A public or formal statement about an event or plan.", "ex": "His sudden announcement left everyone speechless."}, {"word": "projectile", "ph": "/prəˈdʒektaɪl/", "type": "noun", "def": "An object thrown or fired through the air, especially by a weapon.", "ex": "The huge cannon could fire a projectile for miles."}, {"word": "erupted", "ph": "/ɪˈrʌptɪd/", "type": "verb", "def": "Burst out suddenly and noisily.", "ex": "The crowd erupted into loud cheering and applause."}, {"word": "calculation", "ph": "/ˈkælkjuˈleɪʃən/", "type": "noun", "def": "A mathematical process used to work something out.", "ex": "His calculation showed exactly how much power was needed."}, {"word": "impossible", "ph": "/ɪmˈpɒsəbəl/", "type": "adjective", "def": "Not able to happen, exist, or be done.", "ex": "Many scientists believed space travel was completely impossible."}], "questions": [{"q": "Why are the members of the club restless and bored?", "keywords": ["war", "ended", "weapon", "peace", "restless", "nothing to do"], "model": "The members spent years designing weapons during the war, but now that peace has come, they have nothing to do, which leaves the weapon experts feeling bored and restless.", "frQ": "Pourquoi les membres du club sont-ils agités et ennuyés ?", "frModel": "Les membres ont passé des années à concevoir des armes pendant la guerre, mais maintenant que la paix est arrivée, ils n'ont plus rien à faire, ce qui laisse les experts en armement ennuyés et agités."}, {"q": "What does Barbicane propose, and how do the other members react?", "keywords": ["cannon", "Moon", "projectile", "silence", "erupted", "cheered", "laughed"], "model": "Barbicane proposes building a giant cannon to fire a projectile all the way to the Moon. After a moment of complete silence, the room erupts — some cheer, some laugh, and others simply cannot believe what they heard.", "frQ": "Que propose Barbicane, et comment les autres membres réagissent-ils ?", "frModel": "Barbicane propose de construire un canon géant pour tirer un projectile jusqu'à la Lune. Après un moment de silence total, la salle explose — certains acclament, d'autres rient, et d'autres encore n'arrivent simplement pas à croire lan a reality?</em>", "pistes": ["Mots-clés à observer : money, materials, three, brave men", "Piste : « Barbicane says he needs money, materials, and three brave men willing to climb into the capsule and travel where no... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« weapon »</strong>.", "pistes": ["Dans le texte : « ...years designing powerful weapons, but now there was peac... »", "Définition réelle : An object used for fighting or attacking, such as a gun or sword.", "Exemple : « The factory stopped building weapons once the war ended. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « After the great war in America had ended, the members... ». Dernier paragraphe : « Most scientists at the time said this was completely impossible.... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>Why are the members of the club restless and bored?</em>", "pistes": ["Piste : « The members spent years designing weapons during the war, but now that peace has come, they have nothing to do, which leaves... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 404, "title": "The Machine Stops", "eyebrow": "Science Fiction", "level": "B1", "levelClass": "b1", "source": "Original extract (adapted) — E.M. Forster, The Machine Stops (1909). Public domain.", "readTime": "6 min", "words": 380, "preview": "In an underground world, every human need was satisfied by the Machine. People lived alone in identical rooms, communicating only through screens, never touching the earth or breathing unfiltered air. Vashti believed the Machine was perfect — until her son asked her to visit him in person.", "paragraphs": ["Imagine, if you can, a small room, hexagonal in shape, like the <g word='cell' ph='/sel/' type='noun' def='a small enclosed space, such as a room in a prison or part of a honeycomb' ex='Each cell of the honeycomb was perfectly identical.'>cell</g> of a bee. It is lit neither by window nor by lamp, yet it is filled with a soft light. In the centre of the room, sitting in an <g word='armchair' ph='/ˈɑːmtʃeə/' type='noun' def='a chair with supports on either side for one's arms' ex='She sat comfortably in her armchair, surrounded by screens.'>armchair</g>, is a woman. To her, this room is not small — it is the entire world, and she rarely leaves it.", "Vashti's room contained everything she needed. There was a chair for sitting, a bed for sleeping, and a <g word='keyboard' ph='/ˈkiːbɔːd/' type='noun' def='a set of buttons used to operate a machine, especially a computer' ex='She typed quickly on the keyboard to call her friends.'>keyboard</g> through which she could call anyone in the world and see their face on a small blue plate. The Machine provided everything: food, warmth, music, conversation. Vashti had not seen the sun in years and did not <g word='miss' ph='/mɪs/' type='verb' def='to feel sad about the absence of something' ex='She did not miss the outside world at all.'>miss</g> it.", "One day, the blue plate lit up, and her son Kuno's face appeared. 'Mother,' he said, 'I want to see you. Not through the Machine. I want you to come to me.' Vashti was <g word='horrified' ph='/ˈhɒrɪfaɪd/' type='adjective' def='feeling extreme shock and disgust' ex='She was horrified by his strange and dangerous request.'>horrified</g>. 'But why?' she asked. 'I can see you now. What more do you want?' 'I want to see you without the Machine,' Kuno replied. 'There is something I must tell you, and the Machine must not hear it.'", "Vashti was deeply uncomfortable. The idea of <g word='travel' ph='/ˈtrævəl/' type='noun' def='the act of moving from one place to another, especially over a long distance' ex='Travel had become rare and frightening for most people.'>travel</g> disgusted her — it meant leaving her perfect room, entering the noisy air-ship, and facing other human beings without a screen between them. 'You know I dislike air-ships,' she said. 'And I dislike seeing the horrible sea. But for you, Kuno, I suppose I must <g word='endure' ph='/ɪnˈdjʊə/' type='verb' def='to suffer something difficult or unpleasant without giving up' ex='She would endure the discomfort of travel to see her son.'>endure</g> it.'"], "glossary": [{"word": "cell", "ph": "/sel/", "type": "noun", "def": "A small enclosed space, like a room in a honeycomb or a prison.", "ex": "Each cell of the honeycomb was perfectly identical."}, {"word": "armchair", "ph": "/ˈɑːmtʃeə/", "type": "noun", "def": "A chair with raised sides to support one's arms.", "ex": "She sat comfortably in her armchair, surrounded by glowing screens."}, {"word": "keyboard", "ph": "/ˈkiːbɔːd/", "type": "noun", "def": "A set of buttons used to operate a machine or computer.", "ex": "She typed quickly on the keyboard to call her friends."}, {"word": "miss", "ph": "/mɪs/", "type": "verb", "def": "To feel sad about the absence of someone or something.", "ex": "She did not miss the outside world at all."}, {"word": "horrified", "ph": "/ˈhɒrɪfaɪd/", "type": "adjective", "def": "Feeling extreme shock, fear and disgust.", "ex": "She was horrified by his strange and dangerous request."}, {"word": "travel", "ph": "/ˈtrævəl/", "type": "noun", "def": "The act of moving from one place to another, especially over distance.", "ex": "Travel had become rare and frightening for most people."}, {"word": "endure", "ph": "/ɪnˈdjʊə/", "type": "verb", "def": "To suffer through something difficult without giving up.", "ex": "She would endure the discomfort of travel to see her son."}], "questions": [{"q": "Describe Vashti's room and how she feels about it. What does it provide for her?", "keywords": ["hexagonal", "cell", "armchair", "keyboard", "everything", "needed", "food", "warmth"], "model": "Vashti's room is small and hexagonal, like a bee's cell, but to her it is the entire world. It provides everything she needs: a chair, a bed, a keyboard to call anyone, food, warmth, music and conversation through the Machine.", "frQ": "Décrivez la chambre de Vashti et ce qu'elle ressent à son sujet. Que lui fournit-elle ?", "frModel": "La chambre de Vashti est petite et hexagonale, comme l'alvéole d'une abeille, mais pour elle c'est le monde entier. Elle lui fournit tout ce dont elle a besoin : une chaise, un lit, un clavier pour appeler n'importe qui, de la nourriture, de la chaleur, de la musique et des conversations grâce à la Machine."}, {"q": "What does Kuno ask his mother to do, and why is Vashti horrified by this request?", "keywords": ["come to me", "without the Machine", "horrified", "why", "travel", "leaving her room"], "model": "Kuno asks Vashti to visit him in person, without using the Machine to communicate. She is horrified because this means leaving her perfect, controlled room and facing the discomfort of real travel and human contact.", "frQ": "Que demande Kuno à sa mère, et pourquoi Vashti est-elle horrifiée par cette demande ?", "frModel": "Kuno demande à Vashti de lui rendre visite en personne, sans utiliser la Machine pour communiquer. Elle est horrifiée car cela signifie quitter sa chambre parfaite et contrôlée et affronter l'inconfort d'un vrai voyage et d'un contact humain réel."}, {"q": "What does Vashti's reluctance to travel reveal about the society Forster describes?", "keywords": ["dislike", "air-ships", "sea", "disgusted", "screen", "human beings", "endure"], "model": "Vashti's reaction reveals a society that has become entirely dependent on technology and isolated from physical reality. She finds direct human contact and the natural world (the sea, travel) disgusting and frightening, having only experienced life through a screen for years.", "frQ": "Que révèle la réticence de Vashti à voyager sur la société décrite par Forster ?", "frModel": "La réaction de Vashti révèle une société devenue entièrement dépendante de la technologie et isolée de la réalité physique. Elle trouve le contact humain direct et le monde naturel (la mer, le voyage) dégoûtants et effrayants, n'ayant connu la vie qu'à travers un écran pendant des années."}], "writingPrompt": "Write 100–120 words describing what you think Kuno wants to tell his mother that the Machine must not hear. Use at least 3 words from the glossary.", "writingHints": ["Kuno had discovered something the Machine did not want anyone to know...", "He had found a way to...", "If the Machine learned of this, it would..."], "writingKeywords": ["horrified", "endure", "travel", "miss", "keyboard"], "isOriginal": true, "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>Describe Vashti's room and how she feels about it. What does it provide for her?</em>", "pistes": ["Indice du premier paragraphe : « Imagine, if you can, a small room, hexagonal in shape, like the cell of a bee. It is... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « Vashti's room is small and hexagonal, like a bee's cell, but to her it is the entire world. It provides everything she... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« cell »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>What does Vashti's reluctance to travel reveal about the society Forster describes?</em>", "pistes": ["Mots-clés à observer : dislike, air-ships, sea, disgusted", "Piste : « Vashti's reaction reveals a society that has become entirely dependent on technology and isolated from physical reality. She finds direct... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« cell »</strong>.", "pistes": ["Dans le texte : « ...gonal in shape, like the cell of a bee. It is lit neit... »", "Définition réelle : A small enclosed space, like a room in a honeycomb or a prison.", "Exemple : « Each cell of the honeycomb was perfectly identical. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « Imagine, if you can, a small room, hexagonal in shape,... ». Dernier paragraphe : « Vashti was deeply uncomfortable. The idea of travel disgusted her... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>What does Kuno ask his mother to do, and why is Vashti horrified by this request?</em>", "pistes": ["Piste : « Kuno asks Vashti to visit him in person, without using the Machine to communicate. She is horrified because this means leaving her... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 405, "title": "Frankenstein, or The Modern Prometheus", "eyebrow": "Science Fiction", "level": "B2", "levelClass": "b2", "source": "Original extract — Mary Shelley, Frankenstein, or The Modern Prometheus (1818). Public domain.", "readTime": "8 min", "words": 480, "preview": "For nearly two years, Victor Frankenstein had laboured in secret, gathering materials from charnel houses and dissecting rooms to construct a being unlike any that had walked the earth. On a dreary night in November, his work was finally complete — and he watched, with mounting horror, as it opened its eyes.", "paragraphs": ["It was on a dreary night of November that I beheld the <g word='accomplishment' ph='/əˈkʌmplɪʃmənt/' type='noun' def='the successful completion of a difficult task' ex='After years of labour, the accomplishment felt strangely hollow.'>accomplishment</g> of my toils. With an anxiety that almost amounted to <g word='agony' ph='/ˈæɡəni/' type='noun' def='extreme physical or mental suffering' ex='He worked through agony to complete his terrible task.'>agony</g>, I collected the instruments of life around me, that I might <g word='infuse' ph='/ɪnˈfjuːz/' type='verb' def='to fill or cause to be permeated with a quality or feeling; here, to introduce life' ex='I sought to infuse the lifeless form with a spark of being.'>infuse</g> a spark of being into the lifeless thing that lay at my feet.", "It was already one in the morning; the rain pattered <g word='dismally' ph='/ˈdɪzməli/' type='adverb' def='in a way that causes or shows sadness; gloomily' ex='The rain fell dismally against the window panes.'>dismally</g> against the panes, and my candle was nearly burnt out, when, by the glimmer of the half-extinguished light, I saw the dull yellow eye of the creature open. It breathed hard, and a <g word='convulsive' ph='/kənˈvʌlsiv/' type='adjective' def='relating to sudden, uncontrollable movement of the body' ex='A convulsive shudder moved through its enormous limbs.'>convulsive</g> motion agitated its limbs.", "How can I describe my <g word='emotions' ph='/ɪˈməʊʃənz/' type='noun' def='strong feelings, such as love, fear or anger' ex='His emotions ranged from triumph to absolute terror.'>emotions</g> at this catastrophe, or how delineate the wretch whom with such infinite pains and care I had endeavoured to form? His limbs were in proportion, and I had selected his features as beautiful. Beautiful! Great God! His yellow skin scarcely covered the work of muscles and arteries beneath; his hair was of a lustrous black, and his teeth of a pearly whiteness; but these <g word='luxuriances' ph='/lʌɡˈzjʊəriənsɪz/' type='noun' def='abundant or rich qualities' ex='The luxuriances of his hair only made the rest more horrible.'>luxuriances</g> only formed a more horrid contrast with his <g word='watery' ph='/ˈwɔːtəri/' type='adjective' def='containing too much water; thin and pale, as if diluted' ex='His watery eyes seemed almost the same colour as the sockets in which they were set.'>watery</g> eyes, that seemed almost of the same colour as the dun-white sockets in which they were set.", "The <g word='dreams' ph='/driːmz/' type='noun' def='a series of thoughts, images and sensations occurring during sleep; also, hopes or ambitions' ex='His dreams of glory had become a waking nightmare.'>dreams</g> that had been my food and pleasant rest for so long a space were now become a hell to me; and the change was so rapid, the overthrow so complete! Unable to endure the aspect of the being I had created, I rushed out of the room, and continued a long time traversing my bed-chamber, unable to compose my mind to sleep."], "glossary": [{"word": "accomplishment", "ph": "/əˈkʌmplɪʃmənt/", "type": "noun", "def": "The successful completion of a difficult task.", "ex": "After years of secret labour, the accomplishment felt strangely hollow."}, {"word": "agony", "ph": "/ˈæɡəni/", "type": "noun", "def": "Extreme physical or mental suffering.", "ex": "He worked through agony to complete his terrible task."}, {"word": "infuse", "ph": "/ɪnˈfjuːz/", "type": "verb", "def": "To fill something with a particular quality; here, to introduce life.", "ex": "He sought to infuse the lifeless form with a spark of being."}, {"word": "dismally", "ph": "/ˈdɪzməli/", "type": "adverb", "def": "In a gloomy, sad or depressing way.", "ex": "The rain fell dismally against the window panes."}, {"word": "convulsive", "ph": "/kənˈvʌlsiv/", "type": "adjective", "def": "Relating to sudden, uncontrollable bodily movement.", "ex": "A convulsive shudder moved through its enormous limbs."}, {"word": "emotions", "ph": "/ɪˈməʊʃənz/", "type": "noun", "def": "Strong feelings, such as love, fear, joy or anger.", "ex": "His emotions ranged from triumph to absolute terror."}, {"word": "watery", "ph": "/ˈwɔːtəri/", "type": "adjective", "def": "Containing too much water; thin, pale or diluted in appearance.", "ex": "His watery eyes seemed the same dull colour as the sockets."}], "questions": [{"q": "What is Victor Frankenstein attempting to do at the start of this extract, and what is his emotional state?", "keywords": ["accomplishment", "toils", "anxiety", "agony", "infuse", "spark of being", "instruments of life"], "model": "Victor is attempting to bring his creation to life, infusing it with 'a spark of being.' His emotional state is one of intense anxiety bordering on agony, having spent years labouring in secret toward this single accomplishment.", "frQ": "Que tente de faire Victor Frankenstein au début de cet extrait, et quel est son état émotionnel ?", "frModel": "Victor tente de donner vie à sa création, en lui insufflant « une étincelle d'être ». Son état émotionnel est une anxiété intense frôlant l'agonie, ayant passé des années à travailler en secret vers ce seul accomplissement."}, {"q": "How does Shelley use physical description to create horror, rather than simply telling us the creature is frightening?", "keywords": ["yellow skin", "muscles", "arteries", "luxuriances", "black hair", "watery eyes", "contrast"], "model": "Shelley creates horror through specific, vivid physical contrasts: beautiful features (lustrous black hair, pearly white teeth) set against horrifying details (yellow skin barely covering visible muscles and arteries, watery eyes the same dull colour as their sockets). The juxtaposition of beauty and decay is more disturbing than simple description of ugliness.", "frQ": "Comment Shelley utilise-t-elle la description p , "keywords": ["servants", "bolted", "unlocked", "previous day", "truth became clear", "captive"], "model": "Harker realises there are no servants at all — the Count does everything himself. More alarmingly, doors that were unlocked the previous day are now bolted from the outside, making the truth clear: he is being held captive.", "frQ": "Quelle preuve fait réaliser à Harker qu'il est un prisonnier plutôt qu'un invité ?", "frModel": "Harker réalise qu'il n'y a aucun domestique — le Comte fait tout lui-même. Plus alarmant encore, des portes qui étaient déverrouillées la veille sont maintenant verrouillées de l'extérieur, rendant la vérité claire : il est retenu prisonnier."}, {"q": "Describe the final, most disturbing thing Harker sees. Why is it so shocking?", "keywords": ["window", "Count climbing", "wall", "face-first", "lizard", "monstrous", "blood freeze"], "model": "Harker sees the Count climbing down the outer castle wall face-first, like a lizard crawling along stone. This is shocking because it reveals the Count is not simply a strange host but something inhuman and monstrous, capable of impossible physical feats.", "frQ": "Décrivez la chose la plus troublante que Harker voit à la fin. Pourquoi est-ce si choquant ?", "frModel": "Harker voit le Comte descendre le mur extérieur du château face contre terre, comme un lézard rampant sur la pierre. C'est choquant car cela révèle que le Comte n'est pas simplement un hôte étrange mais quelque chose d'inhumain et monstrueux, capable d'exploits physiques impossibles."}], "writingPrompt": "Write 100–120 words from Harker's point of view describing what he does immediately after witnessing the Count climbing the wall. Use at least 3 words from the glossary.", "writingHints": ["I stepped back from the window, my hands trembling...", "I knew now that I had to find a way to...", "Every instinct told me to..."], "writingKeywords": ["dread", "captive", "escape", "bolted", "vanished", "disturbing"], "isOriginal": true, "st  texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>Describe the final, most disturbing thing Harker sees. Why is it so shocking?</em>", "pistes": ["Piste : « Harker sees the Count climbing down the outer castle wall face-first, like a lizard crawling along stone. This is shocking because it... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 408, "title": "The Strange Case of Dr Jekyll and Mr Hyde", "eyebrow": "Thriller & Suspense", "level": "B2", "levelClass": "b2", "source": "Original extract (adapted) — Robert Louis Stevenson, The Strange Case of Dr Jekyll and Mr Hyde (1886). Public domain.", "readTime": "8 min", "words": 460, "preview": "Mr Utterson, a respectable lawyer, had grown increasingly troubled by his old friend Dr Jekyll's relationship with a repulsive young man named Mr Hyde. When a witness described seeing Hyde trample a child without remorse, Utterson resolved to investigate — never suspecting the monstrous truth that connected the two men.", "paragraphs": ["Mr Utterson the lawyer was a man of a <g word='rugged' ph='/ˈrʌɡɪd/' type='adjective' def='having a strong, rough or weathered appearance or character' ex='His rugged, undemonstrative face concealed a deeply loyal heart.'>rugged</g> countenance, that was never lighted by a smile; cold, scanty and <g word='embarrassed' ph='/ɪmˈbærəst/' type='adjective' def='feeling self-conscious or awkward in social situations' ex='He was embarrassed in conversation, yet utterly dependable in friendship.'>embarrassed</g> in discourse; backward in sentiment; lean, long, dusty, dreary, and yet somehow <g word='lovable' ph='/ˈlʌvəbəl/' type='adjective' def='easy to love or feel affection for' ex='There was something deeply lovable beneath his austere exterior.'>lovable</g>. At friendly meetings, something eminently human beaconed from his eye, something that never found its way into his talk.", "For some weeks now, Mr Utterson had been troubled by an account given to him by a distant cousin, who described witnessing a strange and <g word='repugnant' ph='/rɪˈpʌɡnənt/' type='adjective' def='extremely distasteful and offensive; arousing disgust' ex='The man's repugnant appearance had repelled everyone who saw him.'>repugnant</g> little man, walking briskly through the streets, who had trampled <g word='calmly' ph='/ˈkɑːmli/' type='adverb' def='in a way showing no agitation or nervousness; peacefully' ex='He walked away calmly, as if nothing unusual had occurred.'>calmly</g> over the body of a screaming child, without so much as a backward glance.", "What troubled Utterson most was not the cruelty of the act itself, though it was cruel enough, but the name the witness had given for the man responsible: Edward Hyde — the very name that had recently begun to <g word='recur' ph='/rɪˈkɜː/' type='verb' def='to occur again, especially repeatedly' ex='The same troubling name continued to recur in his thoughts.'>recur</g> with disturbing frequency in the will of his old and dear friend, Dr Henry Jekyll.", "The will, which Utterson himself had drawn up some years before at the doctor's <g word='insistence' ph='/ɪnˈsɪstənts/' type='noun' def='the act of demanding or asserting something firmly and persistently' ex='He had drafted the document only at the doctor's strange insistence.'>insistence</g>, left the whole of Jekyll's considerable fortune to this same Edward Hyde, in the event of the doctor's death — or, more strangely still, in the event of his <g word='disappearance' ph='/ˈdɪsəˈpɪrənts/' type='noun' def='an instance of someone or something ceasing to be visible or present' ex='A sudden, unexplained disappearance for more than three months would activate the will's terms.'>disappearance</g> for any period longer than three months. Utterson had thought it merely the eccentric request of a brilliant but unconventional man of science. Now, with this fresh and <g word='hideous' ph='/ˈhɪdiəs/' type='adjective' def='extremely ugly or repulsive, often in a morally shocking way' ex='The connection between his friend and such a hideous character troubled him deeply.'>hideous</g> account before him, he began to wonder what hold this monstrous Mr Hyde truly had over a man as respected and gentle as his old friend."], "glossary": [{"word": "rugged", "ph": "/ˈrʌɡɪd/", "type": "adjective", "def": "Having a strong, rough or weathered appearance or character.", "ex": "His rugged, undemonstrative face concealed a deeply loyal heart."}, {"word": "embarrassed", "ph": "/ɪmˈbærəst/", "type": "adjective", "def": "Feeling self-conscious or awkward, especially in conversation.", "ex": "He was famously embarrassed in conversation, despite his loyalty as a friend."}, {"word": "repugnant", "ph": "/rɪˈpʌɡnənt/", "type": "adjective", "def": "Extremely distasteful and offensive; causing strong disgust.", "ex": "The man's repugnant appearance repelled everyone who saw him."}, {"word": "calmly", "ph": "/ˈkɑːmli/", "type": "adverb", "def": "In a peaceful way, showing no agitation or distress.", "ex": "He walked away calmly, as if nothing unusual had occurred."}, {"word": "recur", "ph": "/rɪˈkɜː/", "type": "verb", "def": "To occur again, especially repeatedly over time.", "ex": "The same troubling name continued to recur in his thoughts."}, {"word": "insistence", "ph": "/ɪnˈsɪstənts/", "type": "noun", "def": "The act of demanding or asserting something firmly and persistently.", "ex": "He had drafted the document only at the doctor's strange insistence."}, {"word": "disappearance", "ph": "/ˈdɪsəˈpɪrənts/", "type": "noun", "def": "An instance of someone or something ceasing to be present or visible.", "ex": "His sudden disappearance for three months would activate the will."}, {"word": "hideous", "ph": "/ˈhɪdiəs/", "type": "adjective", "def": "Extremely ugly or repulsive, often in a morally shocking way.", "ex": "The connection to such a hideous character troubled him deeply."}], "questions": [{"q": "How does Stevenson describe Utterson's character in the opening paragraph? What is the effect of this characterisation?", "keywords": ["rugged", "never lighted by smile", "embarrassed", "lovable", "eminently human", "backward in sentiment"], "model": "Utterson is described as rugged, cold and embarrassed in conversation, yet somehow deeply lovable beneath his austere exterior. This characterisation establishes him as a trustworthy, observant narrator figure — someone unlikely to exaggerate or imagine danger, which makes his growing alarm later in the story more credible.", "frQ": "Comment Stevenson décrit-il le caractère d'Utterson dans le premier paragraphe ? Quel est l'effet de cette caractérisation ?", "frModel": "Utterson est décrit comme rude, froid et gêné en conversation, mais pourtant profondément attachant sous son extérieur austère. Cette caractérisation l'établit comme un narrateur digne de confiance et observateur — quelqu'un peu susceptible d'exagérer ou d'imaginer le danger, ce qui rend son alarme croissante plus tard dans l'histoire plus crédible."}, {"q": "What troubling account does Utterson's cousin describe, and why does the name Hyde specifically alarm Utterson?", "keywords": ["trampled", "child", "calmly", "repugnant", "name", "recur", "Jekyll's will"], "model": "The cousin describes a repugnant man who calmly trampled a screaming child without remorse. Utterson is alarmed specifically because the name given — Edward Hyde — is the same name that recurs throughout his friend Dr Jekyll's will.", "frQ": "Quel récit troublant le cousin d'Utterson décrit-il, et pourquoi le nom Hyde alarme-t-il spécifiquement Utterson ?", "frModel": "Le cousin décrit un homme répugnant qui a calmement piétiné un enfant hurlant sans remords. Utterson est alarmé spécifiquement parce que le nom donné — Edward Hyde — est le même nom qui revient tout au long du testament de son ami le Dr Jekyll."}, {"q": "What unusual clause exists in Jekyll's will, and what does it suggest about the relationship between Jekyll and Hyde?", "keywords": ["fortune", "Hyde", "death", "disappearance", "three months", "insistence", "eccentric"], "model": "The will leaves Jekyll's entire fortune to Hyde upon Jekyll's death, or strangely, upon his disappearance for more than three months. This odd clause, combined with the disturbing account of Hyde's cruelty, suggests an unusually close and troubling connection between the respected doctor and this hideous, violent man — setting up the novel's central mystery.", "frQ": "Quelle clause inhabituelle existe dans le testament de Jekyll, et que suggère-t-elle sur la relation entre Jekyll et Hyde ?", "frModel": "Le testament laisse toute la fortune de Jekyll à Hyde à la mort de Jekyll, ou étrangement, en cas de disparition pendant plus de trois mois. Cette clause étrange, combinée au récit troublant de la cruauté de Hyde, suggère une connexion inhabituellement étroite et troublante entre le médecin respecté et cet homme monstrueux."}], "writingPrompt": "Write 100–120 words as a diary entry from Utterson's perspective after learning this news, expressing his suspicions and fears about his old friend. Use at least 3 words from the glossary and try to match the formal Victorian register of the original.", "writingHints": ["I confess that the events of this day have left me deeply troubled...", "I have known Henry Jekyll for these many years, and yet...", "What hold could such a hideous creature possibly have over..."], "writingKeywords": ["repugnant", "hideous", "insistence", "disappearance", "recur", "embarrassed"], "isOriginal": true, "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>How does Stevenson describe Utterson's character in the opening paragraph? What is the effect of this characterisation?</em>", "pistes": ["Indice du premier paragraphe : « Mr Utterson the lawyer was a man of a rugged countenance, that was never lighted by a smile;... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « Utterson is described as rugged, cold and embarrassed in conversation, yet somehow deeply lovable beneath his austere exterior. This characterisation establishes him... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« rugged »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>What unusual clause exists in Jekyll's will, and what does it suggest about the relationship between Jekyll and Hyde?</em>", "pistes": ["Mots-clés à observer : fortune, Hyde, death, disappearance", "Piste : « The will leaves Jekyll's entire fortune to Hyde upon Jekyll's death, or strangely, upon his disappearance for more than three... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« rugged »</strong>.", "pistes": ["Dans le texte : « ...he lawyer was a man of a rugged countenance, that was ne... »", "Définition réelle : Having a strong, rough or weathered appearance or character.", "Exemple : « His rugged, undemonstrative face concealed a deeply loyal heart. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « Mr Utterson the lawyer was a man of a rugged... ». Dernier paragraphe : « The will, which Utterson himself had drawn up some years... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à c
