 weather is described as ideal and perfect, windless and warm with a sky without a cloud. The carefully mowed garden creates... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 416, "title": "The Story of an Hour", "eyebrow": "Contemporary Fiction", "level": "B1", "levelClass": "b1", "source": "Original extract (adapted) — Kate Chopin, The Story of an Hour (1894). Public domain.", "readTime": "6 min", "words": 340, "preview": "Mrs Mallard was told, very gently, that her husband had been killed in a railroad accident. She wept immediately, then withdrew alone to her room. There, sitting by an open window in the spring afternoon, she began to feel something she did not expect — something that frightened and astonished her in equal measure.", "paragraphs": ["Knowing that Mrs Mallard had a weak heart, great care was taken to break to her, as gently as possible, the news of her husband's death. It was her sister, Josephine, who told her, in <g word='broken' ph='/ˈbrəʊkən/' type='adjective' def='interrupted; not continuous or complete; here, hesitant and incomplete sentences' ex='She spoke in broken sentences, unable to find the right words.'>broken</g> sentences, <g word='veiled' ph='/veɪld/' type='verb (past)' def='hidden or partly disguised' ex='Her meaning was veiled at first, then suddenly painfully clear.'>veiled</g> hints that revealed in half <g word='concealing' ph='/kənˈsiːlɪŋ/' type='verb' def='hiding from view or knowledge' ex='She kept concealing the worst of the truth as long as possible.'>concealing</g>.", "She did not hear the story as many women have heard the same, with a <g word='paralyzed' ph='/ˈpærəlaɪzd/' type='adjective' def='unable to move or act; here used figuratively for an inability to react' ex='She did not sit paralyzed, accepting the loss without question.'>paralyzed</g> inability to accept its significance. She wept at once, with sudden, wild <g word='abandonment' ph='/əˈbændənmənt/' type='noun' def='a complete and unrestrained giving way to one's emotions' ex='She wept with a wild abandonment in her sister's arms.'>abandonment</g>, in her sister's arms. When the storm of grief had spent itself, she went away to her room alone. She would have no one follow her.", "There stood, facing the open window, a comfortable, <g word='roomy' ph='/ˈruːmi/' type='adjective' def='having plenty of space; spacious' ex='The roomy armchair seemed to invite her into its deep cushions.'>roomy</g> armchair. Into this she sank, <g word='pressed' ph='/prest/' type='verb (past)' def='pushed firmly against something; here, overwhelmed by exhaustion' ex='Pressed down by a physical exhaustion that haunted her body.'>pressed</g> down by a physical exhaustion that haunted her body and seemed to reach into her soul. She could see in the open square before her house the tops of trees that were all <g word='aquiver' ph='/əˈkwɪvə/' type='adjective' def='trembling or quivering, especially with life or excitement' ex='The trees were all aquiver with the new spring life.'>aquiver</g> with the new spring life.", "There was something coming to her, and she was waiting for it, <g word='fearfully' ph='/ˈfɪəfəli/' type='adverb' def='in a way showing fear or anxiety' ex='She waited fearfully, sensing something approach that she could not name.'>fearfully</g>. What was it? She did not know; it was too <g word='subtle' ph='/ˈsʌtəl/' type='adjective' def='so delicate or precise as to be difficult to analyse or describe' ex='The feeling was too subtle and elusive to name.'>subtle</g> and elusive to name. But she felt it, creeping out of the sky, reaching toward her through the sounds, the scents, the colour that filled the air. Now her bosom rose and fell tumultuously. She was beginning to recognise this thing that was approaching to possess her, and she was struggling to beat it back with her will — as powerless as her two white slender hands would have been."], "glossary": [{"word": "broken", "ph": "/ˈbrəʊkən/", "type": "adjective", "def": "Interrupted or incomplete; here describing hesitant, incomplete speech.", "ex": "She spoke in broken sentences, unable to find the right words."}, {"word": "concealing", "ph": "/kənˈsiːlɪŋ/", "type": "verb", "def": "Hiding something from view or knowledge.", "ex": "She kept concealing the worst of the truth as long as possible."}, {"word": "abandonment", "ph": "/əˈbændənmənt/", "type": "noun", "def": "A complete, unrestrained giving way to one's emotions.", "ex": "She wept with a wild abandonment in her sister's arms."}, {"word": "roomy", "ph": "/ˈruːmi/", "type": "adjective", "def": "Having plenty of space; spacious.", "ex": "The roomy armchair seemed to invite her into its deep cushions."}, {"word": "pressed", "ph": "/prest/", "type": "verb", "def": "Pushed firmly against; here, overwhelmed by exhaustion.", "ex": "She felt pressed down by an exhaustion that haunted her body."}, {"word": "aquiver", "ph": "/əˈkwɪvə/", "type": "adjective", "def": "Trembling or quivering, especially with life or emotion.", "ex": "The trees were all aquiver with the new spring life."}, {"word": "fearfully", "ph": "/ˈfɪəfəli/", "type": "adverb", "def": "In a way showing fear or anxiety.", "ex": "She waited fearfully, sensing something approach that she could not name."}, {"word": "subtle", "ph": "/ˈsʌtəl/", "type": "adjective", "def": "So delicate or precise that it is difficult to analyse or describe.", "ex": "The feeling was too subtle and elusive to put into words."}], "questions": [{"q": "How does Josephine break the news to Mrs Mallard, and why is this approach taken?", "keywords": ["weak heart", "gently", "broken sentences", "veiled hints", "half concealing"], "model": "Because Mrs Mallard has a weak heart, Josephine breaks the news very gently, using broken sentences and veiled hints rather than stating it directly, half concealing the truth as long as possible to protect her sister's health.", "frQ": "Comment Josephine annonce-t-elle la nouvelle à Mme Mallard, et pourquoi cette approche est-elle adoptée ?", "frModel": "Parce que Mme Mallard a un cœur fragile, Josephine annonce la nouvelle très doucement, utilisant des phrases hachées et des allusions voilées plutôt que de l'énoncer directement, dissimulant à moitié la vérité aussi longtemps que possible pour protéger la santé de sa sœur."}, {"q": "How does Mrs Mallard's immediate reaction to the news compare to a more typical reaction described in the text?", "keywords": ["wept at once", "wild abandonment", "paralyzed inability", "accept significance", "sister's arms"], "model": "Unlike many women who might sit paralyzed, unable to accept the news, Mrs Mallard weeps immediately with wild, unrestrained abandonment in her sister's arms — an intense, immediate emotional release rather than denial or shock.", "frQ": "Comment la réaction immédiate de Mme Mallard à la nouvelle se compare-t-elle à une réaction plus typique décrite dans le texte ?", "frModel": "Contrairement à beaucoup de femmes qui pourraient rester paralysées, incapables d'accepter la nouvelle, Mme Mallard pleure immédiatement avec un abandon sauvage et sans retenue dans les bras de sa sœur — une libération émotionnelle intense et immédiate plutôt que le déni ou le choc."}, {"q": "Analyse the description of the trees and Mrs Mallard's physical sensations in her room. What might this 'something' she senses approaching represent?", "keywords": ["aquiver", "spring life", "subtle elusive", "creeping", "struggling to beat it back", "powerless"], "model": "The trees being aquiver with new spring life, combined with the unnamed 'something' approaching that she tries to resist, strongly suggests a feeling of liberation or new possibility emerging from her grief — though she does not yet recognise or want to name it. The spring imagery and her physical struggle to suppress the feeling hint that this sensation may be t (adapted) — Virginia Woolf, Mrs Dalloway (1925). Public domain.", "readTime": "8 min", "words": 440, "preview": "On a June morning in London, Clarissa Dalloway walked out to buy flowers for her evening party. As she moved through the city streets, her thoughts drifted continuously between the present moment, distant memories, and the lives of strangers passing by — a single ordinary morning containing within it an entire lifetime of feeling.", "paragraphs": ["Mrs Dalloway said she would buy the flowers herself. For Lucy had her work cut out for her. The doors would be taken off their hinges; Rumpelmayer's men were coming. And then, thought Clarissa Dalloway, what a <g word='morning' ph='/ˈmɔːnɪŋ/' type='noun' def='the early part of the day, before noon' ex='What a morning — fresh as if issued to children on a beach.'>morning</g> — fresh as if issued to children on a beach.", "What a <g word='lark' ph='/lɑːk/' type='noun' def='a small bird known for its song; here used figuratively for a feeling of joyful exhilaration' ex='What a lark! What a plunge! For so it had always seemed to her.'>lark</g>! What a <g word='plunge' ph='/plʌndʒ/' type='noun' def='a sudden and dramatic jump or fall; here, a sudden full immersion in life' ex='Stepping out into Bond Street felt like a plunge into living again.'>plunge</g>! For so it had always seemed to her, when, with a <g word='little' ph='/ˈlɪtəl/' type='adjective' def='small in size, amount or degree' ex='With a little squeak of the hinges, she had burst open the French windows.'>little</g> squeak of the hinges, which she could hear now, she had burst open the French windows and plunged at Bourton into the open air.", "How fresh, how calm, <g word='stiller' ph='/ˈstɪlə/' type='adjective (comparative)' def='more motionless or quiet; the comparative form of still' ex='The air felt stiller than this, on the early morning, like the flap of a wave.'>stiller</g> than this of course, the air was in the early morning; like the flap of a wave; the kiss of a wave; <g word='chill' ph='/tʃɪl/' type='adjective' def='unpleasantly cold' ex='Chill and sharp and yet (for a girl of eighteen as she then was) solemn.'>chill</g> and sharp and yet (for a girl of eighteen as she then was) <g word='solemn' ph='/ˈsɒləm/' type='adjective' def='formal and dignified; deeply serious' ex='Solemn, feeling as she did, standing there at the open window.'>solemn</g>, feeling as she did, standing there at the open window, that something awful was about to happen.", "For Heaven only knows why one loves it so, how one sees it so, <g word='making' ph='/ˈmeɪkɪŋ/' type='verb' def='creating or forming something through one's own thoughts or imagination' ex='Making it up, building it round one, tumbling it, creating it every moment afresh.'>making</g> it up, building it round one, tumbling it, creating it every moment afresh; but the veriest <g word='frumps' ph='/frʌmps/' type='noun' def='old-fashioned, dowdy or unfashionable women; here used self-deprecatingly' ex='Even the veriest frumps, sitting on doorsteps, can feel it too.'>frumps</g>, the most dejected of miseries sitting on doorsteps (drink their downfall) do the same; can't be dealt with, she felt positive, by Acts of Parliament for that very reason: they love life. In people's eyes, in the swing, tramp, and trudge; in the bellow and the <g word='uproar' ph='/ˈʌprɔː/' type='noun' def='a loud and confused noise, especially when caused by people' ex='She loved the uproar of the city itself, the bellow of buses.'>uproar</g>; the carriages, motor cars, omnibuses, vans, sandwich men shuffling and swinging; brass bands; barrel organs; in the triumph and the jingle and the strange high singing of some aeroplane overhead was what she loved; life; London; this moment of June."], "glossary": [{"word": "morning", "ph": "/ˈmɔːnɪŋ/", "type": "noun", "def": "The early part of the day, before noon.", "ex": "What a morning — fresh as if issued to children on a beach."}, {"word": "lark" am of consciousness.", "frQ": "Comment Woolf mélange-t-elle le moment présent avec le souvenir dans ce passage d'ouverture ? Donnez un exemple spécifique.", "frModel": "Woolf fusionne harmonieusement l'action présente de Clarissa (ouvrir ses portes londoniennes pour aller acheter des fleurs) avec un souvenir vivant de sa jeunesse à Bourton, où le même grincement de charnières de porte déclenche un souvenir d'avoir ouvert les fenêtres françaises sur l'air matinal."}, {"q": "What does the phrase 'something awful was about to happen' suggest about Clarissa's state of mind as a young woman, and how does this contrast with the joy described elsewhere in the passage?", "keywords": ["solemn", "chill", "sharp", "eighteen", "awful", "standing there", "open window"], "model": "The phrase suggests an underlying sense of foreboding or existential anxiety beneath the surface excitement of youth — even amid the freshness and joy of the morning, there is a solemn, almost ominous undertone. This contrast between exhilaration and dread runs throughout the passage and reflects Woolf's interest in how intense joy and existential unease can coexist in a single moment.", "frQ": "Que suggère la phrase « quelque chose d'affreux allait se produire » sur l'état d'esprit de Clarissa en tant que jeune femme, et comment cela contraste-t-il avec la joie décrite ailleurs dans le passage ?", "frModel": "La phrase suggère un sentiment sous-jacent de pressentiment ou d'anxiété existentielle sous l'excitation de surface de la jeunesse — même au milieu de la fraîcheur et de la joie du matin, il y a une tonalité solennelle, presque sinistre."}, {"q": "Analyse the final paragraph. How does Woolf create a sense of London's vitality through her choice of sounds and images, and what does this passage reveal about Clarissa's relationship to life itself?", "keywords": ["uproar", "bellow", "tramp", "triumph", "jingle", "life London", "this moment of June", "love"], "model": "Woolf creates an overwhelming sen   saveDys();

function syllabify(word) {
  // Simple English syllable heuristic
  word = word.replace(/[^a-zA-Z]/g, function(m){ return '<span class="syl-punct">' + m + '</span>'; });
  // Split on vowel-consonant-vowel boundaries
  var syls = [];
  var vowels = 'aeiouyAEIOUY';
  var clean = word.replace(/<[^>]+>/g,'');
  var result = [];
  var i = 0;
  while (i < clean.length) {
    var start = i;
    // advance to end of consonant cluster
    while (i < clean.length && vowels.indexOf(clean[i]) < 0) i++;
    // advance through vowel cluster
    while (i < clean.length && vowels.indexOf(clean[i]) >= 0) i++;
    // one more consonant if available and not at end
    if (i < clean.length - 1 && vowels.indexOf(clean[i]) < 0) i++;
    result.push(clean.slice(start, i));
  }
  if (result.length <= 1) return clean;
  return result.map(function(s, idx){
    return '<span class="' + (idx % 2 === 0 ? 'syl-a' : 'syl-b') + '">' + s + '</span>';
  }).join('');
}

function applySyllabation(container) {
  var walker = document.createTreeWalker(container, 4, null, false);
  var nodes = [];
  var node;
  while ((node = walker.nextNode())) nodes.push(node);
  nodes.forEach(function(n) {
    if (n.parentNode && n.parentNode.className && n.parentNode.className.indexOf('gloss') >= 0) return;
    var words = n.textContent.split(/(\s+)/);
    var html = words.map(function(w) {
      if (/^\s+$/.test(w)) return w;
      if (w.length < 3) return w;
      return syllabify(w);
    }).join('');
    if (html !== n.textContent) {
      var span = document.createElement('span');
      span.innerHTML = html;
      n.parentNode.replaceChild(span, n);
    }
  });
}

function removeSyllabation(container) {
  container.querySelectorAll('.syl-a,.syl-b').forEach(function(el) {
    var parent = el.parentNode;
    parent.replaceChild(document.createTextNode(el.textContent), el);
    parent.normalize();
  });
}

function saveDys() {
  try {
    localStorage.setItem('mmr-dys', JSON.stringify(dysState));
    localStorage.setItem('mmr-fsidx', fontSizeIdx);

}

function loadDys() {
  try {
    var saved = localStorage.getItem('mmr-dys');
    var savedIdx = localStorage.getItem('mmr-fsidx');
    if (saved) {
      dysState = JSON.parse(saved);
      if (dysState.font) { document.body.classList.add('dys'); document.getElementById('btnDysFont').classList.add('on'); }
      if (dysState.spacing) { document.body.classList.add('dys-spacing'); document.getElementById('btnDysSpace').classList.add('on'); }
      if (dysState.ruler) toggleRuler();
      if (dysState.mask) toggleMask();
      if (savedIdx) {
        fontSizeIdx = parseInt(savedIdx);
        dysState.fontSize = fontSizes[fontSizeIdx];
        document.documentElement.style.setProperty('--r-size', (dysState.fontSize/100) + 'rem');
        document.getElementById('fsVal').textContent = dysState.fontSize + '%';
      }
      if (dysState.bg && dysState.bg !== '#FDFCF9') {
        var sw = document.querySelector('.bg-sw[data-bg="' + dysState.bg + '"]');
        if (sw) setBg(sw, dysState.bg);
      }
    }
  } catch(e) {}
}

function loadText(text) {
  currentText = text;
  activeGlossWord = null;
  currentStrategy = null;

  var badge = document.getElementById('headerLevel');
  badge.textContent = text.level;
  badge.className = 'level-badge ' + text.levelClass;

  // Build paragraphs
  var paragraphsHTML = '';
  for (var pi = 0; pi < text.paragraphs.length; pi++) {
    var p = text.paragraphs[pi];
    var html = p.replace(/<g word=['"]([^'"]+)['"]\s+ph=['"]([^'"]+)['"]\s+type=['"]([^'"]+)['"]\s+def=['"]([^'"]+)['"]\s+ex=['"]([^'"]+)['"]>(.*?)<\/g>/g,
      function(_, word, ph, type, def, ex, display) {
        return '<span class="gloss-word" data-word="' + word + '" onclick="showGloss(\'' + word.replace(/'/g, "\\'") + '\')">' + display + '</span>';
      });
    paragraphsHTML += '<p>' + html + '</p>';
  }

  // Glossary entries + pills
  var pillsHTML = '';
  var entriesHTML = '';
  for (var gi = 0; gi < text.glossary.length; gi++) {
    var g = text.glossary[gi];

      + '<div class="gloss-img-wrap" id="' + imgWrapId + '"></div>'
      + '<div class="gloss-word-title">' + g.word + '</div>'
      + '<div class="gloss-phonetic">' + g.ph + '</div>'
      + '<div class="gloss-type">' + g.type + '</div>'
      + '<div class="gloss-def">' + g.def + '</div>'
      + '<div class="gloss-example">\u201c' + g.ex + '\u201d</div>'
      + '</div>';
  }

  // Strategy buttons
  var stratBtnsHTML = '';
  for (var si = 0; si < STRATEGIES.length; si++) {
    var s = STRATEGIES[si];
    stratBtnsHTML += '<button class="strat-btn" data-sid="' + s.id + '" onclick="selectStrategy(\'' + s.id + '\')">'
      + s.ico + ' ' + s.name + '</button>';
  }

  layout.innerHTML = '<div class="reader-panel">'
    + '<div class="text-header">'
    + '<div class="text-eyebrow">' + text.eyebrow + '</div>'
    + '<div class="text-title">' + text.title + '</div>'
    + (text.isOriginal ? '<div class="text-orig-badge">&#128218; Texte original / domaine public</div>' : '')
    + '<div class="text-meta"><span>&#128240; ' + text.source + '</span><span>&#9201; ' + text.readTime + '</span><span>&#128221; ' + text.words + ' mots</span></div>'
    + '</div>'
    + '<div class="article-body" id="articleBody">' + paragraphsHTML + '</div>'
    + '<div class="strat-section">'
    + '<div class="strat-header">'
    + '<div class="strat-header-label">Choisis une strat&#233;gie de lecture</div>'
    + '<div class="strat-btns">' + stratBtnsHTML + '</div>'
    + '</div>'
    + '<div class="strat-body" id="stratBody"></div>'
    + '</div></div>'
    + '<div class="gloss-sidebar">'
    + '<div class="gloss-panel">'
    + '<div class="gloss-ph"><span>&#128269;</span><span class="gloss-ph-title">Glossaire</span></div>'
    + '<div class="gloss-empty" id="glossEmpty">Tape sur un mot <span style="border-bottom:2px solid var(--amber);padding:0 2px">soulign&#233;</span> pour voir sa d&#233;finition.</div>'
    + entriesHTML + '</div>'
    + '<div class="gloss-list-section">'
    + '<div class="gloss-list-header">Vocabulaire cl&#233;</div>'
    + '<div class="gloss-list">' + pillsHTML + '</div>'
    + '</div></div>';

    if (ab) applySyllabation(ab);
  }
}

   STRATEGY SELECTION & FEEDBACK
════════════════════════════════════════════════════════ */
function selectStrategy(sid) {
  currentStrategy = sid;
  var s = null;
  for (var i = 0; i < STRATEGIES.length; i++) {
    if (STRATEGIES[i].id === sid) { s = STRATEGIES[i]; break; }
  }
  if (!s) return;

  document.querySelectorAll('.strat-btn').forEach(function(b){
    b.classList.remove('active');
    b.style.background = '';
    b.style.color = '';
    b.style.borderColor = '';
  });
  var ab = document.querySelector('.strat-btn[data-sid="' + sid + '"]');
  if (ab) { ab.classList.add('active'); ab.style.background = s.color; ab.style.color = '#fff'; ab.style.borderColor = s.color; }

  var tipsHTML = '<ul>';
  for (var ti = 0; ti < s.tips.length; ti++) tipsHTML += '<li>' + s.tips[ti] + '</li>';
  tipsHTML += '</ul>';

  var body = document.getElementById('stratBody');
  body.innerHTML = '<div class="strat-badge" style="background:' + s.bg + ';color:' + s.color + '">' + s.ico + ' ' + s.name + '</div>'
    + '<div class="strat-what">' + s.what + '</div>'
    + '<div class="strat-task">' + s.task + '</div>'
    + '<textarea class="strat-input" id="stratInput" placeholder="&#201;cris ta r&#233;ponse ici&#8230;" oninput="onStratInput()"></textarea>'
    + '<div class="strat-footer">'
    + '<span class="strat-wc" id="stratWc">0 mot</span>'
    + '<button class="strat-submit" id="stratSubmit" onclick="submitStrategy()" disabled style="background:' + s.color + '">Voir le feedback &#10022;</button>'
    + '</div>'
    + '<div class="strat-feedback" id="stratFeedback"></div>'
    + '<button class="strat-sol-btn" id="stratSolBtn" onclick="showSolution()" style="display:none;border-color:' + s.color + ';color:' + s.color + '">&#128065; Voir la solution</button>'
    + '<div class="strat-solution" id="stratSolution"></div>'
    + '<div class="strat-tips"><div class="strat-tips-title">&#128161; Conseils pour cette strat&#233;gie</div>' + tipsHTML + '</div>';

  body.classList.add('visible');
  if (window.innerWidth < 700) body.scrollIntoView({ behavior:'smooth', block:'start' });
}

function onStratInput() {
  var area = document.getElementById('stratInput');
  if (!area) return;
  var words = area.value.trim().split(/\s+/).filter(function(w){ return w.length > 0; });
  var n = words.length;
  var wc = document.getElementById('stratWc');
  if (wc) wc.textContent = n + ' mot' + (n > 1 ? 's' : '');
  var btn = document.getElementById('stratSubmit');
  if (btn) btn.disabled = n < 5;
}

function submitStrategy() {
  var input = document.getElementById('stratInput');
  if (!input || !currentStrategy || !currentText) return;
  var answer = input.value.trim();
  if (!answer) return;

  var s = null;
  for (var i = 0; i < STRATEGIES.length; i++) {
    if (STRATEGIES[i].id === currentStrategy) { s = STRATEGIES[i]; break; }
  }
  if (!s) return;

  // Get text-specific strategy data
  var stratData = currentText.strategies ? currentText.strategies[currentStrategy] : null;
  var feedback = stratData ? stratData.feedback : '';
  var pistes = stratData ? stratData.pistes : [];

  // Generic fallback by word count
  if (!feedback) {
    var wc = answer.split(/\s+/).filter(function(w){ return w.length > 0; }).length;
    var fb = s.feedbacks || {};
    feedback = wc < 25 ? (fb.short || '') : wc < 65 ? (fb.medium || '') : (fb.long || '');
  }

  var pistesHTML = '';
  if (pistes.length) {
    pistesHTML = '<div class="strat-tips" style="margin-top:12px">'
      + '<div class="strat-tips-title">&#128161; Pistes de r\u00e9flexion pour ce texte</div><ul>';
    for (var pi = 0; pi < pistes.length; pi++) {
      pistesHTML += '<li>' + pistes[pi] + '</li>';
    }
    pistesHTML += '</ul></div>';
  }

  var btn = document.getElementById('stratSubmit');
  if (btn) btn.style.display = 'none';

  var fbEl = document.getElementById('stratFeedback');
  fbEl.style.background = s.bg;
  fbEl.style.border = '1.5px solid ' + s.color;
  fbEl.innerHTML = '<div class="strat-fb-header" style="color:' + s.color + ';border-bottom:1px solid ' + s.color + '44">'
    + s.ico + ' Feedback &mdash; ' + s.name + '</div>'
    + '<div class="strat-fb-body"><p>' + feedback + '</p>' + pistesHTML + '</div>';
  fbEl.classList.add('visible');
  fbEl.scrollIntoView({ behavior:'smooth', block:'nearest' });

  // Show "Voir la solution" button
  var solBtn = document.getElementById('stratSolBtn');
  if (solBtn) solBtn.style.display = 'inline-flex';
}

function showGloss(word) {
  var key = word.replace(/[\s']/g, '_');
  var empty = document.getElementById('glossEmpty');
  if (empty) empty.style.display = 'none';
  document.querySelectorAll('.gloss-entry').forEach(function(e){ e.classList.remove('visible'); });
  document.querySelectorAll('.gloss-word').forEach(function(e){ e.classList.remove('active'); });
  document.querySelectorAll('.gloss-pill').forEach(function(p){ p.classList.remove('active'); });
  var entry = document.getElementById('ge_' + key);
  if (entry) entry.classList.add('visible');
  document.querySelectorAll('.gloss-word[data-word="' + word + '"]').forEach(function(e){ e.classList.add('active'); });
  document.querySelectorAll('.gloss-pill').forEach(function(p){
    if (p.textContent.trim() === word) p.classList.add('active');
  });
  activeGlossWord = word;
  var sidebar = document.querySelector('.gloss-sidebar');
  if (sidebar && window.innerWidth < 700) sidebar.scrollIntoView({ behavior:'smooth', block:'start' });
  // Load image for this word
  loadGlossImage(word);
}

  var el = document.getElementById('viewLevel');
  el.innerHTML = '';
  ['A2','B1','B2'].forEach(function(lv) {
    var cfg = LEVEL_CFG[lv];
    var txts = TEXTS.filter(function(t){ return t.level === lv; });

    var sec = document.createElement('div');
    sec.className = 'level-section';
    var gid = 'lvg' + lv;

      + '<span class="lvl-desc">' + cfg.desc + ' &mdash; ' + txts.length + ' texte' + (txts.length > 1 ? 's' : '') + '</span></div>'
      + '<div class="text-grid" id="' + gid + '"></div>';
    el.appendChild(sec);
    var grid = document.getElementById(gid);
    txts.forEach(function(t){ grid.appendChild(makeCard(t, false)); });
  });

function buildGenreView() {
  var el = document.getElementById('viewGenre');
  el.innerHTML = '';
  var byGenre = {};
  TEXTS.forEach(function(t){ if (!byGenre[t.eyebrow]) byGenre[t.eyebrow]=[]; byGenre[t.eyebrow].push(t); });
  var order = Object.keys(GENRE_CFG).filter(function(k){ return byGenre[k]; });
  Object.keys(byGenre).forEach(function(k){ if (order.indexOf(k)<0) order.push(k); });

  // Filter row
  var row = document.createElement('div');
  row.className = 'genre-filter-row';
  var allBtn = document.createElement('button');
  allBtn.className = 'genre-btn active';

  allBtn.style.background = '#1E40AF'; allBtn.style.color = '#fff'; allBtn.style.borderColor = '#1E40AF';
  allBtn.addEventListener('click', function(){ filterGenre('all', allBtn); });
  row.appendChild(allBtn);
  order.forEach(function(gk) {
    var cfg = GENRE_CFG[gk] || { icon:'\uD83D\uDCDA', color:'#374151', bg:'#F3F4F6' };
    var btn = document.createElement('button');
    btn.className = 'genre-btn';
    btn.dataset.genre = gk;
    btn.innerHTML = cfg.icon + ' ' + gk;
    btn.addEventListener('click', function(){ filterGenre(gk, btn); });

    var txts = byGenre[gk];

    var sec = document.createElement('div');

    var grid = document.getElementById(gid);

function filterGenre(genre, clickedBtn) {
  document.querySelectorAll('.genre-btn').forEach(function(b){
    b.classList.remove('active'); b.style.background=''; b.style.color=''; b.style.borderColor='';
  });
  clickedBtn.classList.add('active');
  if (genre === 'all') {
    clickedBtn.style.background='#1E40AF'; clickedBtn.style.color='#fff'; clickedBtn.style.borderColor='#1E40AF';
  } else {
    var cfg = GENRE_CFG[genre] || { color:'#374151' };
    clickedBtn.style.background=cfg.color; clickedBtn.style.color='#fff'; clickedBtn.style.borderColor=cfg.color;
  }
  document.querySelectorAll('.genre-section').forEach(function(sec){
    if (genre==='all'||sec.dataset.genre===genre) sec.classList.remove('hidden');
    else sec.classList.add('hidden');
  });
}

function makeCard(t, showLv) {
  var card = document.createElement('div');
  card.className = 'book-card';
  var cfg = GENRE_CFG[t.eyebrow] || {};
  var lvH = showLv ? '<span class="bc-lv ' + t.levelClass + '">' + t.level + '</span>' : '';
  var gnH = !showLv ? '<div class="bc-genre">' + (cfg.icon||'') + ' ' + t.eyebrow + '</div>' : '';
  var origBadge = t.isOriginal ? '<span class="bc-orig-badge">&#128218; Original</span>' : '';
  card.innerHTML = '<div class="bc-row"><div class="bc-title">' + t.title + '</div>' + lvH + origBadge + '</div>'
    + gnH
    + '<div class="bc-preview">' + t.preview + '</div>'
    + '<div class="bc-foot"><span class="bc-meta">&#9201; ' + t.readTime + '</span><span class="bc-meta">' + t.words + ' mots</span></div>';
  card.addEventListener('click', function(){ openText(t); });

  document.getElementById('backBtn').style.display = '';
  loadText(t);
  window.scrollTo(0,0);
}


/* ── GLOSSARY IMAGE LOADER ── */
var ABSTRACT_TYPES = ['adjective','adverb','phrase','conjunction','pronoun','modal verb','ordinal number'];
var ABSTRACT_WORDS = ["consciousness","irony","integrity","ethics","virtue","wisdom","courage","justice","emotion","thought","feeling","idea","concept","principle","however","although","therefore","moreover","nevertheless","paradox","identity","meaning","truth","freedom","metaphor","provisional","approval","betrayal","loneliness","grief","anxiety","desperation","improvise","reckless","infuriating","tedious","inevitable","simultaneously","coherent","arbitrarily","sophisticated","accumulate","compensation","obligation","validity","threshold","autonomy"];

function isAbstract(word, type) {
  var w = word.toLowerCase();
  if (ABSTRACT_WORDS.indexOf(w) >= 0) return true;
  var t = (type || '').toLowerCase().split(/[\s\/,]/)[0];
  return ABSTRACT_TYPES.indexOf(t) >= 0;
}

function loadGlossImage(word) {
  var key = word.replace(/[\s']/g, '_');
  var entry = document.getElementById('ge_' + key);
  if (!entry) return;

  var wrapId = 'gimg_ge_' + key;
  var wrap = document.getElementById(wrapId);
  if (!wrap) return;

  if (wrap.dataset.tried === '1') return; // already attempted once
  wrap.dataset.tried = '1';

  var wordType = entry.dataset.type || '';
  if (isAbstract(word, wordType)) return;

  wrap.classList.add('loaded');
  wrap.innerHTML = '<div class="gloss-img-placeholder">&#8987; Recherche d\u2019image\u2026</div>';

  var cleanWord = word.replace(/[^a-zA-Z\s-]/g, '').trim();
  var searchUrl = 'https://en.wikipedia.org/w/api.php?origin=*&action=query&prop=pageimages%7Cpageterms&piprop=thumbnail&pithumbsize=240&titles='
    + encodeURIComponent(cleanWord) + '&format=json';

  fetch(searchUrl)
    .then(function(r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    })
    .then(function(data) {
      var pages = (data && data.query && data.query.pages) ? data.query.pages : {};
      var keys = Object.keys(pages);
      var found = false;
      for (var i = 0; i < keys.length; i++) {
        var page = pages[keys[i]];
        if (page && page.thumbnail && page.thumbnail.source) {
          var img = document.createElement('img');
          img.alt = word;
          img.loading = 'lazy';
          img.onerror = function() { wrap.classList.remove('loaded'); wrap.innerHTML = ''; };
          img.src = page.thumbnail.source;
          wrap.innerHTML = '';
          wrap.appendChild(img);
          found = true;
          break;
        }
      }
      if (!found) {
        wrap.classList.remove('loaded');
        wrap.innerHTML = '';
      }
    })
    .catch(function(err) {
      wrap.classList.remove('loaded');
      wrap.innerHTML = '';
    });
}

function showSolution() {
  if (!currentText || !currentStrategy) return;
  var s = null;
  for (var i = 0; i < STRATEGIES.length; i++) {
    if (STRATEGIES[i].id === currentStrategy) { s = STRATEGIES[i]; break; }
  }
  var qs = currentText.questions || [];
  if (!qs.length) return;

  var solEl = document.getElementById('stratSolution');
  var solBtn = document.getElementById('stratSolBtn');
  if (!solEl) return;

  var html = '<div class="strat-sol-header">&#128218; Solutions &mdash; Réponses modèles</div>';
  for (var i = 0; i < qs.length; i++) {
    var frQ = qs[i].frQ || qs[i].q;
    var frModel = qs[i].frModel || qs[i].model;
    html += '<div class="strat-sol-q">'
      + '<div class="strat-sol-qnum">Question ' + (i+1) + '</div>'
      + '<div class="strat-sol-qtext">' + frQ + '</div>'
      + '<div class="strat-sol-ans">' + frModel + '</div></div>';
  }

  solEl.innerHTML = html;
  solEl.classList.add('visible');
  if (solBtn) solBtn.style.display = 'none';
  solEl.scrollIntoView({ behavior:'smooth', block:'start' });
}

function goHome() {
  document.getElementById('homeScreen').style.display = 'flex';
  document.getElementById('readerScreen').style.display = 'none';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('headerLevel').style.display = 'none';
  window.scrollTo(0,0);
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

window.addEventListener('load', function() {
  loadDys();
  buildLevelView();
  buildGenreView();
});
