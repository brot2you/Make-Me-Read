 phone?</em>", "pistes": ["Une piste : « The author uses the image of Nina reaching for her phone and her hand closing on air. The word excruciating signals how physically painful the... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot ou la dernière image du texte : c’est souvent le choix le plus délibéré."]}}}, {"id": 300, "title": "A Study in Scarlet — The First Meeting", "eyebrow": "Crime & Detective", "level": "A2", "levelClass": "a2", "source": "Original extract — Arthur Conan Doyle, A Study in Scarlet (1887). Public domain.", "readTime": "4 min", "words": 280, "preview": "Dr Watson had just returned from Afghanistan. He needed a room to rent. A friend told him about a man called Sherlock Holmes, who was also looking for someone to share a flat...", "paragraphs": ["I had returned to London after being <g word='wounded' ph='/ˈwuːndɪd/' type='verb (past)' def='hurt by a weapon in a war or fight' ex='He was wounded in the battle and sent home.'>wounded</g> in the <g word='campaign' ph='/ˈkæmpeɪn/' type='noun' def='a series of military operations' ex='The Afghan campaign lasted many years.'>campaign</g> in Afghanistan. I had no place to live and very little money. A friend of mine, Stamford, told me he knew a man who was looking for someone to share <g word='lodgings' ph='/ˈlɒdʒɪŋz/' type='noun (plural)' def='a rented room or rooms in someone else’s home' ex='She found cheap lodgings near the hospital.'>lodgings</g> with. The man’s name was Sherlock Holmes.", "‘Be careful with Holmes,’ said Stamford, as we walked to the laboratory where Holmes was working. ‘He is a little <g word='eccentric' ph='/ˈeksəntrɪk/' type='adjective' def='unusual in behaviour; different from most people' ex='She had eccentric habits that her colleagues found amusing.'>eccentric</g>, I must <g word='admit' ph='/ədˈmɪt/' type='verb' def='to agree that something is true, often something difficult' ex='I must admit that I was wrong.'>admit</g>. He has a great passion for definite and exact knowledge. But he means well.’", "I found Holmes in a large room, <g word='bending' ph='/ˈbendɪŋ/' type='verb' def='leaning the body forward and downward' ex='She was bending over the desk, writing.'>bending</g> over a table covered with test tubes and equipment. He looked up when he heard us enter. ‘I’ve found it!’ he cried, running towards us with a test tube in his hand. ‘I have found a <g word='reagent' ph='/ˈriːədʒənt/' type='noun' def='a substance used in a chemical reaction' ex='The reagent turned blue when it touched the blood.'>reagent</g> which is <g word='precipitated' ph='/ˈprɪsɪpɪteɪtɪd/' type='verb' def='caused to fall out of a solution as a solid' ex='The substance precipitated when the acid was added.'>precipitated</g> by haemoglobin and by nothing else.’", "He shook my hand warmly. ‘You have been in Afghanistan, I <g word='perceive' ph='/ˈpəsiːv/' type='verb' def='to notice or understand something through observation' ex='From his boots, she perceived that he had been walking in mud.'>perceive</g>,’ he said simply. I was so <g word='astonished' ph='/əˈstɒnɪʃt/' type='adjective' def='very surprised' ex='I was astonished by his accuracy.'>astonished</g> that I could say nothing. How did he know?"], "glossary": [{"word": "wounded", "ph": "/ˈwuːndɪd/", "type": "verb", "def": "Hurt or injured by a weapon.", "ex": "He was wounded in the battle and sent home."}, {"word": "campaign", "ph": "/ˈkæmpeɪn/", "type": "noun", "def": "A series of military operations in a specific area.", "ex": "The Afghan campaign lasted many years."}, {"word": "lodgings", "ph": "/ˈlɒdʒɪŋz/", "type": "noun", "def": "A rented room or rooms in someone else’s home.", "ex": "She found cheap lodgings near the hospital."}, {"word": "eccentric", "ph": "/ˈeksəntrɪk/", "type": "adjective", "def": "Unusual in behaviour; different from what is considered normal.", "ex": "She had eccentric habits that her colleagues found amusing."}, {"word": "reagent", "ph": "/ˈriːədʒənt/", "type": "noun", "def": "A substance used in a chemical test or reaction.", "ex": "The reagent turned blue when it detected blood."}, {"word": "perceive", "ph": "/ˈpəsiːv/", "type": "verb", "def": "To notice or understand something through careful observation.", "ex": "From his boots, she perceived that he had been walking in mud."}, {"word": "astonished", "ph": "/əˈstɒnɪʃt/", "type": "adjective", "def": "Extremely surprised; unable to believe what one sees or hears.", "ex": "I was astonished by the accuracy of his deduction."}], "questions": [{"q": "Why is Watson in London, and what is his problem?", "keywords": ["wounded", "Afghanistan", "campaign", "money", "lodgings", "share"], "model": "Watson has returned from the military campaign in Afghanistan after being wounded. He has very little money and needs somewhere to live, so a friend introduces him to Holmes who is also looking for someone to share lodgings with.", "frQ": "Pourquoi Watson est-il à Londres, et quel est son problème ?", "frModel": "Watson est revenu de la campagne militaire en Afghanistan après avoir été blessé. Il a très peu d’argent et a besoin d’un endroit où vivre, alors un ami le présente à Holmes qui cherche aussi quelqu’un pour partager un logement."}, {"q": "What does Stamford warn Watson about Holmes?", "keywords": ["eccentric", "admit", "passion", "knowledge", "exact", "definite", "careful"], "model": "Stamford warns Watson that Holmes is a little eccentric and unusual, but means well. He has a great passion for definite and exact knowledge, which makes him different from most people.", "frQ": "Que Stamford met-il en garde Watson à propos de Holmes ?", "frModel": "Stamford met en garde Watson que Holmes est un peu excentrique et inhabituel, mais bien intentionné. Il a une grande passion pour la connaissance définie et exacte, ce qui le rend différent de la plupart des gens."}, {"q": "What does Holmes’ famous first deduction reveal about his method?", "keywords": ["Afghanistan", "perceive", "astonished", "boots", "observation", "know"], "model": "Holmes immediately tells Watson he has been in Afghanistan — without being told. This reveals that Holmes observes details others miss (like Watson’s military posture and tan) and reasons from them to exact conclusions. Watson’s astonishment shows the reader how extraordinary this ability is.", "frQ": "Que révèle la première déduction de Holmes sur sa méthode ?", "frModel": "Holmes dit immédiatement à Watson qu’il a été en Afghanistan — sans avoir été informé. Cela révèle que Holmes observe des détails que les autres manquent (comme la posture militaire et le bronzage de Watson) et en tire des conclusions précises. L’étonnement de Watson montre au lecteur à quel point cette capacité est extraordinaire."}], "writingPrompt": "You are Watson. Write a short letter to a friend back home (60–80 words) describing your first meeting with Holmes. What surprised you most? Use at least 2 words from the glossary.", "writingHints": ["Dear friend, I met the most extraordinary man today...", "He took one look at me and said...", "I was astonished when..."], "writingKeywords": ["eccentric", "perceive", "astonished", "lodgings", "wounded"], "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>Why is Watson in London, and what is his problem?</em>", "pistes": ["Indice du premier paragraphe : « I had returned to London after being wounded in the campaign in Afghanistan. I had no place to... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « Watson has returned from the military campaign in Afghanistan after being wounded. He has very little money and needs somewhere to live,... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« wounded »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>What does Holmes’ famous first deduction reveal about his method?</em>", "pistes": ["Mots-clés à observer : Afghanistan, perceive, astonished, boots", "Piste : « Holmes immediately tells Watson he has been in Afghanistan — without being told. This reveals that Holmes observes details others... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« wounded »</strong>.", "pistes": ["Dans le texte : « ...ed to London after being wounded in the campaign in Afgha... »", "Définition réelle : Hurt or injured by a weapon.", "Exemple : « He was wounded in the battle and sent home. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « I had returned to London after being wounded in the... ». Dernier paragraphe : « He shook my hand warmly. ‘You have been in Afghanistan,... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>Why is Watson in London, and what is his problem?</em>", "pistes": ["Piste : « Watson has returned from the military campaign in Afghanistan after being wounded. He has very little money and needs somewhere to live,... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}, "isOriginal": true}, {"id": 301, "title": "The War of the Worlds — The Cylinder Opens", "eyebrow": "Science Fiction", "level": "B1", "levelClass": "b1", "source": "Original extract — H.G. Wells, The War of the Worlds (1898). Public domain.", "readTime": "5 min", "words": 360, "preview": "No one would have believed, in the last years of the nineteenth century, that human affairs were being watched from the timeless worlds of space. Yet across the gulf of space, intellects vast and cool and unsympathetic regarded our planet with envious eyes...", "paragraphs": ["No one would have believed, in the last years of the nineteenth century, that human affairs were being <g word='watched' ph='/wɒtʃt/' type='verb' def='observed carefully over a period of time' ex='The detective had been watching the house for days.'>watched</g> from the timeless worlds of space. No one could have dreamed that we were being <g word='scrutinised' ph='/ˈskruːtɪnaɪzd/' type='verb' def='examined very closely and carefully' ex='Our every move was scrutinised by the unseen observers.'>scrutinised</g> and studied, perhaps almost as narrowly as a man with a <g word='microscope' ph='/ˈmaɪkrəskəʊp/' type='noun' def='an instrument that makes very small things appear much larger' ex='Under the microscope, the cells were clearly visible.'>microscope</g> might <g word='scrutinise' ph='/ˈskruːtɪnaɪz/' type='verb' def='examine very closely' ex='A scientist scrutinises specimens under glass.'>scrutinise</g> the <g word='transient' ph='/ˈtrænziənt/' type='adjective' def='lasting only a short time; not permanent' ex='The mayfly’s transient life lasts only one day.'>transient</g> creatures that swarm and multiply in a drop of water.", "Yet across the gulf of space, minds that are to our minds as ours are to the beasts in the <g word='jungle' ph='/ˈdʒʌŋɡəl/' type='noun' def='a dense tropical forest' ex='Lions live in the savannah, not the jungle.'>jungle</g>, <g word='intellects' ph='/ˈintəlekts/' type='noun (plural)' def='powerful minds capable of advanced thought' ex='The greatest intellects of the age had failed to solve it.'>intellects</g> vast and cool and <g word='unsympathetic' ph='/ʌnsɪmpəˈθetɪk/' type='adjective' def='showing no pity or understanding' ex='The cold, unsympathetic stare of the alien made her shudder.'>unsympathetic</g>, regarded this Earth with <g word='envious' ph='/ˈenviəs/' type='adjective' def='wanting something that another has; jealous' ex='They regarded Earth’s rich atmosphere with envious eyes.'>envious</g> eyes and slowly and surely drew their plans against us.", "In the <g word='thirty-ninth' ph='/ˈˈθɜːti naɪnθ/' type='ordinal number' def='the number 39 in a series' ex='It was the thirty-ninth year of his reign.'>thirty-ninth</g> year of the twentieth century came the great <g word='disillusionment' ph='/ˌDɪsɪˈluːʒənmənt/' type='noun' def='the feeling of disappointment when something believed in is shown to be false' ex='The crash brought disillusionment to millions who had trusted the banks.'>disillusionment</g>. On the night of the twelfth of August came the first <g word='intimation' ph='/ˈIntɪˈmeɪʃən/' type='noun' def='a hint or sign of something about to happen' ex='The dark clouds were the first intimation of the coming storm.'>intimation</g> that all was not well in the world. A <g word='cylinder' ph='/ˈsɪlɪndə/' type='noun' def='a solid or hollow object with circular ends and straight sides' ex='The metal cylinder had fallen from the sky at tremendous speed.'>cylinder</g> had fallen on Horsell Common.", "The cylinder was still glowing from its passage through the air. People <g word='gathered' ph='/ˈɡæðəd/' type='verb' def='came together in a group' ex='A large crowd gathered around the mysterious object.'>gathered</g> around it in the early morning, at first keeping their distance. Then the end of the cylinder began to <g word='rotate' ph='/ˈrəʊteɪt/' type='verb' def='to turn in a circle around a central point' ex='The lid began to rotate slowly, as if being unscrewed from within.'>rotate</g>. Someone was unscrewing it from the inside."], "glossary": [{"word": "scrutinised", "ph": "/ˈskruːtɪnaɪzd/", "type": "verb", "def": "Observed and examined with extreme care and attention.", "ex": "Our every movement had been scrutinised for months."}, {"word": "microscope", "ph": "/ˈmaɪkrəskəʊp/", "type": "noun", "def": "An instrument that makes tiny things appear much larger.", "ex": "Under the microscope, the detail was extraordinary."}, {"word": "transient", "ph": "/ˈtrænziənt/", "type": "adjective", "def": "Lasting only a very short time; not permanent.", "ex": "Human lives seem transient compared to geological time."}, {"word": "intellects", "ph": "/ˈintəlekts/", "type": "noun", "def": "Powerful minds capable of complex, advanced thought.", "ex": "The greatest intellects of the century had gathered in Vienna."}, {"word": "unsympathetic", "ph": "/ʌnsɪmpəˈθetɪk/", "type": "adjective", "def": "Showing no pity, warmth or understanding.", "ex": "The cold, unsympathetic eyes of the invaders revealed nothing."}, {"word": "envious", "ph": "/ˈenviəs/", "type": "adjective", "def": "Wanting something another possesses; feeling jealous desire.", "ex": "They regarded Earth’s resources with envious eyes."}, {"word": "disillusionment", "ph": "/ˌDɪsɪˈluːʒənmənt/", "type": "noun", "def": "The feeling of disappointment when something believed in proves false.", "ex": "The discovery brought complete disillusionment."}, {"word": "cylinder", "ph": "/ˈsɪlɪndə/", "type": "noun", "def": "A solid or hollow object with circular ends and straight sides.", "ex": "The metal cylinder had fallen from the sky at great speed."}], "questions": [{"q": "What famous comparison does Wells make in the opening paragraph? What does it suggest about humanity’s position?", "keywords": ["microscope", "transient", "scrutinised", "watched", "drop of water", "beasts", "intellects"], "model": "Wells compares the Martians studying humans to a scientist scrutinising tiny creatures under a microscope. This suggests humanity, which considers itself superior, is in fact as small and transient as microscopic life — watched by minds far greater than ours.", "frQ": "Quelle est la célèbre comparaison de Wells dans le premier paragraphe ? Que suggère-t-elle sur la position de l’humanité ?", "frModel": "Wells compare les Martiens étudiant les humains à un scientifique scrutant de minuscules créatures au microscope. Cela suggère que l’humanité, qui se croit supérieure, est en fait aussi petite et éphémère que des êtres microscopiques — observée par des esprits bien plus grands que les nôtres."}, {"q": "How does Wells describe the Martian minds? Why is this description threatening?", "keywords": ["intellects", "vast", "cool", "unsympathetic", "envious", "plans", "slowly surely"], "model": "He describes them as having intellects vast, cool and unsympathetic — immensely powerful but without feeling or mercy. They are envious of Earth and have been slowly and surely planning an attack. The coldness is more threatening than anger: they are not hostile out of emotion, but out of calculated purpose.", "frQ": "Comment Wells décrit-il les esprits martiens ? Pourquoi cette description est-elle menaçante ?", "frModel": "Il les décrit comme ayant des intellects vastes, froids et sans empathie — immensément puissants mais sans sentiment ni pitié. Ils convoitent la Terre et ont lentement et sûrement planifié une attaque. Le froid est plus menaçant que la colère : ils ne sont pas hostiles par émotion, mais par dessein calculé."}, {"q": "How does Wells create tension in the final paragraph?", "keywords": ["cylinder", "rotate", "inside", "gathered", "unscrewing", "distance", "glowing"], "model": "Wells builds tension by slowing the narrative down: the crowd gathers, keeps its distance, and then the cylinder begins to rotate. The detail that someone is unscrewing it from the inside is the most chilling moment — the reader and the crowd realise simultaneously that something is alive inside.", "frQ": "Comment Wells crée-t-il de la tension dans le dernier paragraphe ?", "frModel": "Wells ralentit le récit : la foule se rassemble, garde ses distances, puis le cylindre commence à tourner. Le détail que quelqu’un le dévisse de l’intérieur est le moment le plus glaçant — le lecteur et la foule réalisent simultanément que quelque chose est vivant à l’intérieur."}], "writingPrompt": "Imagine you are a journalist in 1898 writing the first report of the cylinder landing. Write 80–100 words for your newspaper. Use at least 3 words from the glossary.", "writingHints": ["BREAKING NEWS — Mysterious object falls on Horsell Common...", "Witnesses report that the cylinder began to...", "Experts are unable to explain..."], "writingKeywords": ["cylinder", "scrutinised", "intellects", "unsympathetic", "envious", "transient"], "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>What famous comparison does Wells make in the opening paragraph? What does it suggest about humanity’s position?</em>", "pistes": ["Indice du premier paragraphe : « No one would have believed, in the last years of the nineteenth century, that human affairs were being... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « Wells compares the Martians studying humans to a scientist scrutinising tiny creatures under a microscope. This suggests humanity, which considers itself superior,... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« scrutinised »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>How does Wells create tension in the final paragraph?</em>", "pistes": ["Mots-clés à observer : cylinder, rotate, inside, gathered", "Piste : « Wells builds tension by slowing the narrative down: the crowd gathers, keeps its distance, and then the cylinder begins to... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« scrutinised »</strong>.", "pistes": ["Dans le texte : « ...eamed that we were being scrutinised and studied, perhaps alm... »", "Définition réelle : Observed and examined with extreme care and attention.", "Exemple : « Our every movement had been scrutinised for months. »"]}, "struct": {"feedback": "✅ Ce texte compte 4 paragraphes. Premier paragraphe : « No one would have believed, in the last years of... ». Dernier paragraphe : « The cylinder was still glowing from its passage through the... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>What famous comparison does Wells make in the opening paragraph? What does it suggest about humanity’s position?</em>", "pistes": ["Piste : « Wells compares the Martians studying humans to a scientist scrutinising tiny creatures under a microscope. This suggests humanity, which considers itself superior,... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}, "isOriginal": true}, {"id": 302, "title": "The Tell-Tale Heart", "eyebrow": "Horror & Suspense", "level": "B1", "levelClass": "b1", "source": "Original extract — Edgar Allan Poe, The Tell-Tale Heart (1843). Public domain.", "readTime": "5 min", "words": 320, "preview": "TRUE! — nervous — very, very dreadfully nervous I had been and am. But why WILL you say that I am mad? The disease had sharpened my senses — not destroyed — not dulled them...", "paragraphs": ["TRUE! — nervous — very, very dreadfully nervous I had been and am. But why will you say that I am mad? The disease had <g word='sharpened' ph='/ˈʃɑːpənd/' type='verb' def='made more acute or intense' ex='Fear sharpened her senses to an extraordinary degree.'>sharpened</g> my senses — not destroyed — not <g word='dulled' ph='/dʌld/' type='verb' def='made less sharp or sensitive' ex='Years of routine had dulled his ability to notice detail.'>dulled</g> them. Above all was the sense of hearing <g word='acute' ph='/əˈkjuːt/' type='adjective' def='(of senses) extremely sharp and sensitive' ex='Her hearing was so acute she could detect a whisper from across the room.'>acute</g>. I heard all things in the heaven and in the earth. I heard many things in hell. How then am I mad? Hearken! and observe how healthily — how calmly I can tell you the whole story.", "It is impossible to say how first the idea entered my brain; but once <g word='conceived' ph='/kənˈsiːvd/' type='verb' def='thought of or formed in the mind' ex='Once conceived, the plan could not be abandoned.'>conceived</g>, it <g word='haunted' ph='/ˈˈhɔːntɪd/' type='verb' def='troubled the mind repeatedly and persistently' ex='The memory haunted him for the rest of his life.'>haunted</g> me day and night. Object there was none. Passion there was none. I loved the old man. He had never wronged me. He had never given me insult. For his gold I had no desire. I think it was his eye! yes, it was this! One of his eyes resembled that of a <g word='vulture' ph='/ˈvʌltʃə/' type='noun' def='a large bird that feeds on dead animals; here used metaphorically' ex='The pale, unblinking eye resembled that of a vulture.'>vulture</g> — a pale blue eye, with a film over it. Whenever it fell upon me, my blood ran cold.", "You should have seen how wisely I proceeded — with what caution — with what <g word='foresight' ph='/ˈfɔːsaɪt/' type='noun' def='the ability to predict what will happen and plan carefully' ex='She acted with remarkable foresight in preparing for every eventuality.'>foresight</g> — with what <g word='dissimulation' ph='/ˈdɪsɪmjuleɪʃən/' type='noun' def='the concealment of one’s true thoughts or feelings' ex='His smile was pure dissimulation — beneath it, he was terrified.'>dissimulation</g>! I was never kinder to the old man than during the whole week before I killed him. And every night, about midnight, I turned the latch of his door and opened it — oh, so gently! And then, when I had made an opening sufficient for my head, I put in a dark <g word='lantern' ph='/ˈlæntən/' type='noun' def='a lamp enclosed in a transparent case with a handle' ex='The lantern’s single beam fell across the sleeping face.'>lantern</g> — all closed, so that no light shone out — and thrust in my head."], "glossary": [{"word": "sharpened", "ph": "/ˈʃɑːpənd/", "type": "verb", "def": "Made more intense, acute or sensitive.", "ex": "Fear sharpened her senses to an extraordinary degree."}, {"word": "dulled", "ph": "/dʌld/", "type": "verb", "def": "Made less sharp, sensitive or effective.", "ex": "Years of routine had dulled his ability to notice detail."}, {"word": "acute", "ph": "/əˈkjuːt/", "type": "adjective", "def": "(of senses) extremely sharp and perceptive.", "ex": "Her hearing was so acute she could detect a whisper from across the room."}, {"word": "conceived", "ph": "/kənˈsiːvd/", "type": "verb", "def": "Formed or developed as an idea in the mind.", "ex": "Once conceived, the plan could not be abandoned."}, {"word": "haunted", "ph": "/ˈhɔːntɪd/", "type": "verb", "def": "Troubled or disturbed the mind repeatedly.", "ex": "The memory haunted him for the rest of his life."}, {"word": "vulture", "ph": "/ˈvʌltʃə/", "type": "noun", "def": "A large bird that feeds on dead animals; here used to describe something cold and predatory.", "ex": "The pale, unblinking eye resembled that of a vulture."}, {"word": "foresight", "ph": "/ˈfɔːsaɪt/", "type": "noun", "def": "The ability to predict and plan for future events.", "ex": "She acted with remarkable foresight in preparing for every eventuality."}, {"word": "dissimulation", "ph": "/ˈdɪsɪmjuleɪʃən/", "type": "noun", "def": "The concealment of one’s true feelings or intentions.", "ex": "His smile was pure dissimulation — beneath it, he was terrified."}], "questions": [{"q": "How does the narrator try to convince the reader he is not mad? Is he convincing?", "keywords": ["sharpened", "dulled", "acute", "nervous", "mad", "senses", "healthily", "calmly"], "model": "He argues that his senses were sharpened, not dulled, by his condition — that a mad person could not observe so calmly and carefully. But the very intensity of his argument, and the repetition of words like ‘nervous’ and ‘dreadfully’, undermine him. He is deeply unconvincing.", "frQ": "Comment le narrateur essaie-t-il de convaincre le lecteur qu’il n’est pas fou ? Est-il convaincant ?", "frModel": "Il soutient que ses sens ont été aiguisés, pas émoussés — qu’une personne folle ne pourrait pas observer si calmement et précisément. Mais l’intensité même de son argument et la répétition de mots comme « nerveux » le trahissent. Il est profondément peu convaincant."}, {"q": "Why does the narrator decide to kill the old man? What is strange about his reason?", "keywords": ["eye", "vulture", "blood ran cold", "loved", "wronged", "insult", "gold", "passion", "object"], "model": "He kills the old man purely because of his eye — described as resembling a vulture’s. There is no motive of money, insult or hatred. He explicitly says he loved the man and was never wronged. The absence of rational motive is itself the horror: the crime comes entirely from inside his disturbed mind.", "frQ": "Pourquoi le narrateur décide-t-il de tuer le vieil homme ? Qu’est-ce qui est étrange dans son motif ?", "frModel": "Il tue le vieil homme uniquement à cause de son œil — décrit comme ressemblant à celui d’un vautour. Il n’y a pas de motif d’argent, d’insulte ni de haine. Il dit explicitement qu’il aimait l’homme. L’absence de motif rationnel est l’horreur elle-même : le crime vient entièrement de l’intérieur de son esprit perturbé."}, {"q": "Analyse Poe’s style in this extract. How does it create an effect of madness?", "keywords": ["dissimulation", "foresight", "haunted", "dashes", "repetition", "caution", "wisely", "never kinder"], "model": "Poe uses dashes, repetition and self-interruption to mimic a fractured, urgent mind. The narrator praises his own foresight and dissimulation while describing murder preparations. The phrase ‘never kinder than during the whole week before I killed him’ is deeply chilling because it is delivered with complete calm. The style makes the reader feel trapped inside a disturbed consciousness.", "frQ": "Analysez le style de Poe dans cet extrait. Comment crée-t-il un effet de folie ?", "frModel": "Poe utilise des tirets, des répétitions et des auto-interruptions pour imiter un esprit fragmenté et urgent. Le narrateur loue sa propre prévoyance et sa dissimulation tout en décrivant des préparatifs de meurtre. La phrase « jamais plus aimable que pendant toute la semaine avant que je le tue » est profondément glaçante car elle est délivrée avec un calme total."}], "writingPrompt": "Write a 80–100 word extract from the old man’s diary the week before his death. What does he notice about his carer’s behaviour? Use at least 2 words from the glossary.", "writingHints": ["Monday. Something is different about him today...", "He was kinder than ever, which for some reason made me feel...", "His eyes — I noticed his eyes when he brought my supper..."], "writingKeywords": ["haunted", "acute", "dissimulation", "vulture", "sharpened", "foresight"], "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>How does the narrator try to convince the reader he is not mad? Is he convincing?</em>", "pistes": ["Indice du premier paragraphe : « TRUE! — nervous — very, very dreadfully nervous I had been and am. But why will you say... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « He argues that his senses were sharpened, not dulled, by his condition — that a mad person could not observe so calmly... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« sharpened »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>Analyse Poe’s style in this extract. How does it create an effect of madness?</em>", "pistes": ["Mots-clés à observer : dissimulation, foresight, haunted, dashes", "Piste : « Poe uses dashes, repetition and self-interruption to mimic a fractured, urgent mind. The narrator praises his own foresight and dissimulation... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« sharpened »</strong>.", "pistes": ["Dans le texte : « ... am mad? The disease had sharpened my senses — not destroye... »", "Définition réelle : Made more intense, acute or sensitive.", "Exemple : « Fear sharpened her senses to an extraordinary degree. »"]}, "struct": {"feedback": "✅ Ce texte compte 3 paragraphes. Premier paragraphe : « TRUE! — nervous — very, very dreadfully nervous I had... ». Dernier paragraphe : « You should have seen how wisely I proceeded — with... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>Why does the narrator decide to kill the old man? What is strange about his reason?</em>", "pistes": ["Piste : « He kills the old man purely because of his eye — described as resembling a vulture’s. There is no motive of money,... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}, "isOriginal": true}, {"id": 303, "title": "The Importance of Being Earnest — A Serious Conversation", "eyebrow": "Contemporary Fiction", "level": "A2", "levelClass": "a2", "source": "Original extract (adapted) — Oscar Wilde, The Importance of Being Earnest (1895). Public domain.", "readTime": "4 min", "words": 240, "preview": "Algernon had not told the truth about his name. Gwendolen did not know this yet. But she was beginning to ask some very awkward questions...", "paragraphs": ["GWENDOLEN: I hope you do not mind my being <g word='frank' ph='/fræŋk/' type='adjective' def='direct and honest, even if the truth is difficult' ex='She was refreshingly frank about her opinion.'>frank</g>. My mother says I never do. I think she is right. I always say what I think. It is one of my few <g word='virtues' ph='/ˈˈvɜːtʃɪz/' type='noun (plural)' def='good moral qualities' ex='Honesty was his greatest virtue.'>virtues</g>. I am not sure that honesty is always <g word='fashionable' ph='/ˈfæʃənəbəl/' type='adjective' def='popular and accepted in society at a particular time' ex='Directness was not considered fashionable in polite Victorian society.'>fashionable</g> in London society. But I practise it all the same.", "JACK: You are <g word='perfectly' ph='/ˈpɜːfektli/' type='adverb' def='completely; used here for emphasis' ex='You are perfectly right, of course.'>perfectly</g> perfect, Miss Fairfax.", "GWENDOLEN: Oh! I hope I am not that. It would leave no room for <g word='improvement' ph='/ˈImˈpruːvmənt/' type='noun' def='the process of getting better' ex='There is always room for improvement.'>improvement</g>. I should be <g word='extremely' ph='/ɪkˈstriːmli/' type='adverb' def='to a very great degree' ex='I should be extremely sorry to hear that.'>extremely</g> sorry to hear that.", "JACK: Miss Fairfax, ever since I met you I have <g word='admired' ph='/ˈ ədˈmaɪəd/' type='verb' def='looked at or thought of something with pleasure and respect' ex='He had admired her intelligence from the beginning.'>admired</g> you more than any girl I have ever met since — well, ever since I met you.", "GWENDOLEN: Yes, I am quite well aware of the fact. And I often wish that in public, at any rate, you had been more <g word='demonstrative' ph='/ˈdɪˈmonstrətɪv/' type='adjective' def='showing feelings openly and clearly' ex='He was not naturally demonstrative, but today he made an effort.'>demonstrative</g>. For me you have always had an <g word='irresistible' ph='/ˈ ɪrɪˈzɪstɪbəl/' type='adjective' def='too strong or attractive to be resisted' ex='She found his wit irresistible.'>irresistible</g> <g word='fascination' ph='/ˈ fæsɪˈneɪʃən/' type='noun' def='a strong feeling of interest and attraction' ex='Gwendolen felt an irresistible fascination for the young man.'>fascination</g>. Even before I met you I was far from <g word='indifferent' ph='/ˈInˈdɪfərənt/' type='adjective' def='having no particular interest or feeling' ex='She was far from indifferent to his charm.'>indifferent</g> to you."], "glossary": [{"word": "frank", "ph": "/fræŋk/", "type": "adjective", "def": "Direct and honest, even when the truth is uncomfortable.", "ex": "She was refreshingly frank about her opinion of the plan."}, {"word": "virtues", "ph": "/ˈvɜːtʃɪz/", "type": "noun", "def": "Good moral qualities or admirable characteristics.", "ex": "Patience was not among his many virtues."}, {"word": "fashionable", "ph": "/ˈfæʃənəbəl/", "type": "adjective", "def": "Currently popular and accepted in society.", "ex": "Directness was not fashionable in polite society."}, {"word": "demonstrative", "ph": "/ˈdɪˈmonstrətɪv/", "type": "adjective", "def": "Openly showing feelings and emotions.", "ex": "He was not naturally demonstrative, but today he made an effort."}, {"word": "irresistible", "ph": "/ˈIrɪˈzɪstɪbəl/", "type": "adjective", "def": "So strong or attractive that it cannot be resisted.", "ex": "She found his charm irresistible."}, {"word": "fascination", "ph": "/ˈfæsɪˈneɪʃən/", "type": "noun", "def": "A powerful and lasting interest or attraction.", "ex": "She felt a fascination for the mysterious stranger."}, {"word": "indifferent", "ph": "/ˈInˈdɪfərənt/", "type": "adjective", "def": "Having no particular feeling or interest; unmoved.", "ex": "She was far from indifferent to his considerable charm."}], "questions": [{"q": "What does Gwendolen’s speech tell us about her character?", "keywords": ["frank", "virtues", "fashionable", "honesty", "mother", "I always say what I think"], "model": "Gwendolen presents herself as unusually direct and honest for her social class. She even acknowledges that honesty is not always fashionable in London society, but practises it anyway. This makes her both self-aware and subtly mocking of the hypocrisy around her.", "frQ": "Que nous dit le discours de Gwendolen sur son caractère ?", "frModel": "Gwendolen se présente comme inhabituellement directe et honnête pour sa classe sociale. Elle reconnaît même que l’honnêteté n’est pas toujours à la mode dans la société londonienne, mais la pratique quand même. Cela la rend à la fois consciente d’elle-même et subtilement moqueuse de l’hypocrisie qui l’entoure."}, {"q": "What is funny about Jack’s declaration ‘You are perfectly perfect’?", "keywords": ["perfectly", "perfect", "improvement", "admired", "room"], "model": "The compliment is so extreme as to be meaningless, and Gwendolen immediately deflates it: if she were perfect, there would be no room for improvement. Wilde uses her response to mock the empty compliments that were common in Victorian courtship, while making Gwendolen seem far sharper than Jack.", "frQ": "Qu’est-ce qui est drôle dans la déclaration de Jack « vous êtes parfaitement parfaite » ?", "frModel": "Le complément est si extrême qu’il ne signifie rien, et Gwendolen le dégonfle immédiatement : si elle était parfaite, il n’y aurait pas de place pour s’améliorer. Wilde utilise sa réponse pour se moquer des compliments vides qui étaient courants dans la cour victorienne."}, {"q": "What does Gwendolen mean when she says she was ‘far from indifferent’ before meeting Jack?", "keywords": ["indifferent", "fascination", "irresistible", "demonstrative", "aware", "fact", "always"], "model": "She means she was already attracted to him before they met — which implies she had heard of him or thought about him. Saying she was ‘far from indifferent’ is a deliberately understated way of saying she was very interested. Her tone throughout suggests she has been in control of this relationship from the beginning.", "frQ": "Que veut dire Gwendolen quand elle dit qu’elle était « loin d’être indifférente » avant de rencontrer Jack ?", "frModel": "Elle veut dire qu’elle était déjà attirée par lui avant de le rencontrer, ce qui implique qu’elle avait entendu parler de lui ou pensé à lui. Dire qu’elle était « loin d’être indifférente » est une façon délibérément sous-estimée de dire qu’elle était très intéressée. Son ton suggère qu’elle a toujours contrôlé cette relation."}], "writingPrompt": "Write a short dialogue (60–80 words) between two characters where one is very frank and the other is not very demonstrative. Use at least 2 words from the glossary.", "writingHints": ["A: I must be frank with you...", "B: I see. (long pause)", "A: You are not very demonstrative about this, are you?"], "writingKeywords": ["frank", "virtues", "fascination", "indifferent", "demonstrative", "irresistible"], "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>What does Gwendolen’s speech tell us about her character?</em>", "pistes": ["Indice du premier paragraphe : « GWENDOLEN: I hope you do not mind my being frank. My mother says I never do. I think... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « Gwendolen presents herself as unusually direct and honest for her social class. She even acknowledges that honesty is not always fashionable in... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« frank »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>What does Gwendolen mean when she says she was ‘far from indifferent’ before meeting Jack?</em>", "pistes": ["Mots-clés à observer : indifferent, fascination, irresistible, demonstrative", "Piste : « She means she was already attracted to him before they met — which implies she had heard of him or... »", "Demande-toi : pourquoi l’auteur ne dit-il pas cela directement ?"]}, "vocab": {"feedback": "✅ Parfait pour cette stratégie : le mot <strong>« frank »</strong>.", "pistes": ["Dans le texte : « ...you do not mind my being frank. My mother says I never ... »", "Définition réelle : Direct and honest, even when the truth is uncomfortable.", "Exemple : « She was refreshingly frank about her opinion of the plan. »"]}, "struct": {"feedback": "✅ Ce texte compte 5 paragraphes. Premier paragraphe : « GWENDOLEN: I hope you do not mind my being frank.... ». Dernier paragraphe : « GWENDOLEN: Yes, I am quite well aware of the fact.... »", "pistes": ["Chaque paragraphe a un rôle : introduire, développer, faire un pivot, conclure.", "Où le texte change-t-il de direction ou d’atmosphère ?", "Donne un titre court à chaque paragraphe."]}, "intent": {"feedback": "✅ Question d’auteur pour ce texte : <em>What does Gwendolen mean when she says she was ‘far from indifferent’ before meeting Jack?</em>", "pistes": ["Piste : « She means she was already attracted to him before they met — which implies she had heard of him or thought about... »", "Imagine le même passage avec un mot différent : qu’est-ce qui changerait ?", "Regarde le tout dernier mot du texte : c’est souvent le choix le plus délibéré."]}}, "isOriginal": true}, {"id": 304, "title": "The Call of the Wild — Into the North", "eyebrow": "Fantasy", "level": "B2", "levelClass": "b2", "source": "Original extract — Jack London, The Call of the Wild (1903). Public domain.", "readTime": "7 min", "words": 420, "preview": "Buck did not read the newspapers, or he would have known that trouble was brewing. Men had found gold in the Klondike, and thousands of men were rushing to the frozen north. These men wanted dogs — heavy dogs, with strong muscles and warm, long coats...", "paragraphs": ["Buck did not read the newspapers, or he would have known that trouble was brewing for all dogs with strong muscles and warm, long hair. This was because men had found gold in the Klondike, and because travel was possible only with dog-powered sleds, and because Buck was a <g word='splendid' ph='/ˈsplendɪd/' type='adjective' def='impressively large and strong; magnificent' ex='He was a splendid animal, full of energy and power.'>splendid</g> dog of one hundred and forty pounds.", "He was proud of his size and strength. He had been <g word='spoiled' ph='/ˈspɔɪld/' type='verb' def='given too much and allowed too much freedom' ex='He had been spoiled by four years of easy living.'>spoiled</g> by years of <g word='clement' ph='/ˈklemənt/' type='adjective' def='mild and pleasant; not harsh (of weather or conditions)' ex='Four years of clement California weather had made him soft.'>clement</g> weather. But the <g word='primitive' ph='/ˈprɪmɪtɪv/' type='adjective' def='relating to an early stage of development; basic and instinctive' ex='The primitive instinct stirred deep within him.'>primitive</g> instinct still slept within him, waiting.", "One night, <g word='Manuel' ph='/ˈmænjiʊəl/' type='proper noun' def='a character in the novel; a gardener’s helper' ex='Manuel was the gardener’s helper.'>Manuel</g>, one of the gardener’s helpers, had an unfortunate weakness for gambling. On this night, he led Buck to a <g word='wayside' ph='/ˈweɪsaɪd/' type='adjective' def='situated at the side of a road' ex='They stopped at a wayside station as darkness fell.'>wayside</g> station. A stranger was waiting. Money passed between them. When Buck <g word='resisted' ph='/ˈrɪzɪstɪd/' type='verb' def='fought against or struggled against something' ex='He resisted, but the rope held fast.'>resisted</g>, the noose tightened. He could not understand. He had never been <g word='betrayed' ph='/ˈbɪˈtreɪd/' type='verb' def='given up to an enemy; treated with disloyalty' ex='He had never been betrayed by those he trusted.'>betrayed</g> before.", "He was <g word='thrust' ph='/ˈθrʌst/' type='verb' def='pushed roughly and suddenly' ex='He was thrust into a crate and the lid was shut.'>thrust</g> into a <g word='crate' ph='/ˈkreɪt/' type='noun' def='a wooden box used for transporting animals or goods' ex='The crate was loaded onto a train heading north.'>crate</g> and shipped north. The man who handled him was <g word='brutal' ph='/ˈbruːtəl/' type='adjective' def='extremely cruel and rough' ex='The club-man was brutal but systematic.'>brutal</g>. He could not understand why. He had never known men like this. He had lived too long in a safe world. Now he would learn the law of club and fang. Now he would learn what it meant to be <g word='primitive' ph='/ˈprɪmɪtɪv/' type='adjective' def='basic; connected to ancient instincts of survival' ex='In the wild, only the primitive survived.'>primitive</g> again.", "And in the blood that ran through his veins ran the memory of long-dead ancestors who had lived in the wild. The call of that wild was strong. But it would take time, and great suffering, before Buck truly heard it."], "glossary": [{"word": "splendid", "ph": "/ˈsplendɪd/", "type": "adjective", "def": "Impressively large, strong or excellent.", "ex": "He was a splendid animal, powerful and full of life."}, {"word": "spoiled", "ph": "/ˈspɔɪld/", "type": "verb", "def": "Given excessive comfort or freedom; softened by easy living.", "ex": "Years of easy living had spoiled him for hardship."}, {"word": "clement", "ph": "/ˈklemənt/", "type": "adjective", "def": "Mild and pleasant in terms of weather or conditions.", "ex": "Four years of clement California weather had softened him."}, {"word": "primitive", "ph": "/ˈprɪmɪtɪv/", "type": "adjective", "def": "Basic and instinctive; connected to ancient survival drives.", "ex": "The primitive instinct stirred deep within him."}, {"word": "resisted", "ph": "/ˈrɪzɪstɪd/", "type": "verb", "def": "Fought against or struggled to oppose something.", "ex": "He resisted, but the rope held fast around his neck."}, {"word": "betrayed", "ph": "/ˈbɪˈtreɪd/", "type": "verb", "def": "Treated with disloyalty; handed over to danger by someone trusted.", "ex": "He had never been betrayed by those he trusted before."}, {"word": "brutal", "ph": "/ˈbruːtəl/", "type": "adjective", "def": "Extremely rough, cruel and without mercy.", "ex": "The treatment was brutal but coldly systematic."}, {"word": "crate", "ph": "/ˈkreɪt/", "type": "noun", "def": "A wooden box or container used to transport animals or goods.", "ex": "The crate was loaded onto the northbound train."}], "questions": [{"q": "How does London establish Buck’s character before his kidnapping? What is the effect of this on the reader?", "keywords": ["splendid", "spoiled", "clement", "primitive", "instinct", "proud", "size", "strength"], "model": "Buck is established as powerful and physically splendid, but also spoiled by easy living in clement California. London notes that primitive instinct sleeps within him, waiting. This contrast — between softness and hidden wildness — prepares the reader for Buck’s transformation. We understand both his vulnerability and his potential.", "frQ": "Comment London établit-il le caractère de Buck avant son enlèvement ? Quel est l’effet sur le lecteur ?", "frModel": "Buck est décrit comme puissant et physiquement magnifique, mais aussi gâté par une vie facile sous un climat clément en Californie. London note que l’instinct primitif sommeille en lui. Ce contraste — entre la douceur et la férocité cachée — prépare le lecteur à la transformation de Buck. On comprend à la fois sa vulnérabilité et son potentiel."}, {"q": "What makes Buck’s betrayal so effective dramatically?", "keywords": ["betrayed", "trusted", "never", "Manuel", "gambling", "money", "understood", "noose"], "model": "The betrayal is effective because it comes from within Buck’s own household — someone he trusted. He cannot understand it, because he has never experienced disloyalty. The gap between his trust and the reality of what is happening, shown through his confusion as the noose tightens, creates both pathos and dramatic irony.", "frQ": "Qu’est-ce qui rend la trahison de Buck si dramatiquement efficace ?", "frModel": "La trahison est efficace car elle vient de l’intérieur du foyer de Buck — quelqu’un en qui il avait confiance. Il ne peut pas la comprendre car il n’a jamais connu la déloyauté. Le fossé entre sa confiance et la réalité de ce qui se passe crée à la fois de la pathétique et de l’ironie dramatique."}, {"q": "London ends with ‘the call of the wild’. What does this phrase mean, and how does the extract prepare us for it?", "keywords": ["primitive", "ancestors", "blood", "wild", "suffering", "time", "call", "law", "fang"], "model": "The phrase refers to the deep, inherited instinct for the wild that Buck carries in his blood from ancestral wolves. London prepares us for it by establishing the contrast between Buck’s soft present life and the primitive sleeping inside him. The brutal shock of kidnapping and northward shipping will awaken what civilisation had suppressed.", "frQ": "London termine avec « l’appel de la forêt ». Que signifie cette phrase, et comment l’extrait nous y prépare-t-il ?", "frModel": "La phrase fait référence à l’instinct profond et hérité pour la nature sauvage que Buck porte dans son sang depuis ses ancêttres loups. London nous y prépare en établissant le contraste entre la vie douce actuelle de Buck et le primitif qui sommeille en lui. Le choc brutal de l’enlèvement va réveiller ce que la civilisation avait supprimé."}], "writingPrompt": "Write 100–120 words from Buck’s point of view on his first night in the crate, heading north. What does he think? What does he feel? Use at least 3 words from the glossary.", "writingHints": ["The dark was complete. The floor moved under me...", "I had never known a man to be brutal before...", "Something in the cold air stirred something I did not recognise..."], "writingKeywords": ["betrayed", "brutal", "primitive", "crate", "splendid", "spoiled", "resisted"], "strategies": {"skim": {"feedback": "✅ Après ton survol, tu devrais pouvoir répondre : <em>How does London establish Buck’s character before his kidnapping? What is the effect of this on the reader?</em>", "pistes": ["Indice du premier paragraphe : « Buck did not read the newspapers, or he would have known that trouble was brewing for all dogs... »", "As-tu identifié le genre du texte ? (roman, article, dialogue, récit…)", "Piste de réponse : « Buck is established as powerful and physically splendid, but also spoiled by easy living in clement California. London notes that primitive instinct... »"]}, "scan": {"feedback": "✅ Dans ce texte, un bon exemple : le mot <strong>« splendid »</strong>. Où l’as-tu trouvé ?", "pistes": ["Quel indice visuel t’a aidé ? (majuscule, chiffre, italique, guillemets…)", "Le scanning ne demande pas de tout lire : fais glisser ton regard.", "Essaie de localiser une deuxième information sans relire depuis le début."]}, "infer": {"feedback": "✅ La grande question d’inférence de ce texte : <em>London ends with ‘the call of the wild’. What does this phrase mean, and how does the extract prepare us for it?</em>", "pistes": ["Mots-clés à obs
